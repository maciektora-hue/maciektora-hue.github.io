name: AuDHD lifting 4 - bezposredni link do 20 prac

on:
  push:
    paths:
      - '.github/workflows/lift-audhd-index.yml'

permissions:
  contents: write

jobs:
  lift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zamien redirect na plik docelowy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('audhd/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'opis-po-ludzku-20-prac-naukowych.html'
          new = 'apendyks1-po-ludzku-02_01-2026-08-26.html'
          count = s.count(old)
          if count == 0:
              raise SystemExit('Nie znaleziono starego linku')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print(f'Zamieniono linkow: {count}')
          PY

      - name: Zapisz punkt 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audhd/index.html
          git diff --cached --quiet && exit 0
          git commit -m "AuDHD: linkuj 20 prac bezposrednio"
          git push
