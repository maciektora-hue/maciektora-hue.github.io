name: AuDHD lifting 5 - czysty link ESEJ

on:
  push:
    paths:
      - '.github/workflows/lift-audhd-index.yml'

permissions:
  contents: write

jobs:
  lift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wyczysc zakodowana nazwe ESEJ
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('audhd/index.html')
          s = p.read_text(encoding='utf-8')
          old = '%45%53%45%4A_architektury-pamieci-1_02-2026-04-28.html'
          new = 'ESEJ_architektury-pamieci-1_02-2026-04-28.html'
          count = s.count(old)
          if count == 0:
              raise SystemExit('Nie znaleziono zakodowanego linku ESEJ')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print(f'Wyczyszczono linkow: {count}')
          PY

      - name: Zapisz punkt 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audhd/index.html
          git diff --cached --quiet && exit 0
          git commit -m "AuDHD: wyczysc link do ESEJ architektury pamieci"
          git push
