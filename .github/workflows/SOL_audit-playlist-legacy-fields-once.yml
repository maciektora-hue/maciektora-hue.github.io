name: SOL audit playlist legacy fields once

on:
  push:
    paths:
      - '.github/workflows/SOL_audit-playlist-legacy-fields-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit operational references
        id: audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          exts = {'.py', '.html', '.js', '.sql', '.yml', '.yaml'}
          excluded_prefixes = (
              'piosenki/migrations/',
              'dane-robocze/',
              'dane-archiwalne/',
              'dokumentacja-archiwalna/',
          )
          excluded_exact = {
              'piosenki/schema.sql',
              '.github/workflows/SOL_audit-playlist-legacy-fields-once.yml',
          }
          direct_tokens = ('source_name', 'source_artist', 'source_album', 'external_track_id')

          suspicious = []
          scanned = 0
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              rel = p.as_posix().lstrip('./')
              if rel in excluded_exact or rel.startswith(excluded_prefixes):
                  continue
              scanned += 1
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              hits = [t for t in direct_tokens if t in text]
              # Stary utwu_id w playlist_item jest podejrzany tylko, gdy plik faktycznie odwołuje się do playlist_item.
              if 'playlist_item' in text and re.search(r'playlist_item[\s\S]{0,1200}utwu_id|utwu_id[\s\S]{0,1200}playlist_item', text):
                  hits.append('playlist_item↔utwu_id')
              if hits:
                  suspicious.append((rel, sorted(set(hits))))

          print(f'PLAYLIST_LEGACY_AUDIT scanned_files={scanned} suspicious_files={len(suspicious)}')
          for rel, hits in suspicious:
              print(f'SUSPICIOUS {rel}: {", ".join(hits)}')
          if not suspicious:
              print('PLAYLIST_LEGACY_AUDIT_OK no operational readers of legacy playlist_item fields found')
          else:
              print('PLAYLIST_LEGACY_AUDIT_REVIEW legacy references still exist outside schema/migrations/data archives')
          PY

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/SOL_audit-playlist-legacy-fields-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time playlist legacy-field audit"
            git push
          fi
