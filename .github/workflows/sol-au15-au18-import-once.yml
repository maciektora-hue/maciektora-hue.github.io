name: SOL AU15-AU18 import once

on:
  push:
    paths:
      - '.github/workflows/sol-au15-au18-import-once.yml'

permissions:
  contents: read

jobs:
  import-au15-au18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libsql
        run: pip install libsql

      - name: Import and verify AU15-AU18 keyword assignments
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from collections import defaultdict
          import libsql

          expected = defaultdict(list)
          for line in Path('.github/sol-data/au15-au18-expected.tsv').read_text(encoding='utf-8').splitlines():
              code, so, ko, cid, key = line.split('\t')
              expected[code].append((int(so), int(ko), int(cid), key))

          specs = {
              'AU15': (22, 87),
              'AU16': (62, 258),
              'AU17': (9, 36),
              'AU18': (11, 48),
          }
          if set(expected) != set(specs):
              raise RuntimeError(f'Document set mismatch: {sorted(expected)}')
          if sum(len(v) for v in expected.values()) != 429:
              raise RuntimeError(f'Expected 429 assignments total, got {sum(len(v) for v in expected.values())}')

          token = os.environ.get('TURSO_AUTH_TOKEN')
          if not token:
              raise RuntimeError('BRAK SECRETU TURSO_ADMIN_TOKEN')

          conn = libsql.connect(database=os.environ['TURSO_DATABASE_URL'], auth_token=token)
          conn.execute('PRAGMA foreign_keys = ON')

          # Read the concept dictionary once instead of making 429 remote lookups.
          live_concepts = {
              int(cid): key for cid, key in conn.execute(
                  'SELECT concept_id, concept_key FROM content_keyword_concepts'
              ).fetchall()
          }

          document_ids = {}
          section_maps = {}
          to_insert = []
          states = {}

          for code in ('AU15', 'AU16', 'AU17', 'AU18'):
              section_count, assignment_count = specs[code]
              rows = expected[code]
              if len(rows) != assignment_count:
                  raise RuntimeError(f'{code}: expected {assignment_count} assignments, got {len(rows)}')
              if len({(r[0], r[1]) for r in rows}) != assignment_count:
                  raise RuntimeError(f'{code}: duplicate (section_order, keyword_order)')
              if len({(r[0], r[2]) for r in rows}) != assignment_count:
                  raise RuntimeError(f'{code}: duplicate (section_order, concept_id)')

              docs = conn.execute(
                  "SELECT document_id FROM content_documents WHERE collection_id='audhd' AND document_code=?",
                  (code,),
              ).fetchall()
              if len(docs) != 1:
                  raise RuntimeError(f'{code}: document count != 1: {docs!r}')
              document_id = int(docs[0][0])
              document_ids[code] = document_id

              sections = conn.execute(
                  'SELECT section_id, section_order FROM content_sections WHERE document_id=? ORDER BY section_order',
                  (document_id,),
              ).fetchall()
              if len(sections) != section_count:
                  raise RuntimeError(f'{code}: section count != {section_count}: {len(sections)}')
              section_id_by_order = {int(order): int(section_id) for section_id, order in sections}
              if set(section_id_by_order) != set(range(1, section_count + 1)):
                  raise RuntimeError(f'{code}: section orders invalid: {sorted(section_id_by_order)}')
              section_maps[code] = section_id_by_order

              for _, _, concept_id, concept_key in rows:
                  actual_key = live_concepts.get(concept_id)
                  if actual_key != concept_key:
                      raise RuntimeError(
                          f'{code}: concept mismatch id={concept_id} expected={concept_key!r} actual={actual_key!r}'
                      )

              existing = conn.execute(
                  '''SELECT s.section_order, k.keyword_order, k.concept_id
                     FROM content_section_keywords k
                     JOIN content_sections s ON s.section_id=k.section_id
                     WHERE s.document_id=?
                     ORDER BY s.section_order, k.keyword_order''',
                  (document_id,),
              ).fetchall()
              expected_triples = sorted((so, ko, cid) for so, ko, cid, _ in rows)
              existing_triples = sorted((int(a), int(b), int(c)) for a, b, c in existing)

              if existing_triples:
                  if existing_triples != expected_triples:
                      raise RuntimeError(f'{code}: existing assignments mismatch: count={len(existing_triples)}')
                  states[code] = 'already'
              else:
                  states[code] = 'insert'
                  to_insert.extend(
                      (section_id_by_order[so], cid, ko)
                      for so, ko, cid, _ in rows
                  )

          if to_insert:
              try:
                  conn.execute('BEGIN TRANSACTION')
                  conn.executemany(
                      'INSERT INTO content_section_keywords (section_id, concept_id, keyword_order) VALUES (?, ?, ?)',
                      to_insert,
                  )
                  conn.commit()
              except Exception:
                  conn.rollback()
                  raise

          total = 0
          for code in ('AU15', 'AU16', 'AU17', 'AU18'):
              section_count, assignment_count = specs[code]
              document_id = document_ids[code]
              rows = expected[code]
              actual = conn.execute(
                  '''SELECT s.section_order, k.keyword_order, k.concept_id
                     FROM content_section_keywords k
                     JOIN content_sections s ON s.section_id=k.section_id
                     WHERE s.document_id=?
                     ORDER BY s.section_order, k.keyword_order''',
                  (document_id,),
              ).fetchall()
              expected_triples = sorted((so, ko, cid) for so, ko, cid, _ in rows)
              actual_triples = sorted((int(a), int(b), int(c)) for a, b, c in actual)
              if actual_triples != expected_triples:
                  raise RuntimeError(
                      f'{code}: post-import verification mismatch expected={assignment_count} actual={len(actual_triples)}'
                  )
              if states[code] == 'already':
                  print(f'{code}_ALREADY_OK count={assignment_count} document_id={document_id}')
              else:
                  print(f'{code}_IMPORT_OK count={assignment_count} document_id={document_id}')
              total += assignment_count

          print(f'AU15_AU18_IMPORT_OK count={total}')
          conn.close()
          PY
