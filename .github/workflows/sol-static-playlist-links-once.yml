name: SOL static playlist links once

on:
  push:
    paths:
      - 'piosenki/sol_patch_playlist_links_once.py'
      - '.github/workflows/sol-static-playlist-links-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch four HTML pages
        run: python piosenki/sol_patch_playlist_links_once.py
      - name: Verify and commit
        run: |
          grep -q 'STATIC-PLAYLIST-LINKS' piosenki/audio.html
          grep -q 'STATIC-PLAYLIST-LINKS' piosenki/audio-en.html
          grep -q 'STATIC-PLAYLIST-LINKS' piosenki/SOL-klastrowanie-audio-wyniki-dwa-glosy-v01-2026-09-08.html
          grep -q 'STATIC-PLAYLIST-LINKS' piosenki/SOL-audio-clustering-three-island-signatures-two-voices-v01-2026-09-08-en.html
          rm piosenki/sol_patch_playlist_links_once.py
          rm .github/workflows/sol-static-playlist-links-once.yml
          git config user.name SOL
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'SOL: surface Spotify and YouTube playlist links'
          git push
