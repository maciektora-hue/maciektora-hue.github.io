name: SOL audio feature snapshots export once

on:
  push:
    paths:
      - '.github/workflows/sol-audio-feature-snapshots-export-once.yml'

permissions:
  contents: read

jobs:
  export-audio-feature-snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libsql
        run: pip install libsql

      - name: Export audio feature snapshots to Turso
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: python -u piosenki/SOL_export-audio-feature-snapshots-v01.py
