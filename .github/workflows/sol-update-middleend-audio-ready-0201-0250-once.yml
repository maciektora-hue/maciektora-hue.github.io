name: SOL update middle_end audio READY 0201-0250 once

on:
  push:
    paths:
      - '.github/workflows/sol-update-middleend-audio-ready-0201-0250-once.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsql
        run: pip install libsql
      - name: Update 43 READY rows
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -u piosenki/SOL_update-middleend-audio-ready-v02.py \
            --source piosenki/audio_middleend_ready_0201_0250.tsv \
            --expected 43
