name: SOL match audio middle_end 0151-0200 once

on:
  push:
    paths:
      - '.github/workflows/sol-match-audio-middleend-0151-0200-once.yml'

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate matches
        run: python piosenki/SOL_match-audio-middleend-0151-0200-v01.py
      - name: Commit candidates TSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/audio_middleend_candidates_0151_0200.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Add audio-middle_end candidates 0151-0200"
          git push
