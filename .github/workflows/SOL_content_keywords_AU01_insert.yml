name: SOL content keywords AU01 - insert

on:
  push:
    branches:
      - sql-audhd-content
    paths:
      - '.github/workflows/SOL_content_keywords_AU01_insert.yml'

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zainstaluj klienta libSQL
        run: npm install --no-save @libsql/client
      - name: Wstaw 10 przypisan AU01
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { createClient } = require('@libsql/client');

          function stop(msg) { throw new Error('STOP AU01 INSERT: ' + msg); }
          function hashRows(rows) {
            const normalized = rows.map(row => {
              const out = {};
              for (const [k, v] of Object.entries(row)) out[k] = v == null ? null : String(v);
              return out;
            });
            return crypto.createHash('sha256').update(JSON.stringify(normalized)).digest('hex');
          }
          async function snapshot(client) {
            const s = await client.execute(`
              SELECT section_id, document_id, parent_section_id, section_kind,
                     heading_level, depth, section_order, structure_order,
                     section_title, section_title_en, anchor,
                     description, description_en, keywords_pl, keywords_en,
                     content_html
              FROM content_sections ORDER BY section_id
            `);
            const d = await client.execute(`
              SELECT document_id, collection_id, document_code, source_filename,
                     document_title, canonical_url, source_url, sort_order
              FROM content_documents ORDER BY document_id
            `);
            return { sCount: s.rows.length, sHash: hashRows(s.rows), dCount: d.rows.length, dHash: hashRows(d.rows) };
          }

          async function main() {
            const creds = fs.readFileSync('daneDoSql.txt', 'utf8');
            const urlMatch = creds.match(/libsql:\/\/[^\s]+/);
            const tokenMatch = creds.match(/eyJ[a-zA-Z0-9._-]+/);
            if (!urlMatch || !tokenMatch) stop('brak URL lub tokena');
            const client = createClient({ url: urlMatch[0], authToken: tokenMatch[0] });

            const marker = await client.execute({
              sql: 'SELECT value FROM content_meta WHERE key = ?',
              args: ['content_keywords_data_v1']
            });
            if (marker.rows.length !== 1 || String(marker.rows[0].value) !== 'done') stop('brak content_keywords_data_v1=done');

            const sectionsQ = await client.execute({
              sql: `SELECT s.section_id, s.section_order, s.anchor
                    FROM content_sections s
                    JOIN content_documents d ON d.document_id=s.document_id
                    WHERE d.collection_id='audhd' AND d.document_code='AU01'
                    ORDER BY s.section_order`,
              args: []
            });
            if (sectionsQ.rows.length !== 3) stop(`AU01 ma ${sectionsQ.rows.length} sekcji zamiast 3`);
            const secByAnchor = Object.fromEntries(sectionsQ.rows.map(r => [String(r.anchor), Number(r.section_id)]));
            const expectedAnchors = ['63-cechy-rdzen-czy-maskowanie','lista','podsumowanie-rachunku'];
            for (const a of expectedAnchors) if (!secByAnchor[a]) stop(`brak sekcji ${a}`);

            const existing = await client.execute({
              sql: 'SELECT count(*) AS n FROM content_section_keywords WHERE section_id IN (?,?,?)',
              args: expectedAnchors.map(a => secByAnchor[a])
            });
            if (Number(existing.rows[0].n) !== 0) stop(`AU01 ma juz ${existing.rows[0].n} przypisan`);

            const plan = [
              ['63-cechy-rdzen-czy-maskowanie', 1, 'audhd_core_features'],
              ['63-cechy-rdzen-czy-maskowanie', 2, 'camouflaging'],
              ['63-cechy-rdzen-czy-maskowanie', 3, 'neurobiology'],
              ['63-cechy-rdzen-czy-maskowanie', 4, 'patterns_of_functioning'],
              ['lista', 1, 'information_processing'],
              ['lista', 2, 'bottom_up_processing'],
              ['lista', 3, 'monotropism'],
              ['lista', 4, 'cognitive_architecture'],
              ['podsumowanie-rachunku', 1, 'audhd_core_features'],
              ['podsumowanie-rachunku', 2, 'camouflaging']
            ];

            const keys = [...new Set(plan.map(x => x[2]))];
            const qp = keys.map(() => '?').join(',');
            const cq = await client.execute({
              sql: `SELECT concept_id, concept_key FROM content_keyword_concepts WHERE concept_key IN (${qp})`,
              args: keys
            });
            if (cq.rows.length !== keys.length) stop(`znaleziono ${cq.rows.length}/${keys.length} concept_key`);
            const cid = Object.fromEntries(cq.rows.map(r => [String(r.concept_key), Number(r.concept_id)]));

            const before = await snapshot(client);
            const statements = plan.map(([anchor, order, key]) => ({
              sql: `INSERT INTO content_section_keywords(section_id, concept_id, keyword_order) VALUES (?, ?, ?)`,
              args: [secByAnchor[anchor], cid[key], order]
            }));
            await client.batch(statements, 'write');

            const check = await client.execute({
              sql: `SELECT sk.section_id, sk.keyword_order, c.concept_key
                    FROM content_section_keywords sk
                    JOIN content_keyword_concepts c ON c.concept_id=sk.concept_id
                    WHERE sk.section_id IN (?,?,?)
                    ORDER BY sk.section_id, sk.keyword_order`,
              args: expectedAnchors.map(a => secByAnchor[a])
            });
            if (check.rows.length !== 10) stop(`po imporcie AU01 ma ${check.rows.length} przypisan zamiast 10`);

            const counts = new Map();
            for (const r of check.rows) {
              const sid = Number(r.section_id);
              if (!counts.has(sid)) counts.set(sid, []);
              counts.get(sid).push(Number(r.keyword_order));
            }
            const wanted = new Map([
              [secByAnchor['63-cechy-rdzen-czy-maskowanie'], [1,2,3,4]],
              [secByAnchor['lista'], [1,2,3,4]],
              [secByAnchor['podsumowanie-rachunku'], [1,2]]
            ]);
            for (const [sid, orders] of wanted) {
              const got = counts.get(sid) || [];
              if (JSON.stringify(got) !== JSON.stringify(orders)) stop(`zla kolejnosc dla section_id=${sid}: ${got}`);
            }

            const after = await snapshot(client);
            if (before.sCount !== after.sCount || before.sHash !== after.sHash) stop('content_sections zmienione');
            if (before.dCount !== after.dCount || before.dHash !== after.dHash) stop('content_documents zmienione');

            console.log('OK AU01 INSERT: 10 przypisan; sekcje 4/4/2; zakres 1-5 zachowany; content_sections i content_documents IDENTYCZNE.');
            for (const r of check.rows) console.log(`LINK section_id=${r.section_id}; order=${r.keyword_order}; concept_key=${r.concept_key}`);
          }

          main().catch(err => { console.error(err.message); process.exit(1); });
          NODE