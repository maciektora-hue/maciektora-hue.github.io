name: SOL update middle_end audio 0301-0950 sequential

on:
  push:
    paths:
      - '.github/workflows/sol-update-middleend-audio-0301-0950-sequential.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsql
        run: pip install libsql
      - name: Extract remaining batches
        run: |
          mkdir -p /tmp/audio-sql
          unzip -j piosenki/SOL_audio-SQL-wszystkie.zip \
            'SOL_audio-SQL-READY-0301-0350.tsv' 'SOL_audio-SQL-REVIEW-0301-0350.tsv' \
            'SOL_audio-SQL-READY-0351-0400.tsv' 'SOL_audio-SQL-REVIEW-0351-0400.tsv' \
            'SOL_audio-SQL-READY-0401-0450.tsv' 'SOL_audio-SQL-REVIEW-0401-0450.tsv' \
            'SOL_audio-SQL-READY-0451-0500.tsv' 'SOL_audio-SQL-REVIEW-0451-0500.tsv' \
            'SOL_audio-SQL-READY-0501-0550.tsv' 'SOL_audio-SQL-REVIEW-0501-0550.tsv' \
            'SOL_audio-SQL-READY-0551-0600.tsv' 'SOL_audio-SQL-REVIEW-0551-0600.tsv' \
            'SOL_audio-SQL-READY-0601-0650.tsv' 'SOL_audio-SQL-REVIEW-0601-0650.tsv' \
            'SOL_audio-SQL-READY-0651-0700.tsv' 'SOL_audio-SQL-REVIEW-0651-0700.tsv' \
            'SOL_audio-SQL-READY-0701-0750.tsv' 'SOL_audio-SQL-REVIEW-0701-0750.tsv' \
            'SOL_audio-SQL-READY-0751-0800.tsv' 'SOL_audio-SQL-REVIEW-0751-0800.tsv' \
            'SOL_audio-SQL-READY-0801-0850.tsv' 'SOL_audio-SQL-REVIEW-0801-0850.tsv' \
            'SOL_audio-SQL-READY-0851-0900.tsv' 'SOL_audio-SQL-REVIEW-0851-0900.tsv' \
            'SOL_audio-SQL-READY-0901-0950.tsv' 'SOL_audio-SQL-REVIEW-0901-0950.tsv' \
            -d /tmp/audio-sql

      - name: 0301-0350 READY 33
        env: &turso
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: python -u piosenki/SOL_update-middleend-audio-ready-v02.py --source /tmp/audio-sql/SOL_audio-SQL-READY-0301-0350.tsv --expected 33
      - name: 0301-0350 REVIEW 13
        env: *turso
        run: python -u piosenki/SOL_update-middleend-audio-review-v02.py --source /tmp/audio-sql/SOL_audio-SQL-REVIEW-0301-0350.tsv --expected 13

      - name: 0351-0400 READY 40
