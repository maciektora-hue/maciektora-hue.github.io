name: SOL audio → middle_end match once

on:
  push:
    paths:
      - '.github/workflows/sol-audio-middle-match-once.yml'

permissions:
  contents: read

jobs:
  match-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install libsql rapidfuzz

      - name: Match audio to middle_end in batches of 50
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: python -u piosenki/SOL_match-audio-middle-end-v01.py
