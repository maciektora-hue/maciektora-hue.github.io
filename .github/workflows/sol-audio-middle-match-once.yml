name: SOL audio → middle_end match once

on:
  push:
    paths:
      - '.github/workflows/sol-audio-middle-match-once.yml'

permissions:
  contents: read

jobs:
  match-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libsql
        run: pip install libsql

      - name: Add columns and match exact artist+title in batches
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python -u - <<'PY'
          import os, re, unicodedata
          from collections import defaultdict
          import libsql

          BATCH = 50

          def norm(s):
              s = '' if s is None else str(s)
              s = unicodedata.normalize('NFKD', s)
              s = ''.join(ch for ch in s if not unicodedata.combining(ch))
              s = s.casefold()
              return ''.join(ch for ch in s if ch.isalnum())

          def audio_body(filename):
              s = re.sub(r'^\d+\s*-\s*', '', filename)
              s = re.sub(r'\s*\[[A-Za-z0-9_-]{11}\]\.[^.]+$', '', s)
              return s

          token = os.environ.get('TURSO_AUTH_TOKEN')
          if not token:
              raise RuntimeError('BRAK SECRETU TURSO_ADMIN_TOKEN')

          conn = libsql.connect(database=os.environ['TURSO_DATABASE_URL'], auth_token=token)
          conn.execute('PRAGMA foreign_keys = ON')

          cols = {r[1] for r in conn.execute('PRAGMA table_info(middle_end)').fetchall()}
          additions = [
              ('audio_id', 'ALTER TABLE middle_end ADD COLUMN audio_id TEXT REFERENCES audio(audio_id)'),
              ('youtube_video_id', 'ALTER TABLE middle_end ADD COLUMN youtube_video_id TEXT'),
              ('audio_match_quality', 'ALTER TABLE middle_end ADD COLUMN audio_match_quality TEXT'),
          ]
          for name, sql in additions:
              if name not in cols:
                  conn.execute(sql)
                  conn.commit()
                  print(f'COLUMN_ADDED={name}', flush=True)

          middle = conn.execute('''
              SELECT utwu_id, title_original, title_normalized, title_parsed,
                     artist_original, artist_normalized, artist_parsed, audio_id
              FROM middle_end
          ''').fetchall()
          audio = conn.execute('''
              SELECT audio_id, source_filename, youtube_video_id
              FROM audio
          ''').fetchall()

          audio_by_key = defaultdict(list)
          for aid, filename, ytid in audio:
              key = norm(audio_body(filename))
              if key:
                  audio_by_key[key].append((aid, filename, ytid))

          middle_keys = defaultdict(list)
          row_keys = {}
          for row in middle:
              utwu_id, t0, tn, tp, a0, an, ap, existing_audio = row
              if existing_audio:
                  continue
              keys = set()
              for artist, title in ((a0,t0),(an,tn),(ap,tp)):
                  if artist and title:
                      k = norm(f'{artist} - {title}')
                      if k:
                          keys.add(k)
                          middle_keys[k].append(utwu_id)
              row_keys[utwu_id] = keys

          provisional = []
          for utwu_id, keys in row_keys.items():
              candidates = set()
              by_audio = {}
              for k in keys:
                  if len(middle_keys[k]) != 1:
                      continue
                  for arow in audio_by_key.get(k, []):
                      candidates.add(arow[0])
                      by_audio[arow[0]] = arow
              if len(candidates) == 1:
                  aid = next(iter(candidates))
                  provisional.append((utwu_id, by_audio[aid]))

          reverse = defaultdict(list)
          for utwu_id, arow in provisional:
              reverse[arow[0]].append((utwu_id, arow))

          matches = []
          for aid, items in reverse.items():
              if len(items) == 1:
                  utwu_id, arow = items[0]
                  matches.append((utwu_id, arow[0], arow[2]))

          matches.sort()
          print(f'EXACT_UNIQUE_MATCHES={len(matches)}', flush=True)

          done = 0
          for start in range(0, len(matches), BATCH):
              batch = matches[start:start+BATCH]
              for utwu_id, aid, ytid in batch:
                  conn.execute('''
                      UPDATE middle_end
                      SET audio_id = ?, youtube_video_id = ?, audio_match_quality = 'exact'
                      WHERE utwu_id = ? AND audio_id IS NULL
                  ''', (aid, ytid, utwu_id))
              conn.commit()
              done += len(batch)
              print(f'{done}/{len(matches)} zapisane', flush=True)

          matched = conn.execute("SELECT COUNT(*) FROM middle_end WHERE audio_id IS NOT NULL").fetchone()[0]
          youtube_filled = conn.execute("SELECT COUNT(*) FROM middle_end WHERE youtube_video_id IS NOT NULL").fetchone()[0]
          exact = conn.execute("SELECT COUNT(*) FROM middle_end WHERE audio_match_quality='exact'").fetchone()[0]
          dangling = conn.execute('''
              SELECT COUNT(*)
              FROM middle_end m LEFT JOIN audio a ON a.audio_id=m.audio_id
              WHERE m.audio_id IS NOT NULL AND a.audio_id IS NULL
          ''').fetchone()[0]
          print(f'MIDDLE_END_AUDIO_MATCHED={matched}', flush=True)
          print(f'MIDDLE_END_YOUTUBE_FILLED={youtube_filled}', flush=True)
          print(f'MIDDLE_END_AUDIO_EXACT={exact}', flush=True)
          print(f'DANGLING_AUDIO_FK={dangling}', flush=True)
          print('AUDIO_MIDDLE_MATCH_OK', flush=True)
          conn.close()
          PY
