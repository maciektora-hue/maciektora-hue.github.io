name: SOL inspect playlist XLSX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_inspect-playlist-xlsx.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install openpyxl
        run: pip install -q openpyxl
      - name: Inspect workbooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          import json

          root = Path('dane-robocze/playlistyspotifybestof')
          out = []
          for p in sorted(root.glob('*.xlsx')):
              wb = load_workbook(p, read_only=True, data_only=True)
              item = {'file': p.name, 'sheets': []}
              for ws in wb.worksheets:
                  rows = []
                  for i, row in enumerate(ws.iter_rows(values_only=True), start=1):
                      rows.append([None if v is None else str(v) for v in row])
                      if i >= 6:
                          break
                  item['sheets'].append({
                      'name': ws.title,
                      'max_row': ws.max_row,
                      'max_column': ws.max_column,
                      'sample_rows_1_6': rows,
                  })
              out.append(item)
          Path('dane-robocze/SOL_TMP_playlist_xlsx_inspection.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dane-robocze/SOL_TMP_playlist_xlsx_inspection.json
          git commit -m 'Temporary XLSX playlist inspection' || exit 0
          git push
