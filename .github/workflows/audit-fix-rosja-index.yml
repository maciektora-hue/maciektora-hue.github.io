name: Rosja - audyt i poprawka index.html

on:
  push:
    paths:
      - '.github/workflows/audit-fix-rosja-index.yml'

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audytuj i popraw oznaczenia dokumentow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('rosja/index.html')
          s = p.read_text(encoding='utf-8')
          before = s

          targets = {
              'A1': 'a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31.html',
              'A2': 'a2_ZAMROZONE-maj-2026-gradually-stalo-sie-suddenly-v25_00-2026-06-25.html',
              'A3': 'a3_ZAMROZONE-lista-celow-v19_00-2026-06-25.html',
              'A4': 'a4_lipiec-2026-przejscie-na-hurt-v20_11-2026-08-01.html',
              'A5': 'a5_ZAMROZONE-audyt-2rewizje-v03_00-2026-06-23.html',
              'A6': 'a6_ZAMROZONE-zapas-kontra-strumien-v02_00-2026-07-03.html',
              'A7': 'a7_ZAMROZONE-jak-koncza-sie-panstwa-v02_00-2026-06-28.html',
              'D1': 'd1-zamrozone-narzedzie-dark-legitimacy-horbyk-v01_00-2026-03-25.html',
              'D2': 'd2-zamrozone-narzedzie-disinfolklore-kompilacja-v01_00-2026-03-25.html',
              'D3': 'd3-zamrozone-narzedzie-disinfolklore-swot-advocatus-v01_00-2026-03-25.html',
              'D4': 'd4-zamrozone-rosyjskie-samobojstwa-taksonomia-v08_01-2026-06-13.html',
              'D5': 'd5-zamrozone-putin-cornered-animal-v03_00-2026-03-24.html',
              'D6': 'd6-zamrozone-jalta-3-analiza-strategiczna-v01_00-2026-03-08.html',
              'D7': 'd7-zamrozone-jalta-3-apendyks-v01_00-2026-03-08.html',
              'E1': 'ropa-gaz-geopolityka-analiza-v01_00-2026-03-17.html',
              'E2': 'monopole-moralnosc-transformacja-zrodla-v01_00-2026-03-17.html',
          }

          # 1. Kody w naglowkach kart byly celowo pozbawione obramowania.
          #    Zostawiamy ich rozmiar, ale przywracamy prawdziwe kapsulki.
          s = re.sub(
              r'\n\s*\.doc-code \.inline-ref \{.*?\.doc-code \.inline-ref:hover,\s*\.doc-code \.inline-ref:focus-visible \{.*?\}\s*',
              '''\n    .doc-code .inline-ref {\n      min-width: 2.15em;\n      margin: 0;\n      font-size: 1em;\n      letter-spacing: .05em;\n    }\n\n''',
              s,
              flags=re.S,
          )

          # 2. Linki pod sprzezeniami istnialy, ale nie dostaly klasy kapsulki.
          def fix_loop_span(m):
              block = m.group(0)
              block = re.sub(r'<a(?![^>]*\bclass=)([^>]*)>', r'<a class="inline-ref"\1>', block)
              block = re.sub(r'<a class="(?![^"]*\binline-ref\b)([^"]*)"', r'<a class="inline-ref \1"', block)
              return block

          s, loop_blocks = re.subn(
              r'<span class="loop-links">.*?</span>',
              fix_loop_span,
              s,
              flags=re.S,
          )

          # 3. Widoczne, gole A1..E2 poza istniejacymi linkami zamieniamy na kapsulki.
          parts = re.split(r'(<[^>]+>)', s)
          inside_a = False
          inside_style = False
          inside_script = False
          wrapped = []
          code_re = re.compile(r'(?<![\w])([ADE][1-7])(?![\w])')

          def repl_code(m):
              code = m.group(1)
              href = targets.get(code)
              if not href:
                  return code
              wrapped.append(code)
              return f'<a class="inline-ref" href="{href}" title="Otworz {code}">{code}</a>'

          out = []
          for part in parts:
              if part.startswith('<'):
                  low = part.lower()
                  if re.match(r'<style\b', low): inside_style = True
                  elif re.match(r'</style\b', low): inside_style = False
                  elif re.match(r'<script\b', low): inside_script = True
                  elif re.match(r'</script\b', low): inside_script = False
                  elif re.match(r'<a\b', low): inside_a = True
                  elif re.match(r'</a\b', low): inside_a = False
                  out.append(part)
              else:
                  if not inside_a and not inside_style and not inside_script:
                      part = code_re.sub(repl_code, part)
                  out.append(part)
          s = ''.join(out)

          # 4. Audyt lokalnych linkow HTML.
          broken = []
          for href in re.findall(r'href="([^"]+)"', s):
              if href.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:')):
                  continue
              target = href.split('#', 1)[0]
              if target.lower().endswith('.html') and not (p.parent / target).exists():
                  broken.append(href)
          if broken:
              raise SystemExit('BROKEN HTML LINKS: ' + ', '.join(sorted(set(broken))))

          # 5. Audyt kapsulek: kod musi prowadzic do wlasciwego dokumentu.
          wrong = []
          for m in re.finditer(r'<a\b([^>]*)>(A[1-7]|D[1-7]|E[1-2])</a>', s):
              attrs, code = m.groups()
              hm = re.search(r'href="([^"]+)"', attrs)
              cm = re.search(r'class="([^"]+)"', attrs)
              if hm and cm and 'inline-ref' in cm.group(1).split():
                  base = hm.group(1).split('#', 1)[0]
                  if base != targets[code]:
                      wrong.append(f'{code}->{base}')
          if wrong:
              raise SystemExit('BLEDNE KAPSULKI: ' + ', '.join(wrong))

          # 6. Ponowny audyt widocznego tekstu: nie moze zostac goly kod poza linkiem.
          leftovers = []
          parts = re.split(r'(<[^>]+>)', s)
          inside_a = inside_style = inside_script = False
          for part in parts:
              if part.startswith('<'):
                  low = part.lower()
                  if re.match(r'<style\b', low): inside_style = True
                  elif re.match(r'</style\b', low): inside_style = False
                  elif re.match(r'<script\b', low): inside_script = True
                  elif re.match(r'</script\b', low): inside_script = False
                  elif re.match(r'<a\b', low): inside_a = True
                  elif re.match(r'</a\b', low): inside_a = False
              elif not inside_a and not inside_style and not inside_script:
                  leftovers.extend(code_re.findall(part))
          if leftovers:
              raise SystemExit('GOLE KODY PO POPRAWCE: ' + ', '.join(leftovers))

          if s != before:
              p.write_text(s, encoding='utf-8')

          print(f'Blokow sprzezen sprawdzonych: {loop_blocks}')
          print(f'Golych kodow opakowanych: {len(wrapped)} ({", ".join(wrapped) if wrapped else "brak"})')
          print('Uszkodzone lokalne linki HTML: 0')
          print('Bledne cele kapsulek: 0')
          print('Gole widoczne kody A1-A7/D1-D7/E1-E2 po audycie: 0')
          PY

      - name: Zapisz poprawke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosja/index.html
          if git diff --cached --quiet; then
            echo "Audyt nie wymagal zmian"
            exit 0
          fi
          git commit -m "Rosja: uporzadkuj kapsulki i linki w index.html"
          git push
