name: SOL audio export to Turso once

on:
  push:
    paths:
      - '.github/workflows/sol-audio-export-once.yml'

permissions:
  contents: read

jobs:
  export-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libsql
        run: pip install libsql

      - name: Export audio rows to Turso in batches
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          import libsql

          SOURCE = 'piosenki/audio_features_v08.csv'
          BATCH = 50

          prefix_re = re.compile(r'^(\d{4})\b')
          yt_re = re.compile(r'\[([^\[\]]+)\]\.webm$', re.I)

          rows = []
          with open(SOURCE, encoding='utf-8-sig', newline='') as f:
              for r in csv.DictReader(f):
                  filename = r['plik'].strip()
                  m_id = prefix_re.search(filename)
                  m_yt = yt_re.search(filename)
                  if not m_id or not m_yt:
                      raise RuntimeError(f'Nie moge odczytac ID z pliku: {filename}')

                  rows.append((
                      f'audio-{m_id.group(1)}',
                      filename,
                      r['sciezka_wzgledna'].strip() or None,
                      m_yt.group(1),
                      float(r['rozmiar_mb']),
                      float(r['czas_s']),
                      int(float(r['sample_rate_hz'])),
                      int(float(r['channels'])),
                  ))

          token = os.environ.get('TURSO_AUTH_TOKEN')
          if not token:
              raise RuntimeError('BRAK TURSO_ADMIN_TOKEN')

          conn = libsql.connect(
              database=os.environ['TURSO_DATABASE_URL'],
              auth_token=token,
          )

          sql = '''
          INSERT INTO audio (
              audio_id, source_filename, source_relative_path, youtube_video_id,
              file_size_mb, duration_seconds, sample_rate_hz, channels
          ) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
          '''

          try:
              conn.execute('BEGIN TRANSACTION')
              done = 0
              for start in range(0, len(rows), BATCH):
                  batch = rows[start:start+BATCH]
                  conn.executemany(sql, batch)
                  done += len(batch)
                  print(f'{done}/{len(rows)} zapisane')
              conn.commit()
          except Exception:
              conn.rollback()
              raise

          count = conn.execute('SELECT COUNT(*) FROM audio').fetchone()[0]
          dup_audio = conn.execute('SELECT COUNT(*) - COUNT(DISTINCT audio_id) FROM audio').fetchone()[0]
          dup_yt = conn.execute('SELECT COUNT(*) - COUNT(DISTINCT youtube_video_id) FROM audio').fetchone()[0]
          dup_file = conn.execute('SELECT COUNT(*) - COUNT(DISTINCT source_filename) FROM audio').fetchone()[0]

          print(f'AUDIO_COUNT={count}')
          print(f'DUP_AUDIO_ID={dup_audio}')
          print(f'DUP_YOUTUBE_ID={dup_yt}')
          print(f'DUP_SOURCE_FILENAME={dup_file}')

          if count != len(rows) or dup_audio or dup_yt or dup_file:
              raise RuntimeError('Kontrola integralnosci audio nie przeszla')

          print(f'AUDIO_EXPORT_OK={count}')
          conn.close()
          PY
