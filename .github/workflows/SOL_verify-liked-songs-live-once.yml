name: SOL verify Liked Songs live once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_verify-liked-songs-live-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live playlist API
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from collections import defaultdict

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'SOL-liked-live-verify/1.0'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          pl = get('https://piosenki-api.onrender.com/api/playlisty')
          ps = get('https://piosenki-api.onrender.com/api/piosenki')
          playlist_id = 'spotify:liked-songs:2026-09-11'

          playlist = next(p for p in pl['playlists'] if p['playlist_id'] == playlist_id)
          items = [i for i in pl['items'] if i['playlist_id'] == playlist_id]
          links = defaultdict(list)
          for x in pl['external_links']:
              links[x['external_track_pk']].append(x['utwu_id'])

          middle = {m['utwu_id']:m for m in ps['middle_end']}
          tagged_lyrics = {x['lyrics_id'] for x in ps['tag_snapshots'] if x.get('lyrics_id')}
          unmatched=[]
          with_lyrics=0
          with_tags=0
          for item in items:
              mapped = links.get(item['external_track_pk'], [])
              if not mapped:
                  unmatched.append(item)
                  continue
              lyrics_ids=[middle[u].get('lyrics_id') for u in mapped if u in middle and middle[u].get('lyrics_id')]
              if lyrics_ids:
                  with_lyrics += 1
              if any(x in tagged_lyrics for x in lyrics_ids):
                  with_tags += 1

          all_item_pks = {i['external_track_pk'] for i in pl['items']}
          print('LIKED_LIVE|' + json.dumps({
              'total_playlists': len(pl['playlists']),
              'total_items': len(pl['items']),
              'distinct_external_tracks_in_items': len(all_item_pks),
              'total_external_links': len(pl['external_links']),
              'playlist': playlist,
              'liked_items': len(items),
              'liked_mapped': len(items)-len(unmatched),
              'liked_unmapped': len(unmatched),
              'liked_with_lyrics_id': with_lyrics,
              'liked_with_tag_snapshot': with_tags,
          }, ensure_ascii=False, sort_keys=True))
          for item in unmatched:
              print('UNMATCHED|' + '|'.join([
                  str(item.get('position') or ''),
                  str(item.get('external_track_id') or ''),
                  str(item.get('external_title') or ''),
                  str(item.get('external_artist') or ''),
                  str(item.get('external_album') or ''),
              ]))
          PY

      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "maciektora-hue"
          git config user.email "maciek.tora@gmail.com"
          git pull --rebase origin main
          git rm .github/workflows/SOL_verify-liked-songs-live-once.yml
          git commit -m "Remove one-time live Liked Songs verification" || true
          git push
