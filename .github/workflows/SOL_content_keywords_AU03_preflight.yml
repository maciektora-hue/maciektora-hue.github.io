name: SOL content keywords AU04 - insert

on:
  push:
    branches: [sql-audhd-content]
    paths:
      - '.github/workflows/SOL_content_keywords_AU03_preflight.yml'

permissions:
  contents: read

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @libsql/client
      - name: Wstaw 43 przypisania AU04
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { createClient } = require('@libsql/client');
          const stop = m => { throw new Error('STOP AU04 INSERT: ' + m); };
          (async () => {
            const txt = fs.readFileSync('daneDoSql.txt', 'utf8');
            const u = txt.match(/libsql:\/\/[^\s]+/);
            const t = txt.match(/eyJ[a-zA-Z0-9._-]+/);
            if (!u || !t) stop('brak danych polaczenia');
            const db = createClient({url:u[0], authToken:t[0]});

            const m = await db.execute({sql:'SELECT value FROM content_meta WHERE key=?', args:['content_keywords_data_v1']});
            if (m.rows.length !== 1 || String(m.rows[0].value) !== 'done') stop('brak markera danych');

            const q = await db.execute(`SELECT s.section_id,s.section_order,s.anchor FROM content_sections s JOIN content_documents d ON d.document_id=s.document_id WHERE d.collection_id='audhd' AND d.document_code='AU04' ORDER BY s.section_order`);
            const anchors = [
              'dziesiec-rownan-metafizyka-i-komisja-po-znajomosci',
              'zasada-stacjonarnego-dzialania',
              'rownanie-pola-einsteina',
              'boltzmann-i-druga-zasada',
              'bellchsh-i-granica-tsirelsona',
              'nierownosc-nieoznaczonosci',
              'maxwell-w-dwoch-liniach',
              'rownanie-diraca',
              'rownania-navierastokesa-poza-konkursem',
              'granica-landauera',
              'wheelerdewitt',
              'komisja-konkursowa',
              'ocena-bezstronnosci'
            ];
            if (q.rows.length !== anchors.length) stop(`sekcje=${q.rows.length}`);
            q.rows.forEach((r,i)=>{ if(Number(r.section_order)!==i+1 || String(r.anchor)!==anchors[i]) stop(`sekcja ${i+1} niezgodna`); });
            const sid = Object.fromEntries(q.rows.map(r=>[String(r.anchor),Number(r.section_id)]));
            const ids = anchors.map(a=>sid[a]);
            const ph = ids.map(()=>'?').join(',');

            const existing = await db.execute({sql:`SELECT count(*) n FROM content_section_keywords WHERE section_id IN (${ph})`,args:ids});
            if(Number(existing.rows[0].n)!==0) stop(`istniejace przypisania=${existing.rows[0].n}`);

            const bySection = [
              ['dziesiec-rownan-metafizyka-i-komisja-po-znajomosci',['fundamental_equations','physics','metaphysics']],
              ['zasada-stacjonarnego-dzialania',['principle_of_stationary_action','physics','metaphysics']],
              ['rownanie-pola-einsteina',['general_relativity','spacetime','geometry']],
              ['boltzmann-i-druga-zasada',['second_law_of_thermodynamics','entropy','thermodynamics']],
              ['bellchsh-i-granica-tsirelsona',['bell_inequalities','nonlocality','quantum_mechanics','metaphysics']],
              ['nierownosc-nieoznaczonosci',['uncertainty_principle','quantum_mechanics']],
              ['maxwell-w-dwoch-liniach',['maxwell_s_equations','electromagnetism','electromagnetic_field']],
              ['rownanie-diraca',['dirac_equation','quantum_mechanics','relativity','spin','antimatter']],
              ['rownania-navierastokesa-poza-konkursem',['navier_stokes_equations','fluid_mechanics','turbulence']],
              ['granica-landauera',['landauer_limit','information_thermodynamics','entropy','thermodynamics']],
              ['wheelerdewitt',['wheeler_dewitt_equation','quantum_gravity','quantum_cosmology','spacetime']],
              ['komisja-konkursowa',['impartiality','objectivity','cognitive_bias']],
              ['ocena-bezstronnosci',['impartiality','objectivity','cognitive_bias']]
            ];
            const plan=[];
            for (const [anchor,keys] of bySection) keys.forEach((key,i)=>plan.push([anchor,i+1,key]));
            if(plan.length!==43) stop(`plan=${plan.length}`);

            const keys=[...new Set(plan.map(x=>x[2]))];
            if(keys.length!==32) stop(`unikalne concept_key=${keys.length}`);
            const kp=keys.map(()=>'?').join(',');
            const cq=await db.execute({sql:`SELECT concept_id,concept_key FROM content_keyword_concepts WHERE concept_key IN (${kp})`,args:keys});
            if(cq.rows.length!==keys.length) stop(`concept_key=${cq.rows.length}/${keys.length}`);
            const cid=Object.fromEntries(cq.rows.map(r=>[String(r.concept_key),Number(r.concept_id)]));

            const statements=plan.map(([anchor,order,key])=>({sql:'INSERT INTO content_section_keywords(section_id,concept_id,keyword_order) VALUES (?,?,?)',args:[sid[anchor],cid[key],order]}));
            await db.batch(statements,'write');

            const check=await db.execute({sql:`SELECT section_id,keyword_order FROM content_section_keywords WHERE section_id IN (${ph}) ORDER BY section_id,keyword_order`,args:ids});
            if(check.rows.length!==43) stop(`po insercie=${check.rows.length}`);
            const counts=ids.map(id=>check.rows.filter(r=>Number(r.section_id)===id).length);
            const wanted=[3,3,3,3,4,2,3,5,3,4,4,3,3];
            if(JSON.stringify(counts)!==JSON.stringify(wanted)) stop(`liczby=${counts}`);
            if(counts.some(n=>n<1 || n>5)) stop(`poza zakresem 1-5: ${counts}`);

            console.log('OK AU04 INSERT: 43 przypisania; sekcje 3/3/3/3/4/2/3/5/3/4/4/3/3; zakres 1-5 zachowany.');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
