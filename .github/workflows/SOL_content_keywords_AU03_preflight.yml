name: SOL content keywords AU05 - preflight

on:
  push:
    branches: [sql-audhd-content]
    paths:
      - '.github/workflows/SOL_content_keywords_AU03_preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @libsql/client
      - name: Sprawdz AU05
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { createClient } = require('@libsql/client');
          const stop = m => { throw new Error('STOP AU05 PREFLIGHT: ' + m); };
          (async () => {
            const txt = fs.readFileSync('daneDoSql.txt', 'utf8');
            const u = txt.match(/libsql:\/\/[^\s]+/);
            const t = txt.match(/eyJ[a-zA-Z0-9._-]+/);
            if (!u || !t) stop('brak danych polaczenia');
            const db = createClient({url:u[0], authToken:t[0]});

            const m = await db.execute({sql:'SELECT value FROM content_meta WHERE key=?', args:['content_keywords_data_v1']});
            if (m.rows.length !== 1 || String(m.rows[0].value) !== 'done') stop('brak markera danych');

            const q = await db.execute(`SELECT s.section_id,s.section_order,s.anchor FROM content_sections s JOIN content_documents d ON d.document_id=s.document_id WHERE d.collection_id='audhd' AND d.document_code='AU05' ORDER BY s.section_order`);
            const anchors = [
              'architektury-pamieci-jako-mapa-poznawcza',
              'streszczenie',
              '1-wprowadzenie-jeden-problem-wiele-rozwiazan',
              '2-pamiec-komputerowa-lat-80-i-wczesnych-90-fizyka-jako-ramy-projektowe',
              'zrodla-do-2',
              '3-pamiec-w-jezyku-c-manualne-zarzadzanie-jako-paradygmat',
              'zrodla-do-3',
              '4-pamiec-w-pythonie-referencje-garbage-collector-abstrakcja',
              'zrodla-do-4',
              '5-pamiec-w-javascript-przypadkowy-jezyk-ery-przegladarek',
              'zrodla-do-5',
              '6-pamiec-w-big-data-hadoop-mapreduce-i-ekonomia-rozproszenia',
              'zrodla-do-6',
              '7-pamiec-ludzka-schemat-hipokamp-kora-sen',
              'hierarchia-pamieci-u-czlowieka',
              'sen-gleboki-sws-i-sen-rem-jako-fazy-konsolidacji',
              'pamiec-ludzka-jako-kompresor-stratny',
              'zrodla-do-7',
              '8-pamiec-neurotypowa-vs-neuroroznorodna-roznica-strategii-projektowej',
              'monotropizm-teoria-uwagi-w-autyzmie',
              'slaba-spojnosc-centralna-weak-central-coherence-teoria-szczegolu',
              'pamiec-robocza-w-adhd-deficyt-wykonawczy',
              'synteza-pamiec-nd-jako-pointer-based',
              'zrodla-do-8',
              '9-konsekwencje-kto-buduje-fundamenty-informatyki',
              '10-konkluzja'
            ];
            if (q.rows.length !== anchors.length) stop(`sekcje=${q.rows.length}`);
            q.rows.forEach((r,i)=>{ if(Number(r.section_order)!==i+1 || String(r.anchor)!==anchors[i]) stop(`sekcja ${i+1} niezgodna`); });

            const ids=q.rows.map(r=>Number(r.section_id));
            const ph=ids.map(()=>'?').join(',');
            const links=await db.execute({sql:`SELECT count(*) n FROM content_section_keywords WHERE section_id IN (${ph})`,args:ids});
            if(Number(links.rows[0].n)!==0) stop(`istniejace przypisania=${links.rows[0].n}`);

            const keys=['memory_architecture','cognitive_architecture','computer_memory','human_memory','neurodivergent_memory','programming_languages','distributed_systems','memory','limited_memory','system_constraints','information_processing','ram','hardware_constraints','personal_computers','references','c_programming_language','programming','low_level_programming','programming_language_design','python','javascript','big_data','hadoop','mapreduce','system_architecture','hippocampus','long_term_memory','memory_consolidation','short_term_memory','declarative_memory','procedural_memory','sleep_neurobiology','deep_sleep','rem_sleep','lossy_compression','gist','schemas','details','cognitive_style','monotropism','attention','central_coherence','working_memory','executive_function','executive_control','pointer_based_memory','foundations_of_information_technology','information_technology_pioneers','compilers'];
            if(keys.length!==49) stop(`lista concept_key=${keys.length}`);
            const kp=keys.map(()=>'?').join(',');
            const c=await db.execute({sql:`SELECT concept_key FROM content_keyword_concepts WHERE concept_key IN (${kp})`,args:keys});
            if(c.rows.length!==keys.length) stop(`concept_key=${c.rows.length}/${keys.length}`);

            console.log('OK AU05 PREFLIGHT: 26 sekcji; 0 przypisan; 49/49 concept_key.');
            q.rows.forEach(r=>console.log(`SECTION ${r.section_order}: section_id=${r.section_id}; anchor=${r.anchor}`));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
