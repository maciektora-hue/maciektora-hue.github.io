name: SOL content keywords AU06-AU18 - preflight

on:
  push:
    branches: [sql-audhd-content]
    paths:
      - '.github/workflows/SOL_content_keywords_AU03_preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @libsql/client
      - name: Sprawdz AU06-AU18
        run: |
          node <<'NODE'
          const fs=require('fs'), z=require('zlib'), {createClient}=require('@libsql/client');
          const stop=m=>{throw new Error('STOP PREFLIGHT: '+m)};
          (async()=>{
            const txt=fs.readFileSync('daneDoSql.txt','utf8');
            const u=txt.match(/libsql:\/\/[^\s]+/), t=txt.match(/eyJ[a-zA-Z0-9._-]+/);
            if(!u||!t) stop('brak danych polaczenia');
            const db=createClient({url:u[0],authToken:t[0]});
            const marker=await db.execute({sql:'SELECT value FROM content_meta WHERE key=?',args:['content_keywords_data_v1']});
            if(marker.rows.length!==1||String(marker.rows[0].value)!=='done') stop('brak markera danych');
            const plans=JSON.parse(z.gunzipSync(Buffer.from('','base64')).toString('utf8'));
            const docs=Object.keys(plans);
            if(docs.length!==13) stop(`dokumenty=${docs.length}`);
            let totalSections=0,totalLinks=0;
            for(const doc of docs){
              const p=plans[doc], anchors=p.map(x=>x[0]), counts=p.map(x=>x[1].length);
              if(counts.some(n=>n<1||n>5)) stop(`${doc} poza zakresem 1-5`);
              const q=await db.execute(`SELECT s.section_id,s.section_order,s.anchor FROM content_sections s JOIN content_documents d ON d.document_id=s.document_id WHERE d.collection_id='audhd' AND d.document_code='${doc}' ORDER BY s.section_order`);
              if(q.rows.length!==anchors.length) stop(`${doc} sekcje=${q.rows.length}/${anchors.length}`);
              q.rows.forEach((r,i)=>{if(Number(r.section_order)!==i+1||String(r.anchor)!==anchors[i]) stop(`${doc} sekcja ${i+1} niezgodna`)});
              const ids=q.rows.map(r=>Number(r.section_id)), ph=ids.map(()=>'?').join(',');
              const links=await db.execute({sql:`SELECT count(*) n FROM content_section_keywords WHERE section_id IN (${ph})`,args:ids});
              if(Number(links.rows[0].n)!==0) stop(`${doc} istniejace przypisania=${links.rows[0].n}`);
              const keys=[...new Set(p.flatMap(x=>x[1]))], kp=keys.map(()=>'?').join(',');
              const c=await db.execute({sql:`SELECT concept_key FROM content_keyword_concepts WHERE concept_key IN (${kp})`,args:keys});
              if(c.rows.length!==keys.length) stop(`${doc} concept_key=${c.rows.length}/${keys.length}`);
              const n=p.reduce((s,x)=>s+x[1].length,0);
              totalSections+=p.length; totalLinks+=n;
              console.log(`OK ${doc} PREFLIGHT: ${p.length} sekcji; 0 przypisan; ${keys.length}/${keys.length} concept_key; plan=${n}.`);
            }
            if(totalSections!==274) stop(`sekcje razem=${totalSections}`);
            if(totalLinks!==1033) stop(`plan razem=${totalLinks}`);
            console.log('OK ALL PREFLIGHT AU06-AU18: 13 dokumentow; 274 sekcje; 1033 przypisania zaplanowane; ZERO DB WRITES.');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
