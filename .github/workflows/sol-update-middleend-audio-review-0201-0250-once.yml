name: SOL update middle_end audio REVIEW 0201-0250 once

on:
  push:
    paths:
      - '.github/workflows/sol-update-middleend-audio-review-0201-0250-once.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsql
        run: pip install libsql
      - name: Update 7 REVIEW rows
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python -u piosenki/SOL_update-middleend-audio-review-v02.py \
            --source piosenki/audio_middleend_review_resolved_0201_0250.tsv \
            --expected 7
