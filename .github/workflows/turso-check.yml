name: Turso connection test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/turso-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libsql
        run: pip install libsql

      - name: Update AllTimeBest playlist links in Turso
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import libsql

          status_path = Path('piosenki/SOL-turso-status.txt')
          stamp = datetime.now(timezone.utc).isoformat()
          playlist_id = 'spotify:alltimebest'
          playlist_tags = 'owner:maciek-tora; spotify_url=https://open.spotify.com/playlist/5wDt92D4lFaSDIuVrdKLF9; youtube_music_url=https://music.youtube.com/playlist?list=PLFZzzP8gJ7jU'

          conn = libsql.connect(
              database=os.environ['TURSO_DATABASE_URL'],
              auth_token=os.environ['TURSO_AUTH_TOKEN'],
          )
          conn.execute(
              'UPDATE playlist SET playlist_tags = ? WHERE playlist_id = ?',
              (playlist_tags, playlist_id),
          )
          conn.commit()

          row = conn.execute(
              'SELECT playlist_id, playlist_tags FROM playlist WHERE playlist_id = ?',
              (playlist_id,),
          ).fetchone()
          print('PLAYLIST_LINKS=' + repr(row))
          if row != (playlist_id, playlist_tags):
              raise RuntimeError('Nie potwierdzono aktualizacji AllTimeBestSpotify')

          status_path.write_text(
              f'OK\nUTC={stamp}\nALLTIMEBEST_LINKS=UPDATED\n',
              encoding='utf-8',
          )
          conn.close()
          PY

      - name: Save result to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/SOL-turso-status.txt
          git diff --cached --quiet || git commit -m "Turso AllTimeBest links update result"
          git push
