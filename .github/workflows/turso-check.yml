name: Turso connection test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/turso-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libsql
        run: pip install libsql

      - name: Update bestof2018 YouTube Music link in Turso
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import libsql

          status_path = Path('piosenki/SOL-turso-status.txt')
          stamp = datetime.now(timezone.utc).isoformat()
          playlist_id = 'spotify:bestof:2018'
          youtube_tag = 'youtube_music_url=https://music.youtube.com/playlist?list=PLA_G2J50icYo'

          conn = libsql.connect(
              database=os.environ['TURSO_DATABASE_URL'],
              auth_token=os.environ['TURSO_AUTH_TOKEN'],
          )
          row = conn.execute(
              'SELECT playlist_tags FROM playlist WHERE playlist_id = ?',
              (playlist_id,),
          ).fetchone()
          if row is None:
              raise RuntimeError('Nie znaleziono playlisty bestof2018')

          parts = [p.strip() for p in (row[0] or '').split(';') if p.strip()]
          parts = [p for p in parts if not p.startswith('youtube_music_url=')]
          parts.append(youtube_tag)
          playlist_tags = '; '.join(parts)

          conn.execute(
              'UPDATE playlist SET playlist_tags = ? WHERE playlist_id = ?',
              (playlist_tags, playlist_id),
          )
          conn.commit()

          check = conn.execute(
              'SELECT playlist_id, playlist_tags FROM playlist WHERE playlist_id = ?',
              (playlist_id,),
          ).fetchone()
          print('PLAYLIST_LINKS=' + repr(check))
          if check is None or youtube_tag not in (check[1] or ''):
              raise RuntimeError('Nie potwierdzono aktualizacji bestof2018')

          status_path.write_text(
              f'OK\nUTC={stamp}\nBESTOF2018_YOUTUBE_MUSIC=UPDATED\n',
              encoding='utf-8',
          )
          conn.close()
          PY

      - name: Save result to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/SOL-turso-status.txt
          git diff --cached --quiet || git commit -m "Turso bestof2018 YouTube Music update result"
          git push
