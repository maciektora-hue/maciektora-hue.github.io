name: SOL inspect live playlists

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/turso-check.yml'

permissions:
  contents: read

jobs:
  inspect-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Install libsql
        run: pip install libsql

      - name: Inspect playlist table in Turso
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import libsql

          token = os.environ.get('TURSO_AUTH_TOKEN')
          if not token:
              raise RuntimeError('BRAK SECRETU TURSO_ADMIN_TOKEN')

          conn = libsql.connect(database=os.environ['TURSO_DATABASE_URL'], auth_token=token)
          rows = conn.execute("""
              SELECT playlist_id, playlist_series_id, service, name,
                     external_playlist_id, external_url, source_file, playlist_tags
              FROM playlist
              ORDER BY playlist_id
          """).fetchall()
          for row in rows:
              print('PLAYLIST_ROW=' + repr(row))
          print('PLAYLIST_COUNT=' + str(len(rows)))
          conn.close()
          PY
