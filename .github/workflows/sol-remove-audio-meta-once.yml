name: SOL remove one audio meta line

on:
  push:
    paths:
      - '.github/workflows/sol-remove-audio-meta-once.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove exact line
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('piosenki/SOL-klastrowanie-audio-wyniki-dwa-glosy-v01-2026-09-08.html')
          s = p.read_text(encoding='utf-8')
          target = '<p class="meta">Głębia · Światło · Ruch · audio_features_v08.csv · 343 utwory w rdzeniach wysp</p>\n'
          n = s.count(target)
          if n != 1:
              raise RuntimeError(f'Oczekiwano 1 wystąpienia, znaleziono {n}')
          p.write_text(s.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/SOL-klastrowanie-audio-wyniki-dwa-glosy-v01-2026-09-08.html
          git commit -m "Remove audio results meta line"
          git push
