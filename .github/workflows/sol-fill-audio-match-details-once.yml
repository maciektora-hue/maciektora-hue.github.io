name: SOL fill audio_match_details once

on:
  push:
    paths:
      - '.github/workflows/sol-fill-audio-match-details-once.yml'

permissions:
  contents: read

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsql
        run: pip install libsql
      - name: Fill audio_match_details
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os, libsql

          conn = libsql.connect(database=os.environ['TURSO_DATABASE_URL'], auth_token=os.environ['TURSO_AUTH_TOKEN'])
          conn.execute('PRAGMA foreign_keys = ON')

          mapped = conn.execute("SELECT COUNT(*) FROM middle_end WHERE audio_id IS NOT NULL").fetchone()[0]
          before = conn.execute("SELECT COUNT(*) FROM audio_match_details").fetchone()[0]

          try:
              conn.execute('BEGIN TRANSACTION')
              conn.execute('''
                  INSERT INTO audio_match_details (utwu_id, audio_id, variant_type, note)
                  SELECT m.utwu_id, m.audio_id, NULL, NULL
                  FROM middle_end m
                  WHERE m.audio_id IS NOT NULL
                    AND NOT EXISTS (
                        SELECT 1
                        FROM audio_match_details d
                        WHERE d.utwu_id = m.utwu_id OR d.audio_id = m.audio_id
                    )
              ''')
              conn.commit()
          except Exception:
              conn.rollback()
              raise

          after = conn.execute("SELECT COUNT(*) FROM audio_match_details").fetchone()[0]
          covered = conn.execute('''
              SELECT COUNT(*)
              FROM middle_end m
              WHERE m.audio_id IS NOT NULL
                AND EXISTS (
                    SELECT 1 FROM audio_match_details d
                    WHERE d.utwu_id = m.utwu_id AND d.audio_id = m.audio_id
                )
          ''').fetchone()[0]

          if covered != mapped:
              raise RuntimeError(f'audio_match_details pokrywa {covered}/{mapped} rekordów middle_end z audio_id')

          print(f'MIDDLE_END_MAPPED={mapped}')
          print(f'AUDIO_MATCH_DETAILS_BEFORE={before}')
          print(f'AUDIO_MATCH_DETAILS_AFTER={after}')
          print(f'AUDIO_MATCH_DETAILS_COVERED={covered}')
          conn.close()
          PY
