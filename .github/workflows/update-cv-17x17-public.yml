name: CV - publiczna wersja 17x17

on:
  push:
    paths:
      - '.github/workflows/update-cv-17x17-public.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Oczysc 17x17 i przepnij index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old = Path('cv/CLAUDE_seventeen-and-seventeen-ai-concepts-EN-v08_02-2026-08-30-2.html')
          new = Path('cv/CLAUDE_seventeen-and-seventeen-ai-concepts-EN-v08_03-2026-09-07.html')
          index = Path('cv/index.html')

          assert old.exists(), old
          assert not new.exists(), new
          t = old.read_text(encoding='utf-8')

          old_title = '<title>Seventeen &amp; Seventeen — AI concepts from the postings and from the corpora – EN v08.02 – 2026-08-30</title>'
          new_title = '<title>Seventeen &amp; Seventeen — AI concepts from the postings and from the corpora – EN v08.03 – 2026-09-07</title>'
          assert t.count(old_title) == 1
          t = t.replace(old_title, new_title)

          m = re.search(r'<p><small>EN v08\.02 · 2026-08-30\..*?</small></p>', t, flags=re.S)
          assert m
          meta = '<p><small>EN v08.03 · 2026-09-07. Two lists of seventeen concepts: first, the vocabulary recurring across AI / business / operations job postings; second, concepts developed in the work behind the CV. The first list combines a Polish plain-language cut, an English jargon-forward cut, and a practical account of how each concept showed up in the work. The second list is English only.</small></p>'
          t = t[:m.start()] + meta + t[m.end():]

          p = r'<p class="note"><b>Read this first\.</b>.*?</p>'
          assert len(re.findall(p, t, flags=re.S)) == 1
          t = re.sub(p, '', t, count=1, flags=re.S)

          p = r'<p class="note"><b>Companion files\.</b>.*?</p>'
          assert len(re.findall(p, t, flags=re.S)) == 1
          t = re.sub(p, '', t, count=1, flags=re.S)

          p = r'<p class="note"><b>Attribution markers\.</b>.*?</p>'
          assert len(re.findall(p, t, flags=re.S)) == 1
          attr = '<p class="note"><b>Attribution markers.</b> <b>[M]</b> — Maciek. <b>[K]</b> — Klaudiusz (Claude). <b>[S]</b> — Sol (ChatGPT). They identify contribution or provenance where it matters.</p>'
          t = re.sub(p, attr, t, count=1, flags=re.S)

          h = '<h2 id="history">Short history: what the three of us actually did</h2>'
          start = t.index(h) + len(h)
          end = t.index('<h2 id="ordering">How the ordering works</h2>', start)
          history = (
              '<p>This document grew out of roughly thirty hours of recruitment work spread across about a month, with three participants: Maciek [M], Klaudiusz (Claude) [K] and Sol (ChatGPT) [S].</p>'
              '<p><b>Starting point — the postings.</b> Sol assembled the list in two passes on Maciek&#x27;s instruction: first roles from pracuj.pl, then fully remote roles from abroad. The result was a deliberately broad set of fifteen AI / business / operations postings, ranging from enablement and transformation work to agentic delivery and more conventional analysis carrying an AI label.</p>'
              '<p><b>Who did what.</b> Sol produced the first-pass reading of the postings. Klaudiusz independently went back to the originals, fetched what could be fetched, transcribed material that had to come from screenshots, and added a second analytical layer. Maciek set the direction, supplied inaccessible source material, corrected attribution and factual drift, and made the final calls where the evidence changed the ranking or interpretation.</p>'
              '<p><b>Why the first seventeen exist.</b> Reading the originals back to back made one pattern obvious: the postings differed less in substance than in vocabulary. The same concepts kept recurring in different arrangements, and those concepts are the real currency of an interview. The first seventeen are therefore not a glossary for tidiness, but a map of what the market is likely to probe.</p>'
              '<p><b>Why the second seventeen exist.</b> Klaudiusz then selected seventeen concepts from the work behind the CV: ideas, methods and constraints that had become structurally important across the material. That second list is the mirror image of the first — not what the market calls the work, but what the work itself taught us to call.</p>'
              '<p><b>The process was iterative, but not accidental.</b> Maciek had a vision he had not written down at the outset. To the models, the work therefore appeared as successive tasks; to Maciek, those tasks were successively revealed parts of one project. That mismatch became one of the useful conclusions of the whole exercise: an undisclosed vision can still be executed, but until it is made explicit the system cannot reliably support it, test it, or warn that a particular step has drifted away from it.</p>'
          )
          t = t[:start] + history + t[end:]

          p = r'<p>Adoption we tested the only honest way:.*?</p>'
          assert len(re.findall(p, t, flags=re.S)) == 1
          adoption = '<p>Adoption we tested the only honest way: on our own practice, over months, watching which methods stuck and which quietly died. Some procedures survived because they kept reducing errors under real pressure; others were deliberately retired once their verification value fell below their maintenance cost. That matters too: adoption is not success when a ritual survives after its purpose is gone. The useful measure is whether a practice still changes outcomes.</p>'
          t = re.sub(p, adoption, t, count=1, flags=re.S)

          p = r'<div class="footer">.*?</div>\s*</main>'
          assert len(re.findall(p, t, flags=re.S)) == 1
          footer = '<div class="footer"><p>Maciej Tora · <i>Seventeen &amp; Seventeen</i> · EN v08.03 · 2026-09-07.</p><p>Built collaboratively with Claude and ChatGPT. Contribution details are summarized once, in the history section above. The &quot;Po polsku — o co kaman&quot; subsections are deliberately left in Polish.</p></div>\n</main>'
          t = re.sub(p, footer, t, count=1, flags=re.S)

          for forbidden in ['Read this first', 'updated only on request', 'Companion files.', 'The same history as seen by Sol', 'Errata — this section', 'changelog', 'EN v08.02']:
              assert forbidden.lower() not in t.lower(), forbidden
          assert t.count('Who did what.') == 1
          assert t.count('<h2 id="history">') == 1
          assert 'EN v08.03' in t

          new.write_text(t, encoding='utf-8')
          old.unlink()

          x = index.read_text(encoding='utf-8')
          old_href = 'CLAUDE_seventeen-and-seventeen-ai-concepts-EN-v08_02-2026-08-30-2.html'
          new_href = 'CLAUDE_seventeen-and-seventeen-ai-concepts-EN-v08_03-2026-09-07.html'
          assert x.count(old_href) == 1
          x = x.replace(old_href, new_href)
          index.write_text(x, encoding='utf-8')

          print('Nowy plik:', new)
          print('Rozmiar:', new.stat().st_size)
          print('Index przepiety:', new_href in x)
          print('SUCCESS')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/
          git commit -m "CV: publiczna wersja Seventeen and Seventeen v08.03"
          git push
