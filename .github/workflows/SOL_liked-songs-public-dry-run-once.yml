name: SOL liked songs public dry run once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_liked-songs-public-dry-run-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare XLSX with live public APIs
        run: |
          python - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path
          from zipfile import ZipFile

          xlsx = Path('dane-robocze/playlistyspotifybestof/Liked songs spotify z dnia 2026-09-11.xlsx')
          MAIN='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          REL='http://schemas.openxmlformats.org/officeDocument/2006/relationships'
          PKG='http://schemas.openxmlformats.org/package/2006/relationships'
          ns={'m':MAIN,'p':PKG}

          def colidx(ref):
              letters=re.match(r'[A-Z]+', ref or 'A1').group(0)
              n=0
              for ch in letters: n=n*26+ord(ch)-64
              return n-1

          with ZipFile(xlsx) as z:
              shared=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                  shared=[''.join(t.text or '' for t in si.iterfind('.//m:t',ns)) for si in root.findall('m:si',ns)]
              wb=ET.fromstring(z.read('xl/workbook.xml'))
              sheet=wb.find('m:sheets',ns)[0]
              rid=sheet.attrib['{'+REL+'}id']
              rels=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
              targets={r.attrib['Id']:r.attrib['Target'] for r in rels.findall('p:Relationship',ns)}
              target=targets[rid]
              sp=target.lstrip('/') if target.startswith('/') else 'xl/'+target.lstrip('./')
              root=ET.fromstring(z.read(sp))
              rows=[]
              for row in root.findall('.//m:sheetData/m:row',ns):
                  vals={}
                  for c in row.findall('m:c',ns):
                      i=colidx(c.attrib.get('r','A1')); typ=c.attrib.get('t'); v=c.find('m:v',ns); ins=c.find('m:is',ns); val=''
                      if typ=='s' and v is not None: val=shared[int(v.text)]
                      elif typ=='inlineStr' and ins is not None: val=''.join(t.text or '' for t in ins.iterfind('.//m:t',ns))
                      elif v is not None: val=v.text or ''
                      vals[i]=val.strip()
                  if vals:
                      arr=['']*(max(vals)+1)
                      for i,v in vals.items(): arr[i]=v
                      rows.append(arr)
          width=max(len(r) for r in rows); rows=[r+['']*(width-len(r)) for r in rows]
          headers=[x.strip().lower() for x in rows[0]]; idx={h:i for i,h in enumerate(headers)}
          tracks=[{'id':r[idx['id']].strip(),'name':r[idx['name']].strip(),'artist':r[idx['artist']].strip(),'album':r[idx['album']].strip()} for r in rows[1:] if r[idx['id']].strip()]

          def get_json(url):
              req=urllib.request.Request(url, headers={'User-Agent':'SOL-liked-songs-audit/1.0'})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.load(resp)

          pl=get_json('https://piosenki-api.onrender.com/api/playlisty')
          ps=get_json('https://piosenki-api.onrender.com/api/piosenki')

          middle=ps['middle_end']
          by_spotify=defaultdict(list)
          by_utwu={}
          for m in middle:
              by_utwu[m['utwu_id']]=m
              if m.get('spotify_id'): by_spotify[m['spotify_id']].append(m['utwu_id'])
          tagged_lyrics={x['lyrics_id'] for x in ps['tag_snapshots'] if x.get('lyrics_id')}

          ext_by_id={}
          for item in pl['items']:
              if item.get('external_service')=='spotify':
                  ext_by_id[item['external_track_id']]=item['external_track_pk']
          bridge=defaultdict(list)
          for x in pl['external_links']:
              bridge[x['external_track_pk']].append(x['utwu_id'])

          distinct=set(t['id'] for t in tracks)
          positions=len(tracks)
          already_external=sum(1 for sid in distinct if sid in ext_by_id)
          new_external=len(distinct)-already_external
          unique=zero=amb=prelinked=would_link=conflicts=0
          mapped_pos=lyrics_pos=tagged_pos=0
          no_candidate_ids=set(); ambiguous_ids=set(); new_ids=set()
          for sid in distinct:
              candidates=by_spotify.get(sid,[])
              if len(candidates)==1: unique+=1
              elif len(candidates)==0: zero+=1; no_candidate_ids.add(sid)
              else: amb+=1; ambiguous_ids.add(sid)
              pk=ext_by_id.get(sid)
              links=bridge.get(pk,[]) if pk is not None else []
              if links:
                  prelinked+=1
                  if len(candidates)==1 and candidates[0] not in links: conflicts+=1
              elif len(candidates)==1:
                  would_link+=1
              if sid not in ext_by_id: new_ids.add(sid)

          for t in tracks:
              sid=t['id']; candidates=by_spotify.get(sid,[]); pk=ext_by_id.get(sid); links=bridge.get(pk,[]) if pk is not None else []
              mapped=list(links) if links else (candidates if len(candidates)==1 else [])
              if mapped:
                  mapped_pos += 1
                  # multiple links are supported; count position as covered if at least one mapped utwu has lyrics/tags
                  ms=[by_utwu[u] for u in mapped if u in by_utwu]
                  lids=[m.get('lyrics_id') for m in ms if m.get('lyrics_id')]
                  if lids: lyrics_pos += 1
                  if any(lid in tagged_lyrics for lid in lids): tagged_pos += 1

          print('LIKED_SONGS_PUBLIC_DRY_RUN_OK ' + json.dumps({
              'positions':positions,
              'distinct_spotify_ids':len(distinct),
              'existing_external_tracks':already_external,
              'new_external_tracks':new_external,
              'middle_end_unique_ids':unique,
              'middle_end_no_candidate_ids':zero,
              'middle_end_ambiguous_ids':amb,
              'preexisting_bridge_ids':prelinked,
              'would_add_bridge_ids':would_link,
              'bridge_conflicts':conflicts,
              'mapped_positions_after_import':mapped_pos,
              'unmapped_positions_after_import':positions-mapped_pos,
              'positions_with_lyrics_id':lyrics_pos,
              'positions_with_tag_snapshot':tagged_pos,
              'distinct_no_candidate_ids':len(no_candidate_ids),
              'distinct_ambiguous_ids':len(ambiguous_ids),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "maciektora-hue"
          git config user.email "maciek.tora@gmail.com"
          git pull --rebase origin main
          git rm .github/workflows/SOL_liked-songs-public-dry-run-once.yml
          git commit -m "Remove one-time Liked Songs public audit" || true
          git push
