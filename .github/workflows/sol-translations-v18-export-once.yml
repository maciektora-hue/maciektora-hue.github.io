name: SOL translations v18 export once

on:
  push:
    paths:
      - '.github/workflows/sol-translations-v18-export-once.yml'
  workflow_dispatch:

jobs:
  export-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsql
        run: pip install libsql
      - name: Export 958 section translations
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import csv
          import os
          import libsql

          path = 'piosenki/sol-translations-v18-export.tsv'
          with open(path, encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))

          if len(rows) != 958:
              raise RuntimeError(f'Expected 958 rows, got {len(rows)}')

          conn = libsql.connect(
              database=os.environ['TURSO_DATABASE_URL'],
              auth_token=os.environ['TURSO_AUTH_TOKEN'],
          )

          conn.executemany(
              '''UPDATE content_sections
                 SET section_title_en=?, description_en=?
                 WHERE section_id=?''',
              [(r['section_title_en'], r['description_en'], int(r['section_id'])) for r in rows],
          )
          conn.commit()

          filled = conn.execute(
              '''SELECT COUNT(*) FROM content_sections
                 WHERE section_title_en IS NOT NULL
                   AND description_en IS NOT NULL'''
          ).fetchone()[0]

          print(f'TRANSLATIONS_V18_EXPORT_OK rows={len(rows)} filled={filled}')
          conn.close()
          PY