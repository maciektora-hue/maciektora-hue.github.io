name: SOL section metrics export once

on:
  workflow_dispatch:
  push:
    paths:
      - 'techniczne/SOL_section_metrics_export.py'
      - '.github/workflows/sol-section-metrics-export-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libsql
        run: pip install libsql

      - name: Export section metrics to Turso and verify
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: python techniczne/SOL_section_metrics_export.py
