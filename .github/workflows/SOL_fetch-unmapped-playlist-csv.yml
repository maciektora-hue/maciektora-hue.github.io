name: SOL fetch unmapped playlist CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_fetch-unmapped-playlist-csv.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch CSV from live Render export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dane-robocze/csv-tsv
          URL='https://piosenki-api.onrender.com/static/SOL_playlisty-brak-utwu-id-95.csv'
          OUT='dane-robocze/csv-tsv/SOL_playlisty-brak-utwu-id-95.csv'
          curl --fail --location --retry 10 --retry-delay 2 "$URL" -o "$OUT"
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('dane-robocze/csv-tsv/SOL_playlisty-brak-utwu-id-95.csv')
          with p.open(encoding='utf-8', newline='') as f:
              rows = list(csv.reader(f))
          expected = ['playlist_id','playlist_name','source_file','position','spotify_id','name','artist','album','middle_end_match_count','utwu_id']
          if not rows or rows[0] != expected:
              raise SystemExit(f'Bad header: {rows[0] if rows else None}')
          if len(rows) - 1 != 95:
              raise SystemExit(f'Expected 95 data rows, got {len(rows)-1}')
          print(f'CSV_OK rows={len(rows)-1}')
          PY
      - name: Commit CSV
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dane-robocze/csv-tsv/SOL_playlisty-brak-utwu-id-95.csv
          git commit -m 'Add 95 unmapped playlist items CSV'
          git push
