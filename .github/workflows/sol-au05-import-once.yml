name: SOL AU05 import once

on:
  push:
    paths:
      - '.github/workflows/sol-au05-import-once.yml'

permissions:
  contents: read

jobs:
  import-au05:
    runs-on: ubuntu-latest
    steps:
      - name: Install libsql
        run: pip install libsql

      - name: Import and verify AU05 keyword assignments
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import libsql

          expected = [
    (1, 1, 17, 'memory_architecture'),
    (1, 2, 18, 'cognitive_architecture'),
    (1, 3, 296, 'computer_memory'),
    (1, 4, 298, 'human_memory'),
    (1, 5, 299, 'neurodivergent_memory'),
    (2, 1, 17, 'memory_architecture'),
    (2, 2, 296, 'computer_memory'),
    (2, 3, 299, 'neurodivergent_memory'),
    (2, 4, 156, 'programming_languages'),
    (2, 5, 462, 'distributed_systems'),
    (3, 1, 288, 'memory'),
    (3, 2, 280, 'limited_memory'),
    (3, 3, 279, 'system_constraints'),
    (3, 4, 376, 'information_processing'),
    (4, 1, 296, 'computer_memory'),
    (4, 2, 389, 'ram'),
    (4, 3, 278, 'hardware_constraints'),
    (4, 4, 174, 'personal_computers'),
    (5, 1, 392, 'references'),
    (6, 1, 157, 'c_programming_language'),
    (6, 2, 296, 'computer_memory'),
    (6, 3, 355, 'programming'),
    (6, 4, 356, 'low_level_programming'),
    (6, 5, 357, 'programming_language_design'),
    (7, 1, 392, 'references'),
    (8, 1, 388, 'python'),
    (8, 2, 156, 'programming_languages'),
    (8, 3, 296, 'computer_memory'),
    (9, 1, 392, 'references'),
    (10, 1, 153, 'javascript'),
    (10, 2, 156, 'programming_languages'),
    (10, 3, 296, 'computer_memory'),
    (10, 4, 357, 'programming_language_design'),
    (11, 1, 392, 'references'),
    (12, 1, 82, 'big_data'),
    (12, 2, 127, 'hadoop'),
    (12, 3, 213, 'mapreduce'),
    (12, 4, 462, 'distributed_systems'),
    (12, 5, 19, 'system_architecture'),
    (13, 1, 392, 'references'),
    (14, 1, 298, 'human_memory'),
    (14, 2, 17, 'memory_architecture'),
    (14, 3, 131, 'hippocampus'),
    (14, 4, 293, 'long_term_memory'),
    (14, 5, 185, 'memory_consolidation'),
    (15, 1, 298, 'human_memory'),
    (15, 2, 297, 'short_term_memory'),
    (15, 3, 293, 'long_term_memory'),
    (15, 4, 292, 'declarative_memory'),
    (15, 5, 300, 'procedural_memory'),
    (16, 1, 185, 'memory_consolidation'),
    (16, 2, 248, 'sleep_neurobiology'),
    (16, 3, 424, 'deep_sleep'),
    (16, 4, 425, 'rem_sleep'),
    (16, 5, 293, 'long_term_memory'),
    (17, 1, 298, 'human_memory'),
    (17, 2, 172, 'lossy_compression'),
    (17, 3, 111, 'gist'),
    (17, 4, 421, 'schemas'),
    (17, 5, 464, 'details'),
    (18, 1, 392, 'references'),
    (19, 1, 299, 'neurodivergent_memory'),
    (19, 2, 18, 'cognitive_architecture'),
    (19, 3, 457, 'cognitive_style'),
    (19, 4, 17, 'memory_architecture'),
    (20, 1, 233, 'monotropism'),
    (20, 2, 492, 'attention'),
    (20, 3, 457, 'cognitive_style'),
    (20, 4, 299, 'neurodivergent_memory'),
    (21, 1, 441, 'central_coherence'),
    (21, 2, 464, 'details'),
    (21, 3, 111, 'gist'),
    (21, 4, 457, 'cognitive_style'),
    (22, 1, 303, 'working_memory'),
    (22, 2, 107, 'executive_function'),
    (22, 3, 189, 'executive_control'),
    (22, 4, 280, 'limited_memory'),
    (23, 1, 306, 'pointer_based_memory'),
    (23, 2, 299, 'neurodivergent_memory'),
    (23, 3, 303, 'working_memory'),
    (23, 4, 233, 'monotropism'),
    (23, 5, 441, 'central_coherence'),
    (24, 1, 392, 'references'),
    (25, 1, 105, 'foundations_of_information_technology'),
    (25, 2, 319, 'information_technology_pioneers'),
    (25, 3, 356, 'low_level_programming'),
    (25, 4, 170, 'compilers'),
    (25, 5, 462, 'distributed_systems'),
    (26, 1, 17, 'memory_architecture'),
    (26, 2, 296, 'computer_memory'),
    (26, 3, 298, 'human_memory'),
    (26, 4, 299, 'neurodivergent_memory'),
    (26, 5, 279, 'system_constraints'),
]

          if len(expected) != 93:
              raise RuntimeError(f'Expected 93 assignments, got {len(expected)}')
          if len({(r[0], r[1]) for r in expected}) != 93:
              raise RuntimeError('Duplicate (section_order, keyword_order) in source')
          if len({(r[0], r[2]) for r in expected}) != 93:
              raise RuntimeError('Duplicate (section_order, concept_id) in source')

          token = os.environ.get('TURSO_AUTH_TOKEN')
          if not token:
              raise RuntimeError('BRAK SECRETU TURSO_ADMIN_TOKEN')

          conn = libsql.connect(
              database=os.environ['TURSO_DATABASE_URL'],
              auth_token=token,
          )
          conn.execute('PRAGMA foreign_keys = ON')

          doc_rows = conn.execute(
              "SELECT document_id FROM content_documents WHERE collection_id='audhd' AND document_code='AU05'"
          ).fetchall()
          if len(doc_rows) != 1:
              raise RuntimeError(f'AU05 document count != 1: {doc_rows!r}')
          document_id = doc_rows[0][0]

          section_rows = conn.execute(
              'SELECT section_id, section_order FROM content_sections WHERE document_id=? ORDER BY section_order',
              (document_id,),
          ).fetchall()
          if len(section_rows) != 26:
              raise RuntimeError(f'AU05 section count != 26: {len(section_rows)}')
          section_id_by_order = {int(order): int(section_id) for section_id, order in section_rows}
          if set(section_id_by_order) != set(range(1, 27)):
              raise RuntimeError(f'AU05 section orders invalid: {sorted(section_id_by_order)}')

          for section_order, keyword_order, concept_id, concept_key in expected:
              row = conn.execute(
                  'SELECT concept_key FROM content_keyword_concepts WHERE concept_id=?',
                  (concept_id,),
              ).fetchone()
              if row is None or row[0] != concept_key:
                  raise RuntimeError(
                      f'Concept mismatch: id={concept_id} expected={concept_key!r} actual={row!r}'
                  )

          existing = conn.execute(
              '''SELECT s.section_order, k.keyword_order, k.concept_id
                 FROM content_section_keywords k
                 JOIN content_sections s ON s.section_id = k.section_id
                 WHERE s.document_id = ?
                 ORDER BY s.section_order, k.keyword_order''',
              (document_id,),
          ).fetchall()

          expected_triples = sorted((so, ko, cid) for so, ko, cid, _ in expected)
          existing_triples = sorted((int(a), int(b), int(c)) for a,b,c in existing)

          if existing_triples:
              if existing_triples == expected_triples:
                  print('AU05_ALREADY_OK count=93')
                  conn.close()
                  raise SystemExit(0)
              raise RuntimeError(
                  f'AU05 already has non-matching assignments: count={len(existing_triples)}'
              )

          insert_rows = [
              (section_id_by_order[so], cid, ko)
              for so, ko, cid, _ in expected
          ]

          try:
              conn.execute('BEGIN TRANSACTION')
              conn.executemany(
                  'INSERT INTO content_section_keywords (section_id, concept_id, keyword_order) VALUES (?, ?, ?)',
                  insert_rows,
              )
              conn.commit()
          except Exception:
              conn.rollback()
              raise

          actual = conn.execute(
              '''SELECT s.section_order, k.keyword_order, k.concept_id
                 FROM content_section_keywords k
                 JOIN content_sections s ON s.section_id = k.section_id
                 WHERE s.document_id = ?
                 ORDER BY s.section_order, k.keyword_order''',
              (document_id,),
          ).fetchall()
          actual_triples = sorted((int(a), int(b), int(c)) for a,b,c in actual)

          if actual_triples != expected_triples:
              raise RuntimeError(
                  f'Post-insert verification mismatch: expected=93 actual={len(actual_triples)}'
              )

          print('AU05_IMPORT_OK count=93')
          print(f'AU05_DOCUMENT_ID={document_id}')
          print(f'AU05_SECTION_ID_RANGE={min(section_id_by_order.values())}..{max(section_id_by_order.values())}')
          conn.close()
          PY
