name: SOL add playlist viewer once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_add-playlist-viewer-once.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register playlist API module
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('piosenki/app.py')
          s = p.read_text(encoding='utf-8')
          marker = 'import playlist_api  # noqa: E402,F401'
          needle = '# Rejestruje dodatkowy read-only endpoint Content Explorer w tej samej aplikacji Flask.'
          if marker not in s:
              if needle not in s:
                  raise SystemExit('Nie znaleziono miejsca do rejestracji playlist_api')
              s = s.replace(needle, '# Rejestruje read-only endpoint playlist w tej samej aplikacji Flask.\n' + marker + '\n\n' + needle, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit app registration and remove installer
        run: |
          git config user.name "maciektora-hue"
          git config user.email "maciek.tora@gmail.com"
          rm -f .github/workflows/SOL_add-playlist-viewer-once.yml
          git add piosenki/app.py .github/workflows/SOL_add-playlist-viewer-once.yml
          git commit -m "Register playlist API and remove installer" || true
          git push
