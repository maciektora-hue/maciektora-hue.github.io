name: Dodaj linki w sprzężeniach Rosji

on:
  push:
    paths:
      - '.github/workflows/patch-rosja-sprzezenia.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dodaj linki do źródeł w sprzężeniach
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rosja/index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
              .loop-links {
                display: flex;
                flex-wrap: wrap;
                gap: 7px;
                margin-top: 17px;
              }

              .loop-links a {
                display: inline-flex;
                align-items: center;
                min-height: 28px;
                padding: 4px 9px;
                border: 1px solid var(--line);
                color: var(--gold-hot);
                background: var(--ink-2);
                font-family: var(--mono);
                font-size: .66rem;
                font-weight: 800;
                letter-spacing: .04em;
                text-decoration: none;
                text-transform: uppercase;
              }

              .loop-links a:hover,
              .loop-links a:focus-visible {
                border-color: var(--gold);
                color: var(--ink);
                background: var(--gold);
              }
          '''

          needle = '''    .loop p:last-child {
              margin: 0;
              color: var(--paper-dim);
              font-family: var(--sans);
              font-size: .79rem;
              line-height: 1.55;
            }
          '''
          if '.loop-links {' not in s:
              s = s.replace(needle, needle + css)

          repl = {
          '''            <p>Geografia wymusza wybór osłanianych zasobów. Każda koncentracja obrony tworzy gdzie indziej rachunek do zapłacenia — i rachunek ma drona.</p>''': '''            <p>Geografia wymusza wybór osłanianych zasobów. Każda koncentracja obrony tworzy gdzie indziej rachunek do zapłacenia — i rachunek ma drona.<span class="loop-links"><a href="a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31.html">A1</a><a href="a2_ZAMROZONE-maj-2026-gradually-stalo-sie-suddenly-v25_00-2026-06-25.html">A2</a><a href="a5_ZAMROZONE-audyt-2rewizje-v03_00-2026-06-23.html">A5</a><a href="a6_ZAMROZONE-zapas-kontra-strumien-v02_00-2026-07-03.html">A6</a></span></p>''',
          '''            <p>Nie trzeba niszczyć wszystkiego. Wystarczy, by tempo uszkodzeń stale przekraczało tempo odtwarzania, a system sam dopisze resztę w rubryce „zużycie naturalne”.</p>''': '''            <p>Nie trzeba niszczyć wszystkiego. Wystarczy, by tempo uszkodzeń stale przekraczało tempo odtwarzania, a system sam dopisze resztę w rubryce „zużycie naturalne”.<span class="loop-links"><a href="a2_ZAMROZONE-maj-2026-gradually-stalo-sie-suddenly-v25_00-2026-06-25.html">A2</a><a href="a4_lipiec-2026-przejscie-na-hurt-v20_11-2026-08-01.html">A4</a></span></p>''',
          '''            <p>Długie zużywanie gospodarki może nagle dostać krótki zapalnik. Bankowość tłumaczy degradację infrastruktury na język, który nawet elita rozumie bez napisów.</p>''': '''            <p>Długie zużywanie gospodarki może nagle dostać krótki zapalnik. Bankowość tłumaczy degradację infrastruktury na język, który nawet elita rozumie bez napisów.<span class="loop-links"><a href="a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31.html">A1</a><a href="a4_lipiec-2026-przejscie-na-hurt-v20_11-2026-08-01.html">A4</a><a href="a5_ZAMROZONE-audyt-2rewizje-v03_00-2026-06-23.html">A5</a></span></p>''',
          '''            <p>Dark Legitimacy toleruje korupcję i brutalność. Nie toleruje nieskuteczności. Gdy centrum przestaje wyglądać na silne, elity odkrywają nagle talent do arytmetyki.</p>''': '''            <p>Dark Legitimacy toleruje korupcję i brutalność. Nie toleruje nieskuteczności. Gdy centrum przestaje wyglądać na silne, elity odkrywają nagle talent do arytmetyki.<span class="loop-links"><a href="a4_lipiec-2026-przejscie-na-hurt-v20_11-2026-08-01.html">A4</a><a href="d1-zamrozone-narzedzie-dark-legitimacy-horbyk-v01_00-2026-03-25.html">D1</a><a href="a6_ZAMROZONE-zapas-kontra-strumien-v02_00-2026-07-03.html">A6</a><a href="a7_ZAMROZONE-jak-koncza-sie-panstwa-v02_00-2026-06-28.html">A7</a></span></p>''',
          '''            <p>Klimat nie musi koordynować się z Ukrainą. Wystarczy, że atakuje te same bufory, z których wojna już wypiła smar, ludzi i pieniądze.</p>''': '''            <p>Klimat nie musi koordynować się z Ukrainą. Wystarczy, że atakuje te same bufory, z których wojna już wypiła smar, ludzi i pieniądze.<span class="loop-links"><a href="a2_ZAMROZONE-maj-2026-gradually-stalo-sie-suddenly-v25_00-2026-06-25.html">A2</a></span></p>''',
          '''            <p>Adaptacja działa i właśnie dlatego jest podstępna: ratuje przepływ dziś, sprzedając kawałek swobody jutro. Suwerenność zostaje, tylko instrukcja obsługi przychodzi po mandaryńsku.</p>''': '''            <p>Adaptacja działa i właśnie dlatego jest podstępna: ratuje przepływ dziś, sprzedając kawałek swobody jutro. Suwerenność zostaje, tylko instrukcja obsługi przychodzi po mandaryńsku.<span class="loop-links"><a href="a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31.html">A1</a><a href="a2_ZAMROZONE-maj-2026-gradually-stalo-sie-suddenly-v25_00-2026-06-25.html">A2</a><a href="a4_lipiec-2026-przejscie-na-hurt-v20_11-2026-08-01.html">A4</a><a href="a5_ZAMROZONE-audyt-2rewizje-v03_00-2026-06-23.html">A5</a><a href="a7_ZAMROZONE-jak-koncza-sie-panstwa-v02_00-2026-06-28.html">A7</a></span></p>'''
          }

          changed = 0
          for old, new in repl.items():
              if old in s:
                  s = s.replace(old, new)
                  changed += 1

          if changed != 6:
              raise SystemExit(f'Nie znaleziono wszystkich bloków: {changed}/6')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Zapisz zmianę
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosja/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Dodaj linki do źródeł w sprzężeniach"
          git push
