name: Turso probe (read-only)

# Sprawdza wyłącznie, czy instancja Turso nadal istnieje.
# Nie używa tokena, nie łączy się z bazą, nie zapisuje niczego.
# 404 = bazy nie ma. 401/200 = baza istnieje.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/turso-probe-readonly.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoint without credentials
        env:
          HOST: happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
        run: |
          echo "host: $HOST"
          echo "--- DNS ---"
          getent hosts "$HOST" || true
          echo "--- GET / (bez Authorization) ---"
          curl -sS -o body1.txt -w 'HTTP %{http_code}\n' --max-time 20 "https://$HOST/" || true
          head -c 400 body1.txt; echo
          echo "--- GET /health (bez Authorization) ---"
          curl -sS -o body2.txt -w 'HTTP %{http_code}\n' --max-time 20 "https://$HOST/health" || true
          head -c 400 body2.txt; echo
          echo "--- POST /v2/pipeline (bez Authorization) ---"
          curl -sS -o body3.txt -w 'HTTP %{http_code}\n' --max-time 20 \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "https://$HOST/v2/pipeline" || true
          head -c 400 body3.txt; echo
          echo "--- INTERPRETACJA ---"
          echo "404 wszedzie          => baza nie istnieje, token martwy"
          echo "401 / 200 gdziekolwiek => baza istnieje, token rw dziala, unieważnić"
