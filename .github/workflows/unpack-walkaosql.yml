name: unpack walkaosql zip

on:
  push:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZIP into new subdirectory
        run: |
          set -e
          rm -rf walkaosql/rozpakowane
          mkdir -p walkaosql/rozpakowane
          unzip -o walkaosql/happy-hue-octopus-backup.sql.zip -d walkaosql/rozpakowane

      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add walkaosql/rozpakowane
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unpack walkaosql ZIP"
          git push
