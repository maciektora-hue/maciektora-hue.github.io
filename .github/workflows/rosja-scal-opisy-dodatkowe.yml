name: ROSJA - scal dodatkowe opisy sekcji

on:
  push:
    paths:
      - 'rosja/SOL_opisy-sekcji-*.tsv'
      - 'rosja/SOL_scal-opisy-dodatkowe.py'
      - '.github/workflows/rosja-scal-opisy-dodatkowe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opisy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scal dodatkowe opisy
        run: python rosja/SOL_scal-opisy-dodatkowe.py
      - name: Zapisz wynik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            rosja/SOL_opisy-sekcji-A2.tsv \
            rosja/SOL_opisy-sekcji-A3.tsv \
            rosja/SOL_mapa-sekcji-z-opisami-bez-A1.tsv \
            rosja/SOL_mapa-sekcji-z-opisami.tsv
          if git diff --cached --quiet; then
            echo "Brak zmian."
            exit 0
          fi
          git commit -m "ROSJA: odzyskaj A2 A3 i zapisz pelna mape opisow"
          git push origin HEAD:main
