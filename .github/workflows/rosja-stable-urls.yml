name: Rosja - stabilne publiczne URL-e

on:
  push:
    paths:
      - '.github/workflows/rosja-stable-urls.yml'

permissions:
  contents: write

jobs:
  stable-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Utworz stale adresy i przepnij index oraz mape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('rosja')
          index = root / 'index.html'
          mapa = root / 'SOL_mapa-tematow-korpusu-rozpad-rosji-v01_01-2026-09-03.html'

          mapping = {
              'mapa/': 'SOL_mapa-tematow-korpusu-rozpad-rosji-v01_01-2026-09-03.html',
              'kolumbryna/': 'a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31.html',
              'gradually-suddenly/': 'a2_ZAMROZONE-maj-2026-gradually-stalo-sie-suddenly-v25_00-2026-06-25.html',
              'lista-celow/': 'a3_ZAMROZONE-lista-celow-v19_00-2026-06-25.html',
              'przejscie-na-hurt/': 'a4_lipiec-2026-przejscie-na-hurt-v20_11-2026-08-01.html',
              'audyt/': 'a5_ZAMROZONE-audyt-2rewizje-v03_00-2026-06-23.html',
              'zapas-kontra-strumien/': 'a6_ZAMROZONE-zapas-kontra-strumien-v02_00-2026-07-03.html',
              'jak-koncza-sie-panstwa/': 'a7_ZAMROZONE-jak-koncza-sie-panstwa-v02_00-2026-06-28.html',
              'dark-legitimacy/': 'd1-zamrozone-narzedzie-dark-legitimacy-horbyk-v01_00-2026-03-25.html',
              'disinfolklore/': 'd2-zamrozone-narzedzie-disinfolklore-kompilacja-v01_00-2026-03-25.html',
              'disinfolklore-swot/': 'd3-zamrozone-narzedzie-disinfolklore-swot-advocatus-v01_00-2026-03-25.html',
              'rosyjskie-samobojstwa/': 'd4-zamrozone-rosyjskie-samobojstwa-taksonomia-v08_01-2026-06-13.html',
              'putin-cornered/': 'd5-zamrozone-putin-cornered-animal-v03_00-2026-03-24.html',
              'jalta-3/': 'd6-zamrozone-jalta-3-analiza-strategiczna-v01_00-2026-03-08.html',
              'jalta-3-apendyks/': 'd7-zamrozone-jalta-3-apendyks-v01_00-2026-03-08.html',
              'ropa-gaz/': 'ropa-gaz-geopolityka-analiza-v01_00-2026-03-17.html',
              'monopole/': 'monopole-moralnosc-transformacja-zrodla-v01_00-2026-03-17.html',
          }

          missing = [target for target in mapping.values() if not (root / target).exists()]
          if missing:
              raise SystemExit('Brak plikow docelowych: ' + ', '.join(missing))

          for alias, target in mapping.items():
              d = root / alias.rstrip('/')
              d.mkdir(parents=True, exist_ok=True)
              rel = '../' + target
              lines = [
                  '<!doctype html>',
                  '<html lang="pl">',
                  '<head>',
                  '  <meta charset="utf-8">',
                  '  <meta name="robots" content="noindex">',
                  f'  <meta http-equiv="refresh" content="0; url={rel}">',
                  '  <title>Przekierowanie</title>',
                  f'  <script>location.replace({rel!r} + location.hash);</script>',
                  '</head>',
                  '<body>',
                  f'  <p><a href="{rel}">Przejdź do tekstu</a></p>',
                  '</body>',
                  '</html>',
                  '',
              ]
              (d / 'index.html').write_text('\n'.join(lines), encoding='utf-8')

          replacements = {target: alias for alias, target in mapping.items()}

          def rewire(path):
              s = path.read_text(encoding='utf-8')
              changed = 0
              for old, new in replacements.items():
                  pattern = re.compile(r'href="' + re.escape(old) + r'(?P<frag>#[^"]*)?"')
                  s, n = pattern.subn(lambda m: f'href="{new}{m.group("frag") or ""}"', s)
                  changed += n
              path.write_text(s, encoding='utf-8')
              return s, changed

          index_text, index_changed = rewire(index)
          mapa_text, mapa_changed = rewire(mapa)

          leftovers = []
          for label, text in [('index', index_text), ('mapa', mapa_text)]:
              for href in re.findall(r'href="([^"]+)"', text):
                  base = href.split('#', 1)[0]
                  if base in replacements:
                      leftovers.append(f'{label}:{href}')
          if leftovers:
              raise SystemExit('Zostaly stare URL-e: ' + ', '.join(leftovers))

          for alias, target in mapping.items():
              p = root / alias / 'index.html'
              txt = p.read_text(encoding='utf-8')
              if ('../' + target) not in txt:
                  raise SystemExit(f'Bledny alias {alias} -> {target}')

          broken = []
          for source, text in [(index, index_text), (mapa, mapa_text)]:
              for href in re.findall(r'href="([^"]+)"', text):
                  if href.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:')):
                      continue
                  target = href.split('#', 1)[0]
                  if not target:
                      continue
                  q = root / target
                  if target.endswith('/'):
                      q = q / 'index.html'
                  if not q.exists():
                      broken.append(f'{source.name}:{href}')
          if broken:
              raise SystemExit('BROKEN LOCAL LINKS: ' + ', '.join(sorted(set(broken))))

          print(f'Utworzono stabilnych URL-i: {len(mapping)}')
          print(f'Przepieto linkow w indexie: {index_changed}')
          print(f'Przepieto linkow w mapie: {mapa_changed}')
          print('Stare wersjonowane href-y w indexie i mapie: 0')
          print('Uszkodzone lokalne linki po zmianie: 0')
          PY

      - name: Zapisz zmiany
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosja/index.html rosja/SOL_mapa-tematow-korpusu-rozpad-rosji-v01_01-2026-09-03.html
          find rosja -mindepth 2 -maxdepth 2 -name index.html -print0 | xargs -0 git add
          git diff --cached --quiet && exit 0
          git commit -m "Rosja: dodaj stabilne publiczne URL-e"
          git push
