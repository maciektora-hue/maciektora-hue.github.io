name: Rozpakuj Rosja ZIP

on:
  push:
    paths:
      - '.github/workflows/unzip-rosja.yml'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rozpakuj ZIP
        run: unzip -o rosja_do_wgrania.zip -d .

      - name: Usuń ZIP transportowy
        run: rm rosja_do_wgrania.zip

      - name: Zapisz rozpakowane pliki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rozpakuj Rosja"
          git push
