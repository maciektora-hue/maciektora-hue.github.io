name: SOL A1 - sprawdz API struktury ROSJA

on:
  push:
    paths:
      - '.github/workflows/SOL_a1_9_tomow.yml'

permissions:
  contents: read

jobs:
  check-rosja-structure-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sprawdz publiczne API struktury ROSJA
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://piosenki-api.onrender.com/api/content/rosja/structure';

          function stop(msg) {
            throw new Error('STOP API ROSJA: ' + msg);
          }

          async function main() {
            const response = await fetch(url, { signal: AbortSignal.timeout(120000) });
            if (!response.ok) stop(`HTTP ${response.status}`);

            const data = await response.json();
            const rows = Array.isArray(data.rows) ? data.rows : [];
            const s = data.status || {};

            if (rows.length !== 629) stop(`rows=${rows.length}, oczekiwano 629`);
            if (Number(s.documents) !== 16) stop(`documents=${s.documents}, oczekiwano 16`);
            if (Number(s.sections) !== 620) stop(`sections=${s.sections}, oczekiwano 620`);
            if (Number(s.volumes) !== 9) stop(`volumes=${s.volumes}, oczekiwano 9`);
            if (Number(s.structure_nodes) !== 629) stop(`structure_nodes=${s.structure_nodes}, oczekiwano 629`);

            const toms = rows.filter(r => r.section_kind === 'volume');
            if (toms.length !== 9) stop(`TOM rows=${toms.length}, oczekiwano 9`);

            console.log(`OK API ROSJA: HTTP 200; H=${s.sections}; TOM=${s.volumes}; razem=${s.structure_nodes}; rows=${rows.length}`);
          }

          main().catch(err => {
            console.error(err.message);
            process.exit(1);
          });
          NODE
