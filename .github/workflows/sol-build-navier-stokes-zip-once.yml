name: SOL build Navier-Stokes essay ZIP once

on:
  push:
    paths:
      - '.github/sol-data/nszip/**'

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until all chunks exist
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          ready=yes
          for i in 00 01 02 03 04 05 06 07; do
            if [[ ! -f ".github/sol-data/nszip/part${i}.b64" ]]; then
              ready=no
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Rebuild ZIP
        if: steps.ready.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/sol-data/nszip/part*.b64 | base64 -d > rownania/navier-stokes-esej-PL-EN-v02_00-2026-09-09.zip
          unzip -t rownania/navier-stokes-esej-PL-EN-v02_00-2026-09-09.zip
          rm -rf .github/sol-data/nszip
          rm -f .github/workflows/sol-build-navier-stokes-zip-once.yml

      - name: Commit ZIP and clean temporary files
        if: steps.ready.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rownania/navier-stokes-esej-PL-EN-v02_00-2026-09-09.zip .github/sol-data/nszip .github/workflows/sol-build-navier-stokes-zip-once.yml
          git commit -m "Add Navier-Stokes essay PL-EN ZIP"
          git push
