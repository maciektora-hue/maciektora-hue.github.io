name: SOL parse audio 0151-0200 once

on:
  push:
    paths:
      - '.github/workflows/sol-parse-audio-0151-0200-once.yml'

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse filenames
        run: python piosenki/SOL_parse-audio-filenames-v02.py
      - name: Commit corrected TSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/audio_filename_parsed_0151_0200.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Fix parsed audio filenames 0151-0200"
          git push
# rerun: normalized-colon precedence fix
