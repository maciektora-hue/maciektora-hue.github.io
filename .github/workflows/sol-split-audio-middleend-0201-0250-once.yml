name: SOL split audio middle_end 0201-0250 once

on:
  push:
    paths:
      - '.github/workflows/sol-split-audio-middleend-0201-0250-once.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split candidates
        run: |
          python -u piosenki/SOL_split-audio-middleend-candidates-v01.py \
            --input piosenki/audio_middleend_candidates_0201_0250.tsv \
            --ready piosenki/audio_middleend_ready_0201_0250.tsv \
            --review piosenki/audio_middleend_review_0201_0250.tsv
      - name: Commit split TSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/audio_middleend_ready_0201_0250.tsv piosenki/audio_middleend_review_0201_0250.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Split audio middle_end candidates 0201-0250"
          git push
