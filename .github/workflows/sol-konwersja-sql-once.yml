name: SOL konwersja danych piosenek do SQL

on:
  push:
    paths:
      - '.github/workflows/sol-konwersja-sql-once.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SQL
        run: python piosenki/sol-konwertuj-do-sql-PY-v01-00.py

      - name: Commit generated SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/SOL-import-danych.sql
          git diff --cached --quiet && exit 0
          git commit -m "Wygeneruj SQL z danych piosenek"
          git push
