name: Rosja - audyt generycznych anchorow

on:
  push:
    paths:
      - '.github/workflows/rosja-audit-anchor-forwarding.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdz zachowanie fragmentow przez wszystkie stale URL-e
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('rosja')
          aliases = sorted(root.glob('*/index.html'))
          if not aliases:
              raise SystemExit('Brak aliasow do sprawdzenia')

          errors = []
          targets_with_ids = 0
          total_ids = 0

          for alias in aliases:
              txt = alias.read_text(encoding='utf-8')

              if 'location.replace' not in txt or 'location.hash' not in txt:
                  errors.append(f'{alias}: redirect nie zachowuje location.hash')
                  continue

              m = re.search(r'content="0; url=(\.\./[^\"]+)"', txt)
              if not m:
                  errors.append(f'{alias}: brak czytelnego celu redirectu')
                  continue

              rel = m.group(1)
              target = (alias.parent / rel).resolve()
              if not target.exists():
                  errors.append(f'{alias}: cel nie istnieje: {rel}')
                  continue

              target_txt = target.read_text(encoding='utf-8')
              ids = re.findall(r'\bid=["\']([^"\']+)["\']', target_txt)
              if ids:
                  targets_with_ids += 1
                  total_ids += len(ids)

          if errors:
              raise SystemExit('\n'.join(errors))

          print(f'Stale URL-e sprawdzone: {len(aliases)}')
          print(f'Aliasow zachowujacych dowolny #fragment przez location.hash: {len(aliases)}')
          print(f'Plikow docelowych zawierajacych anchory id=: {targets_with_ids}')
          print(f'Lacznie znalezionych id= w tych plikach: {total_ids}')
          print('Wynik: SUCCESS - mechanizm jest generyczny; nie wymaga listy anchorow.')
          PY
