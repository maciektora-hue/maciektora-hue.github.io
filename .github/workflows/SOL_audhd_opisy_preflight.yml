name: SOL AuDHD - preflight opisow sekcji

on:
  push:
    branches:
      - sql-audhd-content
    paths:
      - '.github/workflows/SOL_audhd_opisy_preflight.yml'
      - 'audhd/SOL_preflight-opisy-sql.js'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zainstaluj klienta libSQL
        run: npm install --no-save @libsql/client

      - name: Sprawdz dopasowanie 338 opisow do SQL bez zapisu
        run: node audhd/SOL_preflight-opisy-sql.js
