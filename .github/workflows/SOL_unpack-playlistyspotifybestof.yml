name: SOL unpack working playlists

on:
  push:
    branches: [main]
    paths:
      - 'dane-robocze/playlistyspotifybestof.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack playlists
        shell: bash
        run: |
          set -euo pipefail
          ZIP='dane-robocze/playlistyspotifybestof.zip'
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          mapfile -t TOP < <(find "$TMP" -mindepth 1 -maxdepth 1 -printf '%f\n')
          if [ "${#TOP[@]}" -eq 1 ] && [ -d "$TMP/${TOP[0]}" ]; then
            cp -a "$TMP"/. dane-robocze/
          else
            DEST='dane-robocze/playlistyspotifybestof'
            mkdir -p "$DEST"
            cp -a "$TMP"/. "$DEST"/
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dane-robocze
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Unpack Spotify playlist working files'
          git push
