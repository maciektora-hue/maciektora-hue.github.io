name: SOL fix mostow playlist w Turso

on:
  push:
    paths:
      - '.github/workflows/sol-fix-mosty-playlisty-once.yml'

permissions:
  contents: read

jobs:
  fix-mosty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install libsql
      - name: Fix active playlist tags and verify unchanged contents
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          import libsql

          conn = libsql.connect(
              database=os.environ['TURSO_DATABASE_URL'],
              auth_token=os.environ['TURSO_AUTH_TOKEN'],
          )

          fixes = {
              'spotify:most-glebia-ruch:2026-09-11': {
                  'expected_positions': 99,
                  'expected_mapped': 99,
                  'playlist_tags': 'owner:maciek-tora; most=glebia-ruch; spotify_url=https://open.spotify.com/playlist/42r40qtwg2mOoHDk5Akr9G; youtube_music_url=https://music.youtube.com/playlist?list=PLacFJ1WpA7YQ',
              },
              'spotify:most-glebia-swiatlo:2026-09-11': {
                  'expected_positions': 2,
                  'expected_mapped': 2,
                  'playlist_tags': 'owner:maciek-tora; most=glebia-swiatlo',
              },
              'spotify:most-swiatlo-ruch:2026-09-11': {
                  'expected_positions': 43,
                  'expected_mapped': 43,
                  'playlist_tags': 'owner:maciek-tora; most=swiatlo-ruch',
              },
          }

          def state(pid):
              row = conn.execute(
                  '''SELECT p.playlist_id, p.name, p.playlist_tags, p.tags,
                            p.external_playlist_id, p.external_url,
                            COUNT(i.position),
                            SUM(CASE WHEN EXISTS (
                                SELECT 1 FROM external_track_utwu x
                                WHERE x.external_track_pk=i.external_track_pk
                            ) THEN 1 ELSE 0 END)
                     FROM playlist p
                     LEFT JOIN playlist_item i ON i.playlist_id=p.playlist_id
                     WHERE p.playlist_id=?
                     GROUP BY p.playlist_id, p.name, p.playlist_tags, p.tags,
                              p.external_playlist_id, p.external_url''',
                  (pid,),
              ).fetchone()
              if row is None:
                  raise RuntimeError('Brak playlisty: ' + pid)
              return {
                  'playlist_id': row[0], 'name': row[1], 'playlist_tags': row[2],
                  'legacy_tags': row[3], 'external_playlist_id': row[4],
                  'external_url': row[5], 'positions': int(row[6] or 0),
                  'mapped': int(row[7] or 0),
              }

          before = {pid: state(pid) for pid in fixes}
          print('BEFORE=' + json.dumps(before, ensure_ascii=False, sort_keys=True))
          for pid, cfg in fixes.items():
              s = before[pid]
              if s['positions'] != cfg['expected_positions'] or s['mapped'] != cfg['expected_mapped']:
                  raise RuntimeError('Nieoczekiwany stan przed poprawką: ' + repr(s))

          conn.execute('BEGIN')
          try:
              for pid, cfg in fixes.items():
                  conn.execute(
                      'UPDATE playlist SET playlist_tags=? WHERE playlist_id=?',
                      (cfg['playlist_tags'], pid),
                  )
              conn.execute('COMMIT')
          except Exception:
              conn.execute('ROLLBACK')
              raise

          after = {pid: state(pid) for pid in fixes}
          print('AFTER=' + json.dumps(after, ensure_ascii=False, sort_keys=True))
          for pid, cfg in fixes.items():
              s = after[pid]
              if s['playlist_tags'] != cfg['playlist_tags']:
                  raise RuntimeError('Niepoprawne playlist_tags po COMMIT: ' + repr(s))
              if s['positions'] != cfg['expected_positions'] or s['mapped'] != cfg['expected_mapped']:
                  raise RuntimeError('Zawartość lub mapowanie zmieniło się podczas poprawki: ' + repr(s))

          print('BRIDGE_PLAYLIST_METADATA_FIX_OK')
          conn.close()
          PY
