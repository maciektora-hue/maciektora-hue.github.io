name: SOL content keywords - marker schematu

on:
  push:
    branches:
      - sql-audhd-content
    paths:
      - '.github/workflows/SOL_content_keywords_marker.yml'

permissions:
  contents: read

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zainstaluj klienta libSQL
        run: npm install --no-save @libsql/client

      - name: Zapisz marker i zweryfikuj
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { createClient } = require('@libsql/client');

          function stop(msg) {
            throw new Error('STOP KEYWORDS MARKER: ' + msg);
          }

          function hashRows(rows) {
            const normalized = rows.map(row => {
              const out = {};
              for (const [k, v] of Object.entries(row)) out[k] = v == null ? null : String(v);
              return out;
            });
            return crypto.createHash('sha256').update(JSON.stringify(normalized)).digest('hex');
          }

          async function snapshot(client) {
            const sections = await client.execute(`
              SELECT section_id, document_id, parent_section_id, section_kind,
                     heading_level, depth, section_order, structure_order,
                     section_title, section_title_en, anchor,
                     description, description_en, keywords_pl, keywords_en,
                     content_html
              FROM content_sections
              ORDER BY section_id
            `);
            const documents = await client.execute(`
              SELECT document_id, collection_id, document_code, source_filename,
                     document_title, canonical_url, source_url, sort_order
              FROM content_documents
              ORDER BY document_id
            `);
            return {
              sectionsCount: sections.rows.length,
              sectionsHash: hashRows(sections.rows),
              documentsCount: documents.rows.length,
              documentsHash: hashRows(documents.rows)
            };
          }

          async function validateBase(client) {
            const tablesQ = await client.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name");
            const tables = new Set(tablesQ.rows.map(r => String(r.name)));
            for (const t of ['content_meta','content_sections','content_documents','content_keyword_concepts','content_keyword_terms','content_section_keywords']) {
              if (!tables.has(t)) stop(`brak tabeli ${t}`);
            }

            for (const t of ['content_keyword_concepts','content_keyword_terms','content_section_keywords']) {
              const q = await client.execute(`SELECT count(*) AS n FROM ${t}`);
              if (Number(q.rows[0].n) !== 0) stop(`${t} nie jest pusta`);
            }

            const audhd = await client.execute(`
              SELECT count(DISTINCT d.document_id) AS documents,
                     sum(CASE WHEN s.section_kind='heading' THEN 1 ELSE 0 END) AS headings,
                     sum(CASE WHEN s.section_kind='heading' AND s.description IS NOT NULL AND trim(s.description)<>'' THEN 1 ELSE 0 END) AS descriptions
              FROM content_sections s
              JOIN content_documents d ON d.document_id=s.document_id
              WHERE d.collection_id='audhd'
            `);
            const a = audhd.rows[0];
            if (Number(a.documents)!==18 || Number(a.headings)!==338 || Number(a.descriptions)!==338) {
              stop(`AuDHD niezgodne: docs=${a.documents}, H=${a.headings}, opisy=${a.descriptions}`);
            }

            const rosja = await client.execute(`
              SELECT count(DISTINCT d.document_id) AS documents,
                     sum(CASE WHEN s.section_kind='heading' THEN 1 ELSE 0 END) AS headings,
                     sum(CASE WHEN s.section_kind='volume' THEN 1 ELSE 0 END) AS volumes,
                     sum(CASE WHEN s.section_kind='heading' AND s.description IS NOT NULL AND trim(s.description)<>'' THEN 1 ELSE 0 END) AS descriptions
              FROM content_sections s
              JOIN content_documents d ON d.document_id=s.document_id
              WHERE d.collection_id='rosja'
            `);
            const r = rosja.rows[0];
            if (Number(r.documents)!==16 || Number(r.headings)!==620 || Number(r.volumes)!==9 || Number(r.descriptions)!==620) {
              stop(`ROSJA niezgodna: docs=${r.documents}, H=${r.headings}, TOM=${r.volumes}, opisy=${r.descriptions}`);
            }
          }

          async function main() {
            const creds = fs.readFileSync('daneDoSql.txt', 'utf8');
            const urlMatch = creds.match(/libsql:\/\/[^\s]+/);
            const tokenMatch = creds.match(/eyJ[a-zA-Z0-9._-]+/);
            if (!urlMatch || !tokenMatch) stop('brak URL lub tokena');

            const client = createClient({ url: urlMatch[0], authToken: tokenMatch[0] });
            await validateBase(client);

            const existing = await client.execute({
              sql: 'SELECT value FROM content_meta WHERE key = ?',
              args: ['content_keywords_schema_v1']
            });
            if (existing.rows.length !== 0) stop(`marker juz istnieje: ${existing.rows[0].value}`);

            const before = await snapshot(client);

            await client.execute({
              sql: 'INSERT INTO content_meta(key, value) VALUES (?, ?)',
              args: ['content_keywords_schema_v1', 'done']
            });

            const marker = await client.execute({
              sql: 'SELECT value FROM content_meta WHERE key = ?',
              args: ['content_keywords_schema_v1']
            });
            if (marker.rows.length !== 1 || String(marker.rows[0].value) !== 'done') {
              stop('marker po zapisie jest nieprawidlowy');
            }

            await validateBase(client);
            const after = await snapshot(client);
            if (before.sectionsCount !== after.sectionsCount || before.sectionsHash !== after.sectionsHash) {
              stop('content_sections zmienione podczas zapisu markera');
            }
            if (before.documentsCount !== after.documentsCount || before.documentsHash !== after.documentsHash) {
              stop('content_documents zmienione podczas zapisu markera');
            }

            console.log('OK KEYWORDS MARKER: content_keywords_schema_v1=done; 3 tabele nadal puste; AuDHD 18/338/338; ROSJA 16/620/9/620; content_sections i content_documents IDENTYCZNE.');
          }

          main().catch(err => {
            console.error(err.message);
            process.exit(1);
          });
          NODE