name: SOL check content_sections translation columns

on:
  push:
    paths:
      - '.github/workflows/sol-check-content-sections-translation-columns.yml'
  workflow_dispatch:

jobs:
  check-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsql
        run: pip install libsql
      - name: Check live Turso schema
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import libsql

          conn = libsql.connect(
              database=os.environ['TURSO_DATABASE_URL'],
              auth_token=os.environ['TURSO_AUTH_TOKEN'],
          )
          rows = conn.execute('PRAGMA table_info(content_sections)').fetchall()
          print('CONTENT_SECTIONS_COLUMNS')
          for row in rows:
              print(row[1])
          names = {row[1] for row in rows}
          for col in ('section_title_en', 'description_en'):
              print(f'{col}=' + ('YES' if col in names else 'NO'))
          conn.close()
          PY
