name: SOL migracja walencji i biegunowosci

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_migracja_walencja_biegunowosc.yml'

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[RUN-WALENCJA-MIGRACJA]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj libsql
        run: pip install libsql

      - name: Wykonaj migracje i zweryfikuj
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_ADMIN_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path
          import libsql

          url = os.environ.get('TURSO_DATABASE_URL') or 'libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io'
          token = os.environ.get('TURSO_ADMIN_TOKEN')
          if not token:
              raise RuntimeError('Brak TURSO_ADMIN_TOKEN')

          sql = Path('piosenki/SOL_migracja-walencja-biegunowosc.sql').read_text(encoding='utf-8')
          conn = libsql.connect(database=url, auth_token=token)
          try:
              conn.execute('PRAGMA foreign_keys = ON')
              buf = ''
              for line in sql.splitlines(True):
                  buf += line
                  if sqlite3.complete_statement(buf):
                      stmt = buf.strip()
                      buf = ''
                      if stmt:
                          conn.execute(stmt)
              if buf.strip():
                  raise RuntimeError('Niekompletna instrukcja SQL na koncu pliku')

              tables = {r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name IN ('tag_valence','tag_axis_polarity')").fetchall()}
              if tables != {'tag_valence', 'tag_axis_polarity'}:
                  raise RuntimeError(f'Brak tabel po migracji: {tables}')

              total = conn.execute('SELECT COUNT(*) FROM tag_valence').fetchone()[0]
              pos = conn.execute('SELECT COUNT(*) FROM tag_valence WHERE valence = 1').fetchone()[0]
              neu = conn.execute('SELECT COUNT(*) FROM tag_valence WHERE valence = 0').fetchone()[0]
              neg = conn.execute('SELECT COUNT(*) FROM tag_valence WHERE valence = -1').fetchone()[0]
              bad_status = conn.execute("SELECT COUNT(*) FROM tag_valence WHERE status <> 'resolved'").fetchone()[0]
              orphans = conn.execute('SELECT COUNT(*) FROM tag_valence v LEFT JOIN tag_catalog c ON c.tag=v.tag WHERE c.tag IS NULL').fetchone()[0]
              polarity = conn.execute('SELECT COUNT(*) FROM tag_axis_polarity').fetchone()[0]

              if (total, pos, neu, neg, bad_status, orphans, polarity) != (76, 10, 2, 64, 0, 0, 0):
                  raise RuntimeError(f'Weryfikacja nieudana: total={total}, +={pos}, 0={neu}, -={neg}, bad_status={bad_status}, orphans={orphans}, polarity={polarity}')

              print(f'OK tag_valence={total}; +1={pos}; 0={neu}; -1={neg}; tag_axis_polarity={polarity}; orphans={orphans}')
          finally:
              conn.close()
          PY
