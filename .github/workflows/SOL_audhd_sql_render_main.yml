name: SOL AuDHD - przelacz strony na SQL

on:
  push:
    branches:
      - sql-audhd-content
    paths:
      - '.github/workflows/SOL_audhd_sql_render_main.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przelacz 18 stron AuDHD na renderer SQL
        shell: bash
        run: |
          set -euo pipefail
          cp SOL_patch_audhd_sql_render.py /tmp/SOL_patch_audhd_sql_render.py
          EXPECTED_MAIN='e88021176b6ffad60675ffb324d87f7fb79f1786'
          git fetch origin main
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          if [ "$ACTUAL_MAIN" != "$EXPECTED_MAIN" ]; then
            echo "STOP: main zmienil sie: expected=$EXPECTED_MAIN actual=$ACTUAL_MAIN"
            exit 1
          fi
          git checkout -B sol-audhd-sql-render origin/main
          python3 /tmp/SOL_patch_audhd_sql_render.py
          git config user.name 'maciektora-hue'
          git config user.email 'maciek.tora@gmail.com'
          git add piosenki/content_structure.py audhd
          git commit -m 'AuDHD: wyswietlaj 18 tekstow z SQL'
          git push origin HEAD:main
