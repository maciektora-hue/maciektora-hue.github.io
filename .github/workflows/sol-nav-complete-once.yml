name: SOL complete song navigation

on:
  push:
    paths:
      - '.github/workflows/sol-nav-complete-once.yml'

permissions:
  contents: write

jobs:
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete navigation graph
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise RuntimeError(f'Expected fragment not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Słowa PL: hreflang + EN switch.
          repl(
              'piosenki/slowa.html',
              '<title>Słowa — analiza tekstów piosenek</title>',
              '<title>Słowa — analiza tekstów piosenek</title>\n<link rel="alternate" hreflang="pl" href="slowa.html">\n<link rel="alternate" hreflang="en" href="slowa-en.html">'
          )
          repl(
              'piosenki/slowa.html',
              '<p class="meta"><a href="index.html">← Analiza piosenek</a> · <a href="audio.html">Audio</a></p>',
              '<p class="meta"><a href="index.html">← Analiza piosenek</a> · <a href="audio.html">Audio</a> · <a href="slowa-en.html" lang="en">English</a></p>'
          )

          # Audio PL/EN: sideways links to Lyrics branch.
          repl(
              'piosenki/audio.html',
              '<p class="meta"><a href="index.html">← Analiza piosenek</a> · <a href="audio-en.html" lang="en">English</a></p>',
              '<p class="meta"><a href="index.html">← Analiza piosenek</a> · <a href="slowa.html">Słowa</a> · <a href="audio-en.html" lang="en">English</a></p>'
          )
          repl(
              'piosenki/audio-en.html',
              '<p class="meta"><a href="index-en.html">← Song analysis</a> · <a href="audio.html" lang="pl">Polski</a></p>',
              '<p class="meta"><a href="index-en.html">← Song analysis</a> · <a href="slowa-en.html">Lyrics</a> · <a href="audio.html" lang="pl">Polski</a></p>'
          )

          # Three-island result pages: back, sideways, language switch.
          repl(
              'piosenki/SOL-klastrowanie-audio-wyniki-dwa-glosy-v01-2026-09-08.html',
              '<p class="meta"><a href="audio.html">← Audio</a> · <a href="index.html">Analiza piosenek</a> · <a href="SOL-audio-clustering-three-island-signatures-two-voices-v01-2026-09-08-en.html" lang="en">English</a></p>',
              '<p class="meta"><a href="audio.html">← Audio</a> · <a href="index.html">Analiza piosenek</a> · <a href="slowa.html">Słowa</a> · <a href="SOL-audio-clustering-three-island-signatures-two-voices-v01-2026-09-08-en.html" lang="en">English</a></p>'
          )
          repl(
              'piosenki/SOL-audio-clustering-three-island-signatures-two-voices-v01-2026-09-08-en.html',
              '<p class="meta"><a href="audio-en.html">← Audio</a> · <a href="index-en.html">Song analysis</a> · <a href="SOL-klastrowanie-audio-wyniki-dwa-glosy-v01-2026-09-08.html" lang="pl">Polski</a></p>',
              '<p class="meta"><a href="audio-en.html">← Audio</a> · <a href="index-en.html">Song analysis</a> · <a href="slowa-en.html">Lyrics</a> · <a href="SOL-klastrowanie-audio-wyniki-dwa-glosy-v01-2026-09-08.html" lang="pl">Polski</a></p>'
          )

          print('NAV_GRAPH_OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/slowa.html piosenki/audio.html piosenki/audio-en.html \
            piosenki/SOL-klastrowanie-audio-wyniki-dwa-glosy-v01-2026-09-08.html \
            piosenki/SOL-audio-clustering-three-island-signatures-two-voices-v01-2026-09-08-en.html
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Complete PL EN song navigation graph"
          git push
