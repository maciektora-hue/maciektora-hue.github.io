name: SOL update middle_end audio 0001-0050 once

on:
  push:
    paths:
      - '.github/workflows/sol-update-middleend-audio-0001-0050-once.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsql
        run: pip install libsql
      - name: Extract batch 0001-0050
        run: |
          mkdir -p /tmp/audio-sql
          unzip -j piosenki/SOL_audio-SQL-wszystkie.zip \
            'SOL_audio-SQL-READY-0001-0050.tsv' \
            'SOL_audio-SQL-REVIEW-0001-0050.tsv' \
            -d /tmp/audio-sql
      - name: Update 36 READY rows
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python -u piosenki/SOL_update-middleend-audio-ready-v02.py \
            --source /tmp/audio-sql/SOL_audio-SQL-READY-0001-0050.tsv \
            --expected 36
      - name: Update 10 REVIEW rows
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python -u piosenki/SOL_update-middleend-audio-review-v02.py \
            --source /tmp/audio-sql/SOL_audio-SQL-REVIEW-0001-0050.tsv \
            --expected 10
