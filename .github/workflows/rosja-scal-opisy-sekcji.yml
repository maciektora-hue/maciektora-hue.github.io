name: ROSJA - scal opisy sekcji

on:
  push:
    paths:
      - 'rosja/SOL_scal-opisy-sekcji.py'
      - '.github/workflows/rosja-scal-opisy-sekcji.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opisy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scal reczne opisy
        run: python rosja/SOL_scal-opisy-sekcji.py
      - name: Zapisz wynik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosja/SOL_mapa-sekcji-z-opisami-bez-A1.tsv
          if git diff --cached --quiet; then
            echo "Brak zmian."
            exit 0
          fi
          git commit -m "ROSJA: mapa sekcji z recznymi opisami"
          git push origin HEAD:main
