name: SOL split audio middle_end 0151-0200 once

on:
  push:
    paths:
      - '.github/workflows/sol-split-audio-middleend-0151-0200-once.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split candidates
        run: python piosenki/SOL_split-audio-middleend-candidates-0151-0200-v01.py
      - name: Commit split TSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/audio_middleend_ready_0151_0200.tsv piosenki/audio_middleend_review_0151_0200.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Split audio-middle_end candidates 0151-0200"
          git push
