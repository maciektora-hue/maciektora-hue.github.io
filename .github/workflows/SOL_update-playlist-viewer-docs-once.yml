name: SOL update playlist viewer docs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_update-playlist-viewer-docs-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh before editing
        run: git pull --rebase origin main

      - name: Update architecture and cross-project docs
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('SOL_INSTRUKCJA-ARCHITEKTURA-SQL-GITHUB-RENDER-TURSO.md')
          s = p.read_text(encoding='utf-8')
          old = 'Viewer pokazuje tagi playlist, klikalne `external_url` oraz trzy tryby: playlista → utwory, utwór → playlisty, bez `utwu_id`.'
          new = '''Obie wersje viewera mają te same trzy tryby: playlista → utwory, utwór → playlisty, bez `utwu_id`. Pokazują tagi playlist i klikalne `external_url`.

W trybie **utwór → playlisty** frontend ma lokalne wyszukiwanie po tytule, artyście i `utwu_id`, a także filtr pokazujący wyłącznie utwory występujące na więcej niż jednej playliście. Wyniki są zawężane podczas pisania, przy utworze wyświetlana jest liczba playlist, a podsumowanie po wyborze utworu pokazuje liczbę różnych playlist, pozycji i zewnętrznych identyfikatorów.

Ta funkcja działa w JavaScript po stronie statycznego viewera na danych już pobranych z `GET /api/playlisty`. Nie wymaga nowego endpointu ani zapisu do SQL.'''
          if old not in s:
              raise SystemExit('architecture viewer marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('SOL_DOKUMENTACJA-MIEDZYKATALOGOWA-AKTUALNA.md')
          s = p.read_text(encoding='utf-8')
          marker = 'Dla `AllTimeBestSpotify` viewer pokazuje bezpośredni link do Spotify.'
          addition = '''Dla `AllTimeBestSpotify` viewer pokazuje bezpośredni link do Spotify.

Aktualny tryb **utwór → playlisty** w obu wersjach językowych ma wyszukiwanie po tytule, artyście i `utwu_id` oraz filtr „tylko utwory występujące na więcej niż jednej playliście”. Logika wyszukiwania jest lokalna w JavaScript i działa na danych już pobranych z `GET /api/playlisty`; backend i SQL nie są przy tym modyfikowane.'''
          if marker not in s:
              raise SystemExit('cross-project viewer marker not found')
          p.write_text(s.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "maciektora-hue"
          git config user.email "maciek.tora@gmail.com"
          git rm .github/workflows/SOL_update-playlist-viewer-docs-once.yml
          git add SOL_INSTRUKCJA-ARCHITEKTURA-SQL-GITHUB-RENDER-TURSO.md SOL_DOKUMENTACJA-MIEDZYKATALOGOWA-AKTUALNA.md
          git commit -m "Document playlist viewer search and filters"
          git push
