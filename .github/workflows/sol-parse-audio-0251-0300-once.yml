name: SOL parse audio 0251-0300 once

on:
  push:
    paths:
      - '.github/workflows/sol-parse-audio-0251-0300-once.yml'

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse batch 0251-0300
        run: |
          python -u piosenki/SOL_parse-audio-filenames-v03.py \
            --start 251 \
            --end 300 \
            --output piosenki/audio_filename_parsed_0251_0300.tsv
      - name: Commit parsed TSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/audio_filename_parsed_0251_0300.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Add parsed audio filenames 0251-0300"
          git push
