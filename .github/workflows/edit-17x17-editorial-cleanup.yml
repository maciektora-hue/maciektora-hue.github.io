name: Edit 17x17 editorial cleanup

on:
  push:
    paths:
      - '.github/workflows/edit-17x17-editorial-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old = Path('cv/CLAUDE_seventeen-and-seventeen-ai-concepts-EN-v08_05-2026-09-07.html')
          new = Path('cv/CLAUDE_seventeen-and-seventeen-ai-concepts-EN-v08_06-2026-09-07.html')
          public = Path('cv/seventeen-and-seventeen/index.html')
          assert old.exists()
          t = old.read_text(encoding='utf-8')

          # 1. Usuń historyczne "o co kaman" z 17 polskich podsekcji.
          count_o = t.count('Po polsku — o co kaman')
          assert count_o == 17, count_o
          t = t.replace('Po polsku — o co kaman', 'Po polsku')

          # 2. Ujednolić oznaczenia autorstwa.
          old_attr = '<p class="note"><b>Attribution markers.</b> <b>[M]</b> — Maciek. <b>[K]</b> — Klaudiusz (Claude). <b>[S]</b> — Sol (ChatGPT). They identify contribution or provenance where it matters.</p>'
          new_attr = '<p class="note"><b>Attribution markers.</b> <b>[M]</b> — Maciek; <b>[K]</b> — Klaudiusz; <b>[S]</b> — Sol. They identify contribution or provenance where it matters.</p>'
          assert old_attr in t
          t = t.replace(old_attr, new_attr, 1)

          # Bracket labels: jedna forma, [K] i [S].
          t = t.replace('[Klaudiusz]', '[K]').replace('[Sol]', '[S]')

          # Nazwa osoby/modelu: w narracji używamy Klaudiusz, nie Claude.
          t = re.sub(r'\bClaude\b', 'Klaudiusz', t)

          # Wersja robocza.
          t = t.replace('EN v08.05 – 2026-09-07', 'EN v08.06 – 2026-09-07')
          t = t.replace('EN v08.05 · 2026-09-07', 'EN v08.06 · 2026-09-07')

          # Twarde kontrole.
          assert 'Po polsku — o co kaman' not in t
          assert t.count('>Po polsku <span class="rank">[PL]</span></h4>') == 17
          assert '[Klaudiusz]' not in t
          assert '[Sol]' not in t
          assert 'Claude' not in t
          assert '<b>[K]</b> — Klaudiusz; <b>[S]</b> — Sol.' in t

          new.write_text(t, encoding='utf-8')
          public.write_text(t.replace('<meta name="robots" content="noindex">\n', '', 1), encoding='utf-8')
          old.unlink()

          print('17 podsekcji: usunięto "o co kaman"')
          print('Attribution: [M] Maciek; [K] Klaudiusz; [S] Sol')
          print('SUCCESS')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cv/CLAUDE_seventeen-and-seventeen-ai-concepts-EN-v08_05-2026-09-07.html cv/CLAUDE_seventeen-and-seventeen-ai-concepts-EN-v08_06-2026-09-07.html cv/seventeen-and-seventeen/index.html
          git commit -m "17x17: uporzadkuj podsekcje i attribution"
          git push
