name: SOL overwrite middle_end audio 0151-0250 fresh once

on:
  push:
    paths:
      - '.github/workflows/sol-overwrite-middleend-audio-0151-0250-fresh-once.yml'

permissions:
  contents: read

jobs:
  overwrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsql
        run: pip install libsql
      - name: Extract fresh batches 0151-0250
        run: |
          mkdir -p /tmp/audio-sql
          unzip -j piosenki/SOL_audio-SQL-wszystkie.zip \
            'SOL_audio-SQL-READY-0151-0200.tsv' \
            'SOL_audio-SQL-REVIEW-0151-0200.tsv' \
            'SOL_audio-SQL-READY-0201-0250.tsv' \
            'SOL_audio-SQL-REVIEW-0201-0250.tsv' \
            -d /tmp/audio-sql
      - name: Overwrite 0151-0250 from fresh files
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import csv, os, libsql

          specs = [
              ('/tmp/audio-sql/SOL_audio-SQL-READY-0151-0200.tsv', 'ready', 36),
              ('/tmp/audio-sql/SOL_audio-SQL-REVIEW-0151-0200.tsv', 'review', 11),
              ('/tmp/audio-sql/SOL_audio-SQL-READY-0201-0250.tsv', 'ready', 43),
              ('/tmp/audio-sql/SOL_audio-SQL-REVIEW-0201-0250.tsv', 'review', 7),
          ]

          ready, review = [], []
          for path, kind, expected in specs:
              with open(path, encoding='utf-8', newline='') as f:
                  rows = list(csv.DictReader(f, delimiter='\t'))
              if len(rows) != expected:
                  raise RuntimeError(f'{path}: {len(rows)} zamiast {expected}')
              (ready if kind == 'ready' else review).extend(rows)

          if any(r.get('decision') != 'use' for r in review):
              raise RuntimeError('REVIEW zawiera decision != use')

          fresh = []
          for r in ready:
              fresh.append((r['candidate_utwu_id'], r['audio_id'], r['youtube_video_id'], r['quality'], None, None))
          for r in review:
              fresh.append((r['utwu_id'], r['audio_id'], r['youtube_video_id'], 'review', r['variant_type'], r['note']))

          target_ids = [r[0] for r in fresh]
          audio_ids = [r[1] for r in fresh]
          if len(set(target_ids)) != len(target_ids):
              raise RuntimeError('Duplikat utwu_id w świeżych danych 0151-0250')
          if len(set(audio_ids)) != len(audio_ids):
              raise RuntimeError('Duplikat audio_id w świeżych danych 0151-0250')

          conn = libsql.connect(database=os.environ['TURSO_DATABASE_URL'], auth_token=os.environ['TURSO_AUTH_TOKEN'])
          conn.execute('PRAGMA foreign_keys = ON')

          p_t = ','.join('?' for _ in target_ids)
          p_a = ','.join('?' for _ in audio_ids)
          existing = conn.execute(f'SELECT COUNT(*) FROM middle_end WHERE utwu_id IN ({p_t})', target_ids).fetchone()[0]
          if existing != len(target_ids):
              raise RuntimeError(f'W middle_end istnieje {existing}/{len(target_ids)} świeżych utwu_id')

          try:
              conn.execute('BEGIN TRANSACTION')
              conn.execute(f'DELETE FROM audio_match_details WHERE utwu_id IN ({p_t}) OR audio_id IN ({p_a})', target_ids + audio_ids)
              conn.execute(f'UPDATE middle_end SET audio_id=NULL, youtube_video_id=NULL, audio_match_quality=NULL WHERE utwu_id IN ({p_t}) OR audio_id IN ({p_a})', target_ids + audio_ids)

              for utwu_id, audio_id, youtube_id, quality, variant_type, note in fresh:
                  conn.execute(
                      'UPDATE middle_end SET audio_id=?, youtube_video_id=?, audio_match_quality=? WHERE utwu_id=?',
                      (audio_id, youtube_id, quality, utwu_id),
                  )
                  if quality == 'review':
                      conn.execute(
                          'INSERT INTO audio_match_details (utwu_id, audio_id, variant_type, note) VALUES (?, ?, ?, ?)',
                          (utwu_id, audio_id, variant_type, note),
                      )
              conn.commit()
          except Exception:
              conn.rollback()
              raise

          got = conn.execute(
              f'SELECT utwu_id, audio_id, youtube_video_id, audio_match_quality FROM middle_end WHERE utwu_id IN ({p_t})',
              target_ids,
          ).fetchall()
          actual = {r[0]: (r[1], r[2], r[3]) for r in got}
          expected = {r[0]: (r[1], r[2], r[3]) for r in fresh}
          if actual != expected:
              raise RuntimeError('Weryfikacja świeżych danych middle_end nie przeszła')

          detail_count = conn.execute(
              f'SELECT COUNT(*) FROM audio_match_details WHERE utwu_id IN ({p_t})',
              target_ids,
          ).fetchone()[0]
          if detail_count != len(review):
              raise RuntimeError(f'audio_match_details={detail_count} zamiast {len(review)}')

          mapped_count = conn.execute(
              f'SELECT COUNT(*) FROM middle_end WHERE audio_id IN ({p_a})',
              audio_ids,
          ).fetchone()[0]
          if mapped_count != len(audio_ids):
              raise RuntimeError(f'fresh audio_id mapped={mapped_count} zamiast {len(audio_ids)}')

          print(f'OVERWRITE_OK={len(fresh)}')
          print(f'READY_OK={len(ready)}')
          print(f'REVIEW_OK={len(review)}')
          conn.close()
          PY
