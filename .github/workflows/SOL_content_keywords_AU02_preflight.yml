name: SOL content keywords AU02 - insert

on:
  push:
    branches: [sql-audhd-content]
    paths:
      - '.github/workflows/SOL_content_keywords_AU02_preflight.yml'

permissions:
  contents: read

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @libsql/client
      - name: Wstaw 33 przypisania AU02
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { createClient } = require('@libsql/client');
          const stop = m => { throw new Error('STOP AU02 INSERT: ' + m); };
          (async () => {
            const txt = fs.readFileSync('daneDoSql.txt', 'utf8');
            const u = txt.match(/libsql:\/\/[^\s]+/);
            const t = txt.match(/eyJ[a-zA-Z0-9._-]+/);
            if (!u || !t) stop('brak danych polaczenia');
            const db = createClient({url:u[0], authToken:t[0]});

            const marker = await db.execute({sql:'SELECT value FROM content_meta WHERE key=?', args:['content_keywords_data_v1']});
            if (marker.rows.length !== 1 || String(marker.rows[0].value) !== 'done') stop('brak markera danych');

            const q = await db.execute(`SELECT s.section_id,s.section_order,s.anchor FROM content_sections s JOIN content_documents d ON d.document_id=s.document_id WHERE d.collection_id='audhd' AND d.document_code='AU02' ORDER BY s.section_order`);
            const anchors = ['co-dziala-po-poznej-diagnozie','mapa-terenu-piec-rzeczy-ktore-rozstrzygaja','kurs-o-sobie','prowadzacy-z-tego-samego-plemienia','ludzie-w-tej-samej-lodzi','czlowiek-zamiast-listy-numerow','pakiet-na-start','czego-sie-domagac-lista-24-glosow','czego-sie-spodziewac-po-sobie'];
            if (q.rows.length !== anchors.length) stop(`sekcje=${q.rows.length}`);
            q.rows.forEach((r,i)=>{ if(Number(r.section_order)!==i+1 || String(r.anchor)!==anchors[i]) stop(`sekcja ${i+1} niezgodna`); });
            const sid = Object.fromEntries(q.rows.map(r=>[String(r.anchor),Number(r.section_id)]));
            const ids = anchors.map(a=>sid[a]);
            const ph = ids.map(()=>'?').join(',');
            const existing = await db.execute({sql:`SELECT count(*) n FROM content_section_keywords WHERE section_id IN (${ph})`,args:ids});
            if(Number(existing.rows[0].n)!==0) stop(`istniejace przypisania=${existing.rows[0].n}`);

            const plan = [
              ['co-dziala-po-poznej-diagnozie',1,'late_diagnosis'],
              ['co-dziala-po-poznej-diagnozie',2,'post_diagnostic_support'],
              ['co-dziala-po-poznej-diagnozie',3,'post_diagnostic_needs'],
              ['mapa-terenu-piec-rzeczy-ktore-rozstrzygaja',1,'late_diagnosis'],
              ['mapa-terenu-piec-rzeczy-ktore-rozstrzygaja',2,'relationships'],
              ['mapa-terenu-piec-rzeczy-ktore-rozstrzygaja',3,'mental_health'],
              ['mapa-terenu-piec-rzeczy-ktore-rozstrzygaja',4,'social_support'],
              ['mapa-terenu-piec-rzeczy-ktore-rozstrzygaja',5,'post_diagnostic_needs'],
              ['kurs-o-sobie',1,'psychoeducation'],
              ['kurs-o-sobie',2,'self_help'],
              ['kurs-o-sobie',3,'post_diagnostic_support'],
              ['prowadzacy-z-tego-samego-plemienia',1,'neurodivergent_facilitator'],
              ['prowadzacy-z-tego-samego-plemienia',2,'peer_support'],
              ['prowadzacy-z-tego-samego-plemienia',3,'diagnostic_acceptance'],
              ['ludzie-w-tej-samej-lodzi',1,'peer_support'],
              ['ludzie-w-tej-samej-lodzi',2,'peer_community'],
              ['ludzie-w-tej-samej-lodzi',3,'social_support'],
              ['ludzie-w-tej-samej-lodzi',4,'late_diagnosis'],
              ['czlowiek-zamiast-listy-numerow',1,'system_navigation'],
              ['czlowiek-zamiast-listy-numerow',2,'practical_support'],
              ['czlowiek-zamiast-listy-numerow',3,'support_system'],
              ['pakiet-na-start',1,'self_help'],
              ['pakiet-na-start',2,'psychoeducation'],
              ['pakiet-na-start',3,'post_diagnostic_support'],
              ['pakiet-na-start',4,'diagnosis'],
              ['czego-sie-domagac-lista-24-glosow',1,'post_diagnostic_needs'],
              ['czego-sie-domagac-lista-24-glosow',2,'support_standard'],
              ['czego-sie-domagac-lista-24-glosow',3,'post_diagnostic_support'],
              ['czego-sie-domagac-lista-24-glosow',4,'peer_community'],
              ['czego-sie-spodziewac-po-sobie',1,'relief'],
              ['czego-sie-spodziewac-po-sobie',2,'grief'],
              ['czego-sie-spodziewac-po-sobie',3,'camouflaging'],
              ['czego-sie-spodziewac-po-sobie',4,'late_diagnosis']
            ];
            if(plan.length!==33) stop(`plan=${plan.length}`);
            const keys=[...new Set(plan.map(x=>x[2]))];
            const kp=keys.map(()=>'?').join(',');
            const cq=await db.execute({sql:`SELECT concept_id,concept_key FROM content_keyword_concepts WHERE concept_key IN (${kp})`,args:keys});
            if(cq.rows.length!==keys.length) stop(`concept_key=${cq.rows.length}/${keys.length}`);
            const cid=Object.fromEntries(cq.rows.map(r=>[String(r.concept_key),Number(r.concept_id)]));

            const statements=plan.map(([anchor,order,key])=>({sql:'INSERT INTO content_section_keywords(section_id,concept_id,keyword_order) VALUES (?,?,?)',args:[sid[anchor],cid[key],order]}));
            await db.batch(statements,'write');

            const check=await db.execute({sql:`SELECT section_id,keyword_order FROM content_section_keywords WHERE section_id IN (${ph}) ORDER BY section_id,keyword_order`,args:ids});
            if(check.rows.length!==33) stop(`po insercie=${check.rows.length}`);
            const counts=ids.map(id=>check.rows.filter(r=>Number(r.section_id)===id).length);
            const wanted=[3,5,3,3,4,3,4,4,4];
            if(JSON.stringify(counts)!==JSON.stringify(wanted)) stop(`liczby=${counts}`);
            console.log('OK AU02 INSERT: 33 przypisania; sekcje 3/5/3/3/4/3/4/4/4; zakres 1-5 zachowany.');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
