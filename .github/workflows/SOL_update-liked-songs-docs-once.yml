name: SOL update Liked Songs docs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_update-liked-songs-docs-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update inter-project playlist section
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('SOL_DOKUMENTACJA-MIEDZYKATALOGOWA-AKTUALNA.md')
          s=p.read_text(encoding='utf-8')
          old='''Aktualny stan danych po migracjach 2026-09-11:\n\n- 9 playlist;\n- 919 pozycji `playlist_item`;\n- 636 różnych `external_track`;\n- 543 jawne relacje `external_track ↔ utwu_id`;\n- 824 pozycje playlist rozstrzygają się do `utwu_id` przez nową warstwę;\n- 95 pozycji pozostaje bez `utwu_id`;\n- te 95 pozycji reprezentuje 93 różne `external_track`.'''
          new='''Aktualny stan live po pierwszym teście bojowym importera 2026-09-11:\n\n- 10 playlist;\n- 1861 pozycji `playlist_item`;\n- 1033 różne `external_track` używane przez playlisty;\n- 937 jawnych relacji `external_track ↔ utwu_id`.\n\nSnapshot `spotify:liked-songs:2026-09-11` ma 942 pozycje: 937 z mapowaniem do `utwu_id`, 5 bez mapowania, 869 z `lyrics_id` i snapshotem tagów.'''
          if old not in s: raise SystemExit('old counts block not found')
          s=s.replace(old,new,1)
          s=s.replace('Wszystkie 9 playlist obecnie załadowanych do SQL należą do Maćka Tory.', 'Wszystkie 10 playlist obecnie załadowanych do SQL należą do Maćka Tory.',1)
          old2='Nowy importer zgodny z warstwą `external_track` nie został jeszcze przygotowany. Jest to celowo odłożone i nie należy opisywać go jako gotowego elementu systemu.'
          new2='Importer zgodny z warstwą `external_track` istnieje w `piosenki/playlist_importer.py` i został sprawdzony na snapshotcie Liked Songs z 942 pozycjami. Logika mapowania działa bez heurystyk, ale pierwszy duży import ujawnił problem wydajnościowy: wiele sekwencyjnych operacji Turso spowodowało chwilowy timeout workera / 502. Przed regularnymi dużymi importami importer należy zbatchować i skrócić transakcję.'
          if old2 not in s: raise SystemExit('old importer text not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove workflow and commit
        run: |
          git config user.name "maciektora-hue"
          git config user.email "maciek.tora@gmail.com"
          git rm .github/workflows/SOL_update-liked-songs-docs-once.yml
          git add SOL_DOKUMENTACJA-MIEDZYKATALOGOWA-AKTUALNA.md
          git commit -m "Update inter-project docs after Liked Songs import"
          git pull --rebase origin main
          git push
