name: SOL sync playlist schema and docs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_sync-playlist-schema-docs-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize schema.sql with live playlist schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('piosenki/schema.sql')
          text = path.read_text(encoding='utf-8')

          old = '''-- Playlist layer
          CREATE TABLE IF NOT EXISTS playlist (
              playlist_id TEXT PRIMARY KEY,
              service TEXT NOT NULL,
              name TEXT NOT NULL,
              external_playlist_id TEXT,
              external_url TEXT,
              source_file TEXT,
              imported_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
              CHECK (service IN ('spotify', 'youtube_music', 'youtube')),
              UNIQUE (service, external_playlist_id)
          );

          CREATE TABLE IF NOT EXISTS playlist_item (
              playlist_id TEXT NOT NULL
                  REFERENCES playlist(playlist_id)
                  ON UPDATE CASCADE
                  ON DELETE CASCADE,
              position INTEGER NOT NULL,
              utwu_id TEXT
                  REFERENCES middle_end(utwu_id)
                  ON UPDATE CASCADE
                  ON DELETE RESTRICT,
              external_track_id TEXT,
              source_name TEXT,
              source_artist TEXT,
              source_album TEXT,
              PRIMARY KEY (playlist_id, position),
              CHECK (position > 0)
          );

          CREATE INDEX IF NOT EXISTS idx_playlist_item_utwu_id
              ON playlist_item(utwu_id);

          CREATE INDEX IF NOT EXISTS idx_playlist_item_external_track_id
              ON playlist_item(external_track_id);'''

          new = '''-- Playlist layer
          -- Jeden rekord playlist = jeden konkretny eksport / stan playlisty w danym momencie.
          CREATE TABLE IF NOT EXISTS playlist (
              playlist_id TEXT PRIMARY KEY,
              playlist_series_id TEXT,
              service TEXT NOT NULL,
              name TEXT NOT NULL,
              external_playlist_id TEXT,
              external_url TEXT,
              source_file TEXT,
              exported_at TEXT,
              imported_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
              tags TEXT NOT NULL DEFAULT '[]' CHECK (json_valid(tags)),
              CHECK (service IN ('spotify', 'youtube_music', 'youtube'))
          );

          CREATE INDEX IF NOT EXISTS idx_playlist_series_id
              ON playlist(playlist_series_id);

          CREATE INDEX IF NOT EXISTS idx_playlist_external_playlist_id
              ON playlist(service, external_playlist_id);

          CREATE TABLE IF NOT EXISTS playlist_tag_def (
              tag TEXT PRIMARY KEY,
              description TEXT
          );

          CREATE TABLE IF NOT EXISTS playlist_item (
              playlist_id TEXT NOT NULL
                  REFERENCES playlist(playlist_id)
                  ON UPDATE CASCADE
                  ON DELETE CASCADE,
              position INTEGER NOT NULL,
              utwu_id TEXT
                  REFERENCES middle_end(utwu_id)
                  ON UPDATE CASCADE
                  ON DELETE RESTRICT,
              external_track_id TEXT,
              source_name TEXT,
              source_artist TEXT,
              source_album TEXT,
              PRIMARY KEY (playlist_id, position),
              CHECK (position > 0)
          );

          CREATE INDEX IF NOT EXISTS idx_playlist_item_utwu_id
              ON playlist_item(utwu_id);

          CREATE INDEX IF NOT EXISTS idx_playlist_item_external_track_id
              ON playlist_item(external_track_id);'''

          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new in text:
              print('schema.sql already synchronized')
          else:
              raise SystemExit('Expected playlist block not found; refusing blind edit')
          PY

          git config user.name "SOL automation"
          git config user.email "actions@users.noreply.github.com"
          git add piosenki/schema.sql
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize playlist schema with live Turso"
          fi

      - name: Update current Markdown project documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = {
              'SOL_DOKUMENTACJA-MIEDZYKATALOGOWA-AKTUALNA.md': '''

          <!-- PLAYLISTY-2026-09-11 -->
          ---

          # Aktualizacja 2026-09-11 — warstwa playlist

          W domenie piosenek działa obecnie także warstwa playlist:

          - `playlist` — jeden rekord oznacza jeden konkretny eksport / stan playlisty w określonym momencie;
          - `playlist_item` — utwory należące do tego eksportu wraz z kolejnością;
          - `playlist_tag_def` — prosty słownik opcjonalnych tagów opisujących playlisty.

          `playlist_series_id` może łączyć kolejne eksporty tej samej logicznej playlisty, także gdy zmieni się jej nazwa lub zawartość. Nie ma osobnej tabeli snapshotów.

          `exported_at` oznacza moment eksportu ze Spotify / YouTube do pliku źródłowego. `imported_at` oznacza moment zaimportowania tego konkretnego eksportu do SQL.

          Opcjonalne informacje opisowe, np. właściciel, sposób powstania, przeznaczenie czy program eksportujący, mogą być przechowywane w `playlist.tags` jako lista JSON. Tagi playlist są niezależne od systemu tagów `lyrics`.

          Aktualny stan po migracji: 9 rekordów `playlist` i 919 rekordów `playlist_item`. SQL jest źródłem prawdy; migracje w `piosenki/migrations/` są historią zmian, nie źródłem do ponownego automatycznego importu.
          ''',
              'SOL_DOKUMENTACJA-SLOWA-LYRICS-TAGI-AKTUALNA.md': '''

          <!-- PLAYLISTY-2026-09-11 -->
          ---

          ## Aktualizacja 2026-09-11 — playlisty a tagi lyrics

          Tagi playlist są osobnym systemem od tagów tekstu. Nie należy ich mieszać z `tag_catalog`, `tag_snapshots`, osiami, rodzinami ani walencją lyrics.

          Warstwa playlist używa:

          - `playlist.tags` — opcjonalnej listy JSON, np. `owner:maciek`, `origin:platform_generated`, `purpose:driving`;
          - `playlist_tag_def` — prostego słownika definicji używanych tagów playlistowych.

          Jeden rekord `playlist` oznacza jeden konkretny eksport playlisty. Kolejne eksporty tej samej logicznej playlisty mogą być spięte przez `playlist_series_id`.
          ''',
              'SOL_DOKUMENTACJA-KATALOGI-AKTUALNA.md': '''

          <!-- PLAYLISTY-2026-09-11 -->
          ---

          # Aktualizacja 2026-09-11 — playlisty w projekcie `piosenki`

          Aktualna warstwa playlist jest zdefiniowana w `piosenki/schema.sql` i składa się z `playlist`, `playlist_item` oraz `playlist_tag_def`.

          Historia migracji znajduje się w:

          - `piosenki/migrations/2026-09-10-playlists-spotify-bestof.sql`;
          - `piosenki/migrations/2026-09-11-playlist-metadata.sql`.

          Robocze eksporty playlist pozostają w `dane-robocze/`, m.in. `dane-robocze/playlistyspotifybestof/`. Plik audytowy nierozwiązanych pozycji znajduje się w `dane-robocze/csv-tsv/SOL_playlisty-brak-utwu-id-95.csv`.

          Po imporcie bieżący stan playlist należy odczytywać z Turso/SQL, a nie rekonstruować z XLSX/CSV.
          ''',
              'SOL_INSTRUKCJA-ARCHITEKTURA-SQL-GITHUB-RENDER-TURSO.md': '''

          <!-- PLAYLISTY-2026-09-11 -->
          ---

          ## 11. Warstwa playlist — zasady operacyjne

          Aktualny model playlist ma trzy elementy: `playlist`, `playlist_item` i `playlist_tag_def`.

          Jeden rekord `playlist` oznacza jeden konkretny eksport / stan playlisty. Kolejne eksporty tej samej logicznej playlisty mogą mieć wspólne `playlist_series_id`.

          Rozróżniaj dwa czasy:

          - `exported_at` — kiedy playlistę wyeksportowano ze Spotify / YouTube do pliku;
          - `imported_at` — kiedy ten eksport zaimportowano do SQL.

          Opcjonalne metadane opisowe trzymamy w `playlist.tags`; nie tworzymy nowej kolumny dla każdej przyszłej cechy. `service` i identyfikatory techniczne pozostają kolumnami.

          Tagi playlist nie są tagami lyrics i nie korzystają z `tag_catalog` ani ontologii tagów tekstu.

          `piosenki/schema.sql` ma odzwierciedlać aktualny stan schematu live. Pliki w `piosenki/migrations/` dokumentują drogę dojścia do tego stanu; nie należy uruchamiać dawnych migracji ponownie bez jawnej potrzeby.
          ''',
          }

          for filename, section in updates.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '<!-- PLAYLISTY-2026-09-11 -->' not in text:
                  path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
              else:
                  print(f'{filename}: playlist section already present')
          PY

          git add SOL_DOKUMENTACJA-MIEDZYKATALOGOWA-AKTUALNA.md \
                  SOL_DOKUMENTACJA-SLOWA-LYRICS-TAGI-AKTUALNA.md \
                  SOL_DOKUMENTACJA-KATALOGI-AKTUALNA.md \
                  SOL_INSTRUKCJA-ARCHITEKTURA-SQL-GITHUB-RENDER-TURSO.md
          if ! git diff --cached --quiet; then
            git commit -m "Update playlist project documentation"
          fi

      - name: Remove this one-time workflow and push
        shell: bash
        run: |
          git rm .github/workflows/SOL_sync-playlist-schema-docs-once.yml
          git commit -m "Remove one-time playlist schema docs sync"
          git pull --rebase origin main
          git push origin HEAD:main
