name: SOL content keywords - import danych

on:
  push:
    branches:
      - sql-audhd-content
    paths:
      - '.github/workflows/SOL_content_keywords_data_import.yml'

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zainstaluj klienta libSQL
        run: npm install --no-save @libsql/client

      - name: Importuj 544 concepty i 1088 terminow PL/EN
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const { createClient } = require('@libsql/client');

          const DATA_GZIP_B64 = '';

          function stop(msg) {
            throw new Error('STOP KEYWORDS IMPORT: ' + msg);
          }

          function hashRows(rows) {
            const normalized = rows.map(row => {
              const out = {};
              for (const [k, v] of Object.entries(row)) out[k] = v == null ? null : String(v);
              return out;
            });
            return crypto.createHash('sha256').update(JSON.stringify(normalized)).digest('hex');
          }

          function norm(s) {
            return String(s).trim().replace(/\s+/g, ' ').toLocaleLowerCase('pl-PL');
          }

          function parseData() {
            const text = zlib.gunzipSync(Buffer.from(DATA_GZIP_B64, 'base64'))
              .toString('utf8')
              .replace(/^\uFEFF/, '');
            const lines = text.replace(/\r/g, '').trimEnd().split('\n');
            const header = lines.shift();
            if (header !== 'concept_key\tkeyword_pl\tkeyword_pl_norm\tkeyword_en\tkeyword_en_norm') {
              stop('nieprawidlowy naglowek danych');
            }
            const rows = lines.map((line, idx) => {
              const p = line.split('\t');
              if (p.length !== 5) stop(`wiersz ${idx + 2}: nie ma 5 kolumn`);
              return {
                concept_key: p[0], keyword_pl: p[1], keyword_pl_norm: p[2],
                keyword_en: p[3], keyword_en_norm: p[4]
              };
            });
            if (rows.length !== 544) stop(`dane maja ${rows.length} rekordow zamiast 544`);
            const keys = new Set();
            for (const [i, r] of rows.entries()) {
              for (const [k, v] of Object.entries(r)) if (!v) stop(`wiersz ${i + 2}: puste ${k}`);
              if (!/^[a-z0-9]+(?:_[a-z0-9]+)*$/.test(r.concept_key)) stop(`zly concept_key: ${r.concept_key}`);
              if (keys.has(r.concept_key)) stop(`duplikat concept_key: ${r.concept_key}`);
              keys.add(r.concept_key);
              if (norm(r.keyword_pl) !== r.keyword_pl_norm) stop(`zly PL norm: ${r.concept_key}`);
              if (norm(r.keyword_en) !== r.keyword_en_norm) stop(`zly EN norm: ${r.concept_key}`);
            }
            return rows;
          }

          async function snapshot(client) {
            const sections = await client.execute(`
              SELECT section_id, document_id, parent_section_id, section_kind,
                     heading_level, depth, section_order, structure_order,
                     section_title, section_title_en, anchor,
                     description, description_en, keywords_pl, keywords_en,
                     content_html
              FROM content_sections
              ORDER BY section_id
            `);
            const documents = await client.execute(`
              SELECT document_id, collection_id, document_code, source_filename,
                     document_title, canonical_url, source_url, sort_order
              FROM content_documents
              ORDER BY document_id
            `);
            return {
              sectionsCount: sections.rows.length,
              sectionsHash: hashRows(sections.rows),
              documentsCount: documents.rows.length,
              documentsHash: hashRows(documents.rows)
            };
          }

          async function validateCollections(client) {
            const audhd = await client.execute(`
              SELECT count(DISTINCT d.document_id) AS documents,
                     sum(CASE WHEN s.section_kind='heading' THEN 1 ELSE 0 END) AS headings,
                     sum(CASE WHEN s.section_kind='heading' AND s.description IS NOT NULL AND trim(s.description)<>'' THEN 1 ELSE 0 END) AS descriptions
              FROM content_sections s
              JOIN content_documents d ON d.document_id=s.document_id
              WHERE d.collection_id='audhd'
            `);
            const a = audhd.rows[0];
            if (Number(a.documents)!==18 || Number(a.headings)!==338 || Number(a.descriptions)!==338) {
              stop(`AuDHD niezgodne: ${a.documents}/${a.headings}/${a.descriptions}`);
            }

            const rosja = await client.execute(`
              SELECT count(DISTINCT d.document_id) AS documents,
                     sum(CASE WHEN s.section_kind='heading' THEN 1 ELSE 0 END) AS headings,
                     sum(CASE WHEN s.section_kind='volume' THEN 1 ELSE 0 END) AS volumes,
                     sum(CASE WHEN s.section_kind='heading' AND s.description IS NOT NULL AND trim(s.description)<>'' THEN 1 ELSE 0 END) AS descriptions
              FROM content_sections s
              JOIN content_documents d ON d.document_id=s.document_id
              WHERE d.collection_id='rosja'
            `);
            const r = rosja.rows[0];
            if (Number(r.documents)!==16 || Number(r.headings)!==620 || Number(r.volumes)!==9 || Number(r.descriptions)!==620) {
              stop(`ROSJA niezgodna: ${r.documents}/${r.headings}/${r.volumes}/${r.descriptions}`);
            }
          }

          async function main() {
            const rows = parseData();
            const creds = fs.readFileSync('daneDoSql.txt', 'utf8');
            const urlMatch = creds.match(/libsql:\/\/[^\s]+/);
            const tokenMatch = creds.match(/eyJ[a-zA-Z0-9._-]+/);
            if (!urlMatch || !tokenMatch) stop('brak URL lub tokena');
            const client = createClient({ url: urlMatch[0], authToken: tokenMatch[0] });

            const marker = await client.execute({
              sql: 'SELECT value FROM content_meta WHERE key = ?',
              args: ['content_keywords_schema_v1']
            });
            if (marker.rows.length !== 1 || String(marker.rows[0].value) !== 'done') stop('brak prawidlowego markera schematu');

            for (const t of ['content_keyword_concepts','content_keyword_terms','content_section_keywords']) {
              const q = await client.execute(`SELECT count(*) AS n FROM ${t}`);
              if (Number(q.rows[0].n) !== 0) stop(`${t} nie jest pusta przed importem`);
            }

            await validateCollections(client);
            const before = await snapshot(client);

            const statements = [];
            rows.forEach((r, i) => {
              const conceptId = i + 1;
              statements.push({
                sql: 'INSERT INTO content_keyword_concepts(concept_id, concept_key) VALUES (?, ?)',
                args: [conceptId, r.concept_key]
              });
              statements.push({
                sql: 'INSERT INTO content_keyword_terms(concept_id, lang, keyword, keyword_norm, is_preferred) VALUES (?, ?, ?, ?, 1)',
                args: [conceptId, 'pl', r.keyword_pl, r.keyword_pl_norm]
              });
              statements.push({
                sql: 'INSERT INTO content_keyword_terms(concept_id, lang, keyword, keyword_norm, is_preferred) VALUES (?, ?, ?, ?, 1)',
                args: [conceptId, 'en', r.keyword_en, r.keyword_en_norm]
              });
            });

            if (statements.length !== 1632) stop(`zla liczba instrukcji: ${statements.length}`);
            await client.batch(statements, 'write');

            const counts = {};
            for (const t of ['content_keyword_concepts','content_keyword_terms','content_section_keywords']) {
              const q = await client.execute(`SELECT count(*) AS n FROM ${t}`);
              counts[t] = Number(q.rows[0].n);
            }
            if (counts.content_keyword_concepts !== 544) stop(`po imporcie concepts=${counts.content_keyword_concepts}`);
            if (counts.content_keyword_terms !== 1088) stop(`po imporcie terms=${counts.content_keyword_terms}`);
            if (counts.content_section_keywords !== 0) stop(`po imporcie section_links=${counts.content_section_keywords}`);

            const langs = await client.execute('SELECT lang, count(*) AS n FROM content_keyword_terms GROUP BY lang ORDER BY lang');
            const lm = Object.fromEntries(langs.rows.map(r => [String(r.lang), Number(r.n)]));
            if (lm.pl !== 544 || lm.en !== 544) stop(`jezyki niezgodne: PL=${lm.pl}, EN=${lm.en}`);

            const aliases = await client.execute('SELECT count(*) AS n FROM content_keyword_terms WHERE is_preferred=0');
            if (Number(aliases.rows[0].n) !== 0) stop('pojawiły sie aliasy');

            const badPairs = await client.execute(`
              SELECT count(*) AS n FROM (
                SELECT concept_id
                FROM content_keyword_terms
                GROUP BY concept_id
                HAVING count(*)<>2
                   OR sum(CASE WHEN lang='pl' THEN 1 ELSE 0 END)<>1
                   OR sum(CASE WHEN lang='en' THEN 1 ELSE 0 END)<>1
                   OR sum(CASE WHEN is_preferred=1 THEN 1 ELSE 0 END)<>2
              )
            `);
            if (Number(badPairs.rows[0].n) !== 0) stop(`niepelne pary conceptow: ${badPairs.rows[0].n}`);

            await validateCollections(client);
            const after = await snapshot(client);
            if (before.sectionsCount !== after.sectionsCount || before.sectionsHash !== after.sectionsHash) {
              stop('content_sections zmienione podczas importu');
            }
            if (before.documentsCount !== after.documentsCount || before.documentsHash !== after.documentsHash) {
              stop('content_documents zmienione podczas importu');
            }

            console.log('OK KEYWORDS DATA IMPORT: concepts=544; terms=1088 (PL=544, EN=544); aliases=0; section_links=0; AuDHD 18/338/338; ROSJA 16/620/9/620; content_sections i content_documents IDENTYCZNE.');
          }

          main().catch(err => {
            console.error(err.message);
            process.exit(1);
          });
          NODE
