name: SOL parse audio 0201-0250 once

on:
  push:
    paths:
      - '.github/workflows/sol-parse-audio-0201-0250-once.yml'

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse batch 0201-0250
        run: |
          python -u piosenki/SOL_parse-audio-filenames-v03.py \
            --start 201 \
            --end 250 \
            --overrides piosenki/audio_filename_overrides_0201_0250.tsv \
            --output piosenki/audio_filename_parsed_0201_0250.tsv
      - name: Commit parsed TSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piosenki/audio_filename_parsed_0201_0250.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Refine parsed audio filenames 0201-0250"
          git push
