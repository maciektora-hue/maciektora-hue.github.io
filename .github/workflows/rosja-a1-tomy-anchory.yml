name: ROSJA - A1 anchory tomow

on:
  workflow_dispatch:
  push:
    paths:
      - 'rosja/SOL_dodaj-anchory-tomow-a1.py'
      - '.github/workflows/rosja-a1-tomy-anchory.yml'

permissions:
  contents: write

jobs:
  tomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dodaj reczne anchory tomow A1
        run: python rosja/SOL_dodaj-anchory-tomow-a1.py

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosja/a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31-anchory.html rosja/SOL_status-techniczny.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "ROSJA A1: slowne anchory 9 tomow i notatka strukturalna"
          git push origin main
