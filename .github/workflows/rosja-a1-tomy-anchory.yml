name: ROSJA A1 - slowniki anchorow tomow

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rosja-a1-tomy-anchory.yml'

permissions:
  contents: write

jobs:
  tomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronizuj main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Dodaj 9 recznie wskazanych anchorow tomow
        shell: python
        run: |
          from pathlib import Path

          p = Path('rosja/a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31-anchory.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('<div class="volume-header"><div class="volume-number c-red">Tom I</div><div class="volume-title">Front, OPL i arsenał</div></div>',
               '<div class="volume-header"><div class="volume-number c-red">Tom I</div><div class="volume-title" id="front-opl-arsenal">Front, OPL i arsenał</div></div>'),
              ('<div class="volume-header"><div class="volume-number c-red">Tom II</div><div class="volume-title">Gospodarka, finanse i eksport</div></div>',
               '<div class="volume-header"><div class="volume-number c-red">Tom II</div><div class="volume-title" id="gospodarka-finanse-eksport">Gospodarka, finanse i eksport</div></div>'),
              ('<div class="volume-header"><div class="volume-number c-red">Tom III</div><div class="volume-title">Infrastruktura i społeczeństwo</div></div>',
               '<div class="volume-header"><div class="volume-number c-red">Tom III</div><div class="volume-title" id="infrastruktura-spoleczenstwo">Infrastruktura i społeczeństwo</div></div>'),
              ('<div class="volume-header"><div class="volume-number c-red">Tom IV</div><div class="volume-title">Synteza i prognoza</div></div>',
               '<div class="volume-header"><div class="volume-number c-red">Tom IV</div><div class="volume-title" id="synteza-prognoza">Synteza i prognoza</div></div>'),
              ('<div class="volume-header"><div class="volume-number c-purple">Tom V</div><div class="volume-title">Projekt życia mu nie wyszedł</div></div>',
               '<div class="volume-header"><div class="volume-number c-purple">Tom V</div><div class="volume-title" id="projekt-zycia-mu-nie-wyszedl">Projekt życia mu nie wyszedł</div></div>'),
              ('<div class="volume-header"><div class="volume-number c-orange">Tom VI</div><div class="volume-title">Od Kaukazu po Zatokę</div></div>',
               '<div class="volume-header"><div class="volume-number c-orange">Tom VI</div><div class="volume-title" id="od-kaukazu-po-zatoke">Od Kaukazu po Zatokę</div></div>'),
              ('<div class="volume-header"><div class="volume-number c-yellow">Tom VII</div><div class="volume-title">Od Ormuzu do panelu słonecznego</div></div>',
               '<div class="volume-header"><div class="volume-number c-yellow">Tom VII</div><div class="volume-title" id="od-ormuzu-do-panelu-slonecznego">Od Ormuzu do panelu słonecznego</div></div>'),
              ('<div class="volume-header"><div class="volume-number c-blue">Tom VIII</div><div class="volume-title">Disinfolklore, Dark Legitimacy i etyka</div></div>',
               '<div class="volume-header"><div class="volume-number c-blue">Tom VIII</div><div class="volume-title" id="disinfolklore-dark-legitimacy-etyka">Disinfolklore, Dark Legitimacy i etyka</div></div>'),
              ('<div class="volume-header"><div class="volume-number c-green">Tom IX</div><div class="volume-title">Korekta i przesłuchanie</div></div>',
               '<div class="volume-header"><div class="volume-number c-green">Tom IX</div><div class="volume-title" id="korekta-przesluchanie">Korekta i przesłuchanie</div></div>'),
          ]

          new_ids = [
              'front-opl-arsenal', 'gospodarka-finanse-eksport', 'infrastruktura-spoleczenstwo',
              'synteza-prognoza', 'projekt-zycia-mu-nie-wyszedl', 'od-kaukazu-po-zatoke',
              'od-ormuzu-do-panelu-slonecznego', 'disinfolklore-dark-legitimacy-etyka',
              'korekta-przesluchanie'
          ]

          for ident in new_ids:
              if f'id="{ident}"' in s:
                  raise SystemExit(f'STOP: id juz istnieje przed zmiana: {ident}')

          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'STOP: oczekiwany fragment wystepuje {s.count(old)} razy: {old[:100]}')
              s = s.replace(old, new, 1)

          for ident in new_ids:
              if s.count(f'id="{ident}"') != 1:
                  raise SystemExit(f'STOP: po zmianie id nie jest unikalne: {ident}')

          for i in range(1, 10):
              if s.count(f'id="tom{i}"') != 1:
                  raise SystemExit(f'STOP: stary id tom{i} nie zachowany dokladnie raz')

          p.write_text(s, encoding='utf-8')
          print('OK: 9 tomow, 9 nowych slowych anchorow; tom1..tom9 zachowane.')

      - name: Dopisz notatke do statusu technicznego
        shell: python
        run: |
          from pathlib import Path
          p = Path('rosja/SOL_status-techniczny.txt')
          s = p.read_text(encoding='utf-8')
          marker = '\nA1 — STRUKTURA TOMÓW I HIERARCHIA H\n'
          note = '''
A1 — STRUKTURA TOMÓW I HIERARCHIA H
- A1 ma 9 TOMÓW jako osobną warstwę strukturalną ponad rozdziałami.
- TOMY nie są nagłówkami H1–H6: każdy tom jest <section class="volume" id="tomN">, a jego nazwa jest w <div class="volume-title">.
- Zachowano techniczne anchory tom1–tom9 i dodano dodatkowe ręcznie nazwane anchory słowne do nazw tomów.
- Skoki w hierarchii H wykazane przez audyt są CELOWE i nie są błędem do naprawy.
'''
          if marker not in s:
              s = s.rstrip() + '\n' + note
              p.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('STOP: sekcja statusu A1 juz istnieje; nie duplikuje jej')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosja/a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31-anchory.html rosja/SOL_status-techniczny.txt
          git diff --cached --check
          git commit -m "ROSJA A1: słowne anchory 9 tomów i notatka strukturalna"
          git push origin HEAD:main
