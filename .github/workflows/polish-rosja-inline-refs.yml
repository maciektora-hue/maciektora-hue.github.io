name: Uladnij pozostale kody A-D w indeksie Rosji

on:
  push:
    paths:
      - '.github/workflows/polish-rosja-inline-refs.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zamien pozostale kody na ladne linki
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('rosja/index.html')
          s = p.read_text(encoding='utf-8')

          links = {
              'A1': 'a1_POCZATEK_ZAMROZONE_kolumbryna-v3_5-2026-03-31.html',
              'A2': 'a2_ZAMROZONE-maj-2026-gradually-stalo-sie-suddenly-v25_00-2026-06-25.html',
              'A3': 'a3_ZAMROZONE-lista-celow-v19_00-2026-06-25.html',
              'A4': 'a4_lipiec-2026-przejscie-na-hurt-v20_11-2026-08-01.html',
              'A5': 'a5_ZAMROZONE-audyt-2rewizje-v03_00-2026-06-23.html',
              'A6': 'a6_ZAMROZONE-zapas-kontra-strumien-v02_00-2026-07-03.html',
              'A7': 'a7_ZAMROZONE-jak-koncza-sie-panstwa-v02_00-2026-06-28.html',
              'D1': 'd1-zamrozone-narzedzie-dark-legitimacy-horbyk-v01_00-2026-03-25.html',
              'D2': 'd2-zamrozone-narzedzie-disinfolklore-kompilacja-v01_00-2026-03-25.html',
              'D3': 'd3-zamrozone-narzedzie-disinfolklore-swot-advocatus-v01_00-2026-03-25.html',
              'D4': 'd4-zamrozone-rosyjskie-samobojstwa-taksonomia-v08_01-2026-06-13.html',
              'D5': 'd5-zamrozone-putin-cornered-animal-v03_00-2026-03-24.html',
              'D6': 'd6-zamrozone-jalta-3-analiza-strategiczna-v01_00-2026-03-08.html',
              'D7': 'd7-zamrozone-jalta-3-apendyks-v01_00-2026-03-08.html',
          }

          def ref(code):
              href = links[code]
              return f'<a class="inline-ref" href="{href}" title="Otworz {code}">{code}</a>'

          def expand_range(m):
              prefix = m.group(1)
              a = int(m.group(2))
              b = int(m.group(3))
              step = 1 if b >= a else -1
              codes = [f'{prefix}{n}' for n in range(a, b + step, step)]
              if not all(c in links for c in codes):
                  return m.group(0)
              return '<span class="ref-range">' + '<span class="ref-dot">·</span>'.join(ref(c) for c in codes) + '</span>'

          parts = re.split(r'(<[^>]+>)', s)
          inside_a = inside_style = inside_script = 0

          for i, part in enumerate(parts):
              if not part:
                  continue
              if part.startswith('<'):
                  low = part.lower()
                  if re.match(r'<a\b', low):
                      inside_a += 1
                  elif re.match(r'</a\s*>', low):
                      inside_a = max(0, inside_a - 1)
                  elif re.match(r'<style\b', low):
                      inside_style += 1
                  elif re.match(r'</style\s*>', low):
                      inside_style = max(0, inside_style - 1)
                  elif re.match(r'<script\b', low):
                      inside_script += 1
                  elif re.match(r'</script\s*>', low):
                      inside_script = max(0, inside_script - 1)
                  continue

              if inside_a or inside_style or inside_script:
                  continue

              part = re.sub(r'\b([AD])(\d+)[–-](?:[AD])?(\d+)\b', expand_range, part)

              def repl(m):
                  code = m.group(0)
                  return ref(code) if code in links else code

              part = re.sub(r'(?<![A-Z0-9])(?:A[1-7]|D[1-7])(?!\d)', repl, part)
              parts[i] = part

          s2 = ''.join(parts)

          css = '''

    .inline-ref {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.05em;
      margin: 0 .08em;
      padding: .08em .34em;
      border: 1px solid var(--line);
      color: var(--gold-hot);
      background: rgba(226, 188, 88, .055);
      font-family: var(--mono);
      font-size: .82em;
      font-weight: 850;
      line-height: 1.35;
      text-decoration: none;
      vertical-align: .06em;
      transition: color .15s ease, background .15s ease, border-color .15s ease, transform .15s ease;
    }

    .inline-ref:hover,
    .inline-ref:focus-visible {
      border-color: var(--gold);
      color: var(--ink);
      background: var(--gold);
      transform: translateY(-1px);
    }

    .doc-code .inline-ref {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      letter-spacing: inherit;
      vertical-align: baseline;
    }

    .doc-code .inline-ref:hover,
    .doc-code .inline-ref:focus-visible {
      color: var(--paper);
      background: transparent;
      transform: none;
    }

    .ref-range {
      display: inline-flex;
      gap: .16em;
      align-items: center;
      white-space: nowrap;
    }

    .ref-dot {
      color: var(--gold-dim);
      font-size: .72em;
    }
'''

          if '.inline-ref {' not in s2:
              marker = '    @media (max-width:'
              pos = s2.find(marker)
              if pos == -1:
                  raise SystemExit('Nie znaleziono miejsca na CSS')
              s2 = s2[:pos] + css + '\n' + s2[pos:]

          if s2 == s:
              raise SystemExit('Brak zmian')

          p.write_text(s2, encoding='utf-8')
          PY

      - name: Zapisz poprawki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosja/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Uladnij pozostale odwolania A-D w indeksie Rosji"
          git push
