name: Build standalone CV v07_13

on:
  push:
    paths:
      - '.github/workflows/cv-v0713-standalone.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v07_13 from v07_12
        shell: python
        run: |
          from pathlib import Path

          src = Path('cv/CLAUDE_Maciej-Tora-AI-CV-v07_12-2026-09-07.html')
          dst = Path('cv/CLAUDE_Maciej-Tora-AI-CV-v07_13-2026-09-09.html')

          text = src.read_text(encoding='utf-8')

          css = '''

    .professional-skills-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 46px;
      align-items: start;
    }
    .professional-skills-grid h3 {
      margin-top: 4px;
      margin-bottom: 7px;
    }
    .professional-skills-grid .b {
      margin: 6px 0;
    }
    @media (max-width: 640px) {
      .professional-skills-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
'''
          assert '</style>' in text
          text = text.replace('</style>', css + '\n</style>', 1)

          section = '''
<section aria-labelledby="professional-skills">
      <h2 id="professional-skills">PROFESSIONAL SKILLS</h2>
      <div class="professional-skills-grid">
        <div>
          <h3 id="soft-skills">SOFT SKILLS</h3>
          <p class="b">Learning agility</p>
          <p class="b">Ownership &amp; accountability</p>
          <p class="b">Cross-functional collaboration</p>
          <p class="b">Decision-making under uncertainty</p>
        </div>
        <div>
          <h3 id="hard-skills">HARD SKILLS</h3>
          <p class="b">Process optimisation</p>
          <p class="b">Quantitative modelling</p>
          <p class="b">Project management</p>
          <p class="b">Financial forecasting</p>
        </div>
      </div>
    </section>
'''
          marker = '<section>\n      <h2 id="core-ai-skills">CORE AI SKILLS</h2>'
          assert marker in text
          text = text.replace(marker, section + marker, 1)

          text = text.replace(
              '<!-- Version 07.12 · 2026-09-07 -->',
              '<!-- Version 07.13 · 2026-09-09 -->',
              1,
          )
          text = text.replace(
              '<link rel="canonical" href="https://maciektora-hue.github.io/cv/cv/">',
              '<link rel="canonical" href="https://maciektora-hue.github.io/cv/CLAUDE_Maciej-Tora-AI-CV-v07_13-2026-09-09.html">',
              1,
          )

          assert text.count('id="professional-skills"') == 1
          assert text.count('id="soft-skills"') == 1
          assert text.count('id="hard-skills"') == 1
          assert text.index('id="professional-skills"') < text.index('id="core-ai-skills"')
          assert 'fetch(' not in text
          assert 'DOMParser' not in text
          assert text.count('<div') == text.count('</div>')
          assert text.count('<section') == text.count('</section>')
          assert text.count('<main') == text.count('</main>')
          assert text.count('<body') == text.count('</body>')
          assert text.count('<html') == text.count('</html>')

          dst.write_text(text, encoding='utf-8')
          print(f'Wrote {dst} ({dst.stat().st_size} bytes)')

      - name: Commit standalone CV and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/CLAUDE_Maciej-Tora-AI-CV-v07_13-2026-09-09.html
          git rm .github/workflows/cv-v0713-standalone.yml
          git commit -m "Make CV v07_13 standalone"
          git push
