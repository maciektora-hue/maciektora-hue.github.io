name: SOL build playlist migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_build-playlist-migration.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install openpyxl
        run: pip install -q openpyxl
      - name: Build playlist schema and migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          import re

          root = Path('dane-robocze/playlistyspotifybestof')
          files = sorted(root.glob('*.xlsx'))
          if not files:
              raise SystemExit('No XLSX files found')

          ddl = r'''
          -- Playlist layer
          CREATE TABLE IF NOT EXISTS playlist (
              playlist_id TEXT PRIMARY KEY,
              service TEXT NOT NULL,
              name TEXT NOT NULL,
              external_playlist_id TEXT,
              external_url TEXT,
              source_file TEXT,
              imported_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
              CHECK (service IN ('spotify', 'youtube_music', 'youtube')),
              UNIQUE (service, external_playlist_id)
          );

          CREATE TABLE IF NOT EXISTS playlist_item (
              playlist_id TEXT NOT NULL
                  REFERENCES playlist(playlist_id)
                  ON UPDATE CASCADE
                  ON DELETE CASCADE,
              position INTEGER NOT NULL,
              utwu_id TEXT
                  REFERENCES middle_end(utwu_id)
                  ON UPDATE CASCADE
                  ON DELETE RESTRICT,
              external_track_id TEXT,
              source_name TEXT,
              source_artist TEXT,
              source_album TEXT,
              PRIMARY KEY (playlist_id, position),
              CHECK (position > 0)
          );

          CREATE INDEX IF NOT EXISTS idx_playlist_item_utwu_id
              ON playlist_item(utwu_id);

          CREATE INDEX IF NOT EXISTS idx_playlist_item_external_track_id
              ON playlist_item(external_track_id);
          '''.strip()

          schema_path = Path('piosenki/schema.sql')
          schema = schema_path.read_text(encoding='utf-8')
          if 'CREATE TABLE IF NOT EXISTS playlist (' not in schema:
              marker = '\nCOMMIT;'
              if marker not in schema:
                  raise SystemExit('schema.sql has no COMMIT marker')
              schema = schema.replace(marker, '\n\n' + ddl + '\n' + marker, 1)
              schema_path.write_text(schema, encoding='utf-8')

          def q(v):
              if v is None:
                  return 'NULL'
              return "'" + str(v).replace("'", "''") + "'"

          def playlist_meta(path):
              stem = path.stem
              low = stem.lower()
              if low == 'alltimebestspotify':
                  return 'spotify:alltimebest', stem
              m = re.fullmatch(r'bestof(\d{4})', low)
              if m:
                  return f"spotify:bestof:{m.group(1)}", stem
              safe = re.sub(r'[^a-z0-9]+', '-', low).strip('-')
              return f'spotify:{safe}', stem

          out = []
          out.append('-- Generated from dane-robocze/playlistyspotifybestof/*.xlsx')
          out.append('-- external_playlist_id / external_url intentionally NULL until links are mapped explicitly.')
          out.append('PRAGMA foreign_keys = ON;')
          out.append('BEGIN TRANSACTION;')
          out.append(ddl)

          total = 0
          for path in files:
              pid, name = playlist_meta(path)
              out.append('')
              out.append(f'-- {path.name}')
              out.append(
                  'INSERT INTO playlist '
                  '(playlist_id, service, name, external_playlist_id, external_url, source_file) VALUES '
                  f'({q(pid)}, {q("spotify")}, {q(name)}, NULL, NULL, {q(path.name)}) '
                  'ON CONFLICT(playlist_id) DO UPDATE SET '
                  'service=excluded.service, name=excluded.name, source_file=excluded.source_file;'
              )
              wb = load_workbook(path, read_only=True, data_only=True)
              ws = wb.active
              rows = ws.iter_rows(values_only=True)
              header = next(rows)
              expected = ('id', 'name', 'artist', 'album')
              if tuple(str(x) if x is not None else None for x in header[:4]) != expected:
                  raise SystemExit(f'{path.name}: unexpected header {header}')
              for pos, row in enumerate(rows, start=1):
                  track_id, title, artist, album = (list(row[:4]) + [None]*4)[:4]
                  if not any(v is not None for v in (track_id, title, artist, album)):
                      continue
                  total += 1
                  out.append(
                      'INSERT INTO playlist_item '
                      '(playlist_id, position, utwu_id, external_track_id, source_name, source_artist, source_album) VALUES '
                      f'({q(pid)}, {pos}, NULL, {q(track_id)}, {q(title)}, {q(artist)}, {q(album)}) '
                      'ON CONFLICT(playlist_id, position) DO UPDATE SET '
                      'external_track_id=excluded.external_track_id, source_name=excluded.source_name, '
                      'source_artist=excluded.source_artist, source_album=excluded.source_album;'
                  )

          out.append('')
          out.append('-- Map only unambiguous Spotify IDs to canonical utwu_id.')
          out.append('''
          UPDATE playlist_item AS p
          SET utwu_id = (
              SELECT m.utwu_id
              FROM middle_end AS m
              WHERE m.spotify_id = p.external_track_id
          )
          WHERE p.external_track_id IS NOT NULL
            AND (
                SELECT COUNT(*)
                FROM middle_end AS m
                WHERE m.spotify_id = p.external_track_id
            ) = 1;
          '''.strip())
          out.append('COMMIT;')
          out.append('')
          out.append('-- Audit after import:')
          out.append('-- SELECT COUNT(*) AS total_items FROM playlist_item;')
          out.append('-- SELECT COUNT(*) AS mapped_items FROM playlist_item WHERE utwu_id IS NOT NULL;')
          out.append('-- SELECT COUNT(*) AS unmapped_items FROM playlist_item WHERE utwu_id IS NULL;')

          mig = Path('piosenki/migrations/2026-09-10-playlists-spotify-bestof.sql')
          mig.parent.mkdir(parents=True, exist_ok=True)
          mig.write_text('\n'.join(out) + '\n', encoding='utf-8')

          report = Path('dane-robocze/playlistyspotifybestof/IMPORT_INFO.txt')
          report.write_text(
              f'files={len(files)}\nitems={total}\nschema=playlist + playlist_item\n'
              'mapping=spotify_id -> utwu_id only when exactly one middle_end row matches\n',
              encoding='utf-8'
          )
          print(f'FILES={len(files)} ITEMS={total}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add piosenki/schema.sql piosenki/migrations/2026-09-10-playlists-spotify-bestof.sql dane-robocze/playlistyspotifybestof/IMPORT_INFO.txt
          git commit -m 'Add playlist schema and Spotify Best Of migration'
          git push
