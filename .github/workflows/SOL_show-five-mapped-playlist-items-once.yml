name: SOL show five mapped playlist items once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SOL_show-five-mapped-playlist-items-once.yml'

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Install libsql
        run: pip install libsql
      - name: Query five mapped playlist items
        env:
          TURSO_DATABASE_URL: libsql://happy-hue-octopus-maciek-hue.aws-eu-west-1.turso.io
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import libsql
          conn = libsql.connect(database=os.environ['TURSO_DATABASE_URL'], auth_token=os.environ['TURSO_AUTH_TOKEN'])
          rows = conn.execute('''
              SELECT
                  i.playlist_id,
                  i.position,
                  i.utwu_id,
                  i.external_track_id,
                  i.source_name,
                  i.source_artist,
                  i.source_album,
                  m.title_original,
                  m.artist_original,
                  m.album_original
              FROM playlist_item AS i
              JOIN middle_end AS m ON m.utwu_id = i.utwu_id
              WHERE i.utwu_id IS NOT NULL
              ORDER BY i.playlist_id, i.position
              LIMIT 5
          ''').fetchall()
          for row in rows:
              print('ROW|' + '|'.join('' if v is None else str(v) for v in row))
          conn.close()
          PY
