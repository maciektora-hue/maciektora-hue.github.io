<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test SQL ROSJA</title><style>body{margin:0;padding:24px;background:#101a16;color:#e7d8ad;font:18px system-ui}h1{color:#e5ad42}.ok{color:#8cc7a0}.bad{color:#f3a6a6}pre{white-space:pre-wrap;word-break:break-word;background:#16231d;padding:14px;border-radius:10px}</style></head><body><h1>Test SQL ROSJA</h1><div id="x">Ładowanie…</div><pre id="p"></pre><script>const API='https://piosenki-api.onrender.com/api/content/rosja';fetch(API,{cache:'no-store'}).then(async r=>{const t=await r.text();if(!r.ok)throw new Error(r.status+' '+r.statusText+'\n'+t);const d=JSON.parse(t);document.getElementById('x').innerHTML='<span class="ok">OK</span> · dokumenty: '+(d.status?.documents??'?')+' · sekcje: '+(d.rows?.length??'?');document.getElementById('p').textContent=JSON.stringify(d.status,null,2)}).catch(e=>{document.getElementById('x').innerHTML='<span class="bad">BŁĄD</span>';document.getElementById('p').textContent=String(e)})</script></body></html>
