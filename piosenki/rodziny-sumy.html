<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Zestawienie rodzin znaczeniowych w tekstach piosenek, uporządkowane według liczby przypisanych wystąpień tagów semantycznych.">
  <title>Rodziny znaczeniowe — wystąpienia</title>
  <style>
    :root{color-scheme:dark;--bg:#18231f;--panel:#223129;--text:#e7c27a;--strong:#f3d796;--muted:#c7b58d;--line:#556b5e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}
    main{max-width:900px;margin:0 auto;padding:28px 20px 64px}
    a{color:var(--strong)}
    h1{margin:.3rem 0 .55rem;font-size:clamp(2.2rem,7vw,4.5rem);line-height:1;color:var(--strong);font-weight:650;letter-spacing:-.03em}
    .meta,.muted{color:var(--muted)}
    .intro,.status{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;margin:1rem 0}
    .intro p{margin:.2rem 0}
    table{width:100%;border-collapse:collapse;margin-top:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
    th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--strong);font-size:.84rem}
    th:last-child,td:last-child{text-align:right;width:150px}
    tr:last-child td{border-bottom:0}
  </style>
</head>
<body>
<main>
  <p class="meta"><a href="slowa.html">← Słowa</a> · <a href="tagi-sumy.html">Tagi</a> · <a href="osie-sumy.html">Osie</a></p>
  <h1>Rodziny znaczeniowe</h1>
  <div class="intro">
    <p>Rodziny są najwyższym poziomem grupowania znaczeń. Łączą kilka osi w większe obszary tematyczne i pokazują, które z nich najczęściej pojawiają się w analizowanych tekstach.</p>
  </div>
  <div id="status" class="status">Ładowanie zestawienia…</div>
  <table id="tabela" hidden>
    <thead>
      <tr><th>Rodzina znaczeniowa</th><th>Wystąpienia</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API = 'https://piosenki-api.onrender.com/api/piosenki';

    function parseTags(value) {
      if (value == null) return [];
      if (Array.isArray(value)) return value.map(String);
      const text = String(value).trim();
      if (!text) return [];
      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) return parsed.map(String);
      } catch (_) {}
      const cleaned = text.replace(/^\s*[\[({]/, '').replace(/[\])}]\s*$/, '');
      return cleaned
        .split(/[,;|\n]+/)
        .map(x => x.trim().replace(/^['"]|['"]$/g, ''))
        .filter(Boolean);
    }

    function baseTag(tag, knownTags) {
      if (knownTags.has(tag)) return tag;
      const i = tag.lastIndexOf(':');
      if (i > 0) {
        const candidate = tag.slice(0, i);
        if (knownTags.has(candidate)) return candidate;
      }
      return tag;
    }

    async function start() {
      const status = document.getElementById('status');
      const table = document.getElementById('tabela');
      const tbody = table.querySelector('tbody');

      try {
        const response = await fetch(API, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();

        const tagToAxes = new Map();
        for (const row of data.tag_axis || []) {
          if (!tagToAxes.has(row.tag)) tagToAxes.set(row.tag, new Set());
          tagToAxes.get(row.tag).add(row.axis_name);
        }
        const knownTags = new Set(tagToAxes.keys());

        const axisToFamily = new Map();
        for (const row of data.axes || []) {
          if (row.family_name) axisToFamily.set(row.axis_name, row.family_name);
        }

        const familyLabels = new Map();
        for (const row of data.families || []) {
          familyLabels.set(row.family_name, row.label || row.family_name);
        }

        const counts = new Map();
        for (const row of data.tag_snapshots || []) {
          for (const rawTag of parseTags(row.tags)) {
            const tag = baseTag(rawTag, knownTags);
            const axes = tagToAxes.get(tag);
            if (!axes) continue;

            const families = new Set();
            for (const axis of axes) {
              const family = axisToFamily.get(axis);
              if (family) families.add(family);
            }

            for (const family of families) {
              counts.set(family, (counts.get(family) || 0) + 1);
            }
          }
        }

        const rows = [...counts.entries()]
          .sort((a, b) => b[1] - a[1] || (familyLabels.get(a[0]) || a[0]).localeCompare(familyLabels.get(b[0]) || b[0], 'pl'));

        for (const [family, count] of rows) {
          const tr = document.createElement('tr');
          const tdName = document.createElement('td');
          const tdCount = document.createElement('td');
          tdName.textContent = familyLabels.get(family) || family;
          tdCount.textContent = count;
          tr.append(tdName, tdCount);
          tbody.appendChild(tr);
        }

        status.textContent = rows.length ? 'Liczba rodzin: ' + rows.length : 'Brak danych do pokazania.';
        table.hidden = rows.length === 0;
      } catch (error) {
        status.textContent = 'Nie udało się teraz pobrać zestawienia.';
      }
    }

    start();
  </script>
</main>
</body>
</html>
