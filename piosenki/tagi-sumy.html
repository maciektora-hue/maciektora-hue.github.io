<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Zestawienie tagów semantycznych występujących w analizowanych tekstach piosenek, wraz z ich wariantami i częstością występowania.">
  <title>Tagi semantyczne — wystąpienia</title>
  <style>
    :root{color-scheme:dark;--bg:#18231f;--panel:#223129;--text:#e7c27a;--strong:#f3d796;--muted:#c7b58d;--line:#556b5e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}
    main{max-width:900px;margin:0 auto;padding:28px 20px 64px}
    a{color:var(--strong)}
    h1{margin:.3rem 0 .55rem;font-size:clamp(2.2rem,7vw,4.5rem);line-height:1;color:var(--strong);font-weight:650;letter-spacing:-.03em}
    .meta,.muted{color:var(--muted)}
    .intro,.status{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;margin:1rem 0}
    .intro p{margin:.2rem 0}
    table{width:100%;border-collapse:collapse;margin-top:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
    th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--strong);font-size:.84rem}
    th:last-child,td:last-child{text-align:right;width:150px}
    tr:last-child td{border-bottom:0}
    tr.tag-glowny td{font-weight:700;border-top:2px solid var(--line)}
    tr.tag-glowny:first-child td{border-top:0}
    tr.wariant td{color:var(--muted)}
    tr.wariant td:first-child{padding-left:34px}
  </style>
</head>
<body>
<main>
  <p class="meta"><a href="slowa.html">← Słowa</a> · <a href="osie-sumy.html">Osie</a> · <a href="rodziny-sumy.html">Rodziny</a></p>
  <h1>Tagi semantyczne</h1>
  <div class="intro">
    <p>Tagi opisują motywy, stany, relacje i mechanizmy obecne w tekstach piosenek. Zestawienie pokazuje, które z nich wracają najczęściej oraz jak rozkładają się ich warianty.</p>
  </div>
  <div id="status" class="status">Ładowanie zestawienia…</div>
  <table id="tabela" hidden>
    <thead>
      <tr><th>Tag i wariant</th><th>Wystąpienia</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API = 'https://piosenki-api.onrender.com/api/piosenki';

    function parseTags(value) {
      if (value == null) return [];
      if (Array.isArray(value)) return value.map(String);
      const text = String(value).trim();
      if (!text) return [];
      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) return parsed.map(String);
      } catch (_) {}
      const cleaned = text.replace(/^\s*[\[({]/, '').replace(/[\])}]\s*$/, '');
      return cleaned
        .split(/[,;|\n]+/)
        .map(x => x.trim().replace(/^['"]|['"]$/g, ''))
        .filter(Boolean);
    }

    function rozdzielTag(tag) {
      const i = tag.indexOf(':');
      if (i === -1) return { nazwa: tag.trim(), wariant: 'bez wariantu' };
      return {
        nazwa: tag.slice(0, i).trim(),
        wariant: tag.slice(i + 1).trim() || 'bez wariantu'
      };
    }

    async function start() {
      const status = document.getElementById('status');
      const table = document.getElementById('tabela');
      const tbody = table.querySelector('tbody');

      try {
        const response = await fetch(API, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        const grupy = new Map();

        for (const row of data.tag_snapshots || []) {
          for (const pelnyTag of parseTags(row.tags)) {
            const { nazwa, wariant } = rozdzielTag(pelnyTag);
            if (!nazwa) continue;
            if (!grupy.has(nazwa)) grupy.set(nazwa, { razem: 0, warianty: new Map() });
            const grupa = grupy.get(nazwa);
            grupa.razem += 1;
            grupa.warianty.set(wariant, (grupa.warianty.get(wariant) || 0) + 1);
          }
        }

        const rows = [...grupy.entries()]
          .sort((a, b) => b[1].razem - a[1].razem || a[0].localeCompare(b[0], 'pl'));

        for (const [nazwa, grupa] of rows) {
          const tr = document.createElement('tr');
          tr.className = 'tag-glowny';
          const tdTag = document.createElement('td');
          const tdCount = document.createElement('td');
          tdTag.textContent = nazwa;
          tdCount.textContent = grupa.razem;
          tr.append(tdTag, tdCount);
          tbody.appendChild(tr);

          const warianty = [...grupa.warianty.entries()]
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'));

          for (const [wariant, count] of warianty) {
            const sub = document.createElement('tr');
            sub.className = 'wariant';
            const tdWariant = document.createElement('td');
            const tdWariantCount = document.createElement('td');
            tdWariant.textContent = '↳ ' + wariant;
            tdWariantCount.textContent = count;
            sub.append(tdWariant, tdWariantCount);
            tbody.appendChild(sub);
          }
        }

        status.textContent = rows.length ? 'Liczba tagów: ' + rows.length : 'Brak danych do pokazania.';
        table.hidden = rows.length === 0;
      } catch (error) {
        status.textContent = 'Nie udało się teraz pobrać zestawienia.';
      }
    }

    start();
  </script>
</main>
</body>
</html>
