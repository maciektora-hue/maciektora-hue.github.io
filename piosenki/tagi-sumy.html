<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumy wystąpień tagów</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; background: #fff; color: #111; }
    h1 { margin-bottom: 8px; }
    #status { margin: 12px 0 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th:last-child, td:last-child { text-align: right; width: 140px; }
  </style>
</head>
<body>
  <h1>Sumy wystąpień tagów</h1>
  <div id="status">Ładowanie…</div>
  <table id="tabela" hidden>
    <thead>
      <tr><th>Tag</th><th>Liczba wystąpień</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API = 'https://piosenki-api.onrender.com/api/piosenki';

    function parseTags(value) {
      if (value == null) return [];
      if (Array.isArray(value)) return value.map(String);

      const text = String(value).trim();
      if (!text) return [];

      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) return parsed.map(String);
      } catch (_) {}

      const cleaned = text.replace(/^\s*[\[({]/, '').replace(/[\])}]\s*$/, '');
      return cleaned
        .split(/[,;|\n]+/)
        .map(x => x.trim().replace(/^['"]|['"]$/g, ''))
        .filter(Boolean);
    }

    async function start() {
      const status = document.getElementById('status');
      const table = document.getElementById('tabela');
      const tbody = table.querySelector('tbody');

      try {
        const response = await fetch(API, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();

        const counts = new Map();
        for (const row of data.tag_snapshots || []) {
          for (const tag of parseTags(row.tags)) {
            counts.set(tag, (counts.get(tag) || 0) + 1);
          }
        }

        const rows = [...counts.entries()]
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'));

        for (const [tag, count] of rows) {
          const tr = document.createElement('tr');
          const tdTag = document.createElement('td');
          const tdCount = document.createElement('td');
          tdTag.textContent = tag;
          tdCount.textContent = count;
          tr.append(tdTag, tdCount);
          tbody.appendChild(tr);
        }

        status.textContent = 'Liczba różnych tagów: ' + rows.length;
        table.hidden = false;
      } catch (error) {
        status.textContent = 'Błąd: ' + error.message;
      }
    }

    start();
  </script>
</body>
</html>
