<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumy wystąpień tagów</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; background: #fff; color: #111; }
    h1 { margin-bottom: 8px; }
    #status { margin: 12px 0 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th:last-child, td:last-child { text-align: right; width: 140px; }
    tr.tag-glowny td { font-weight: 700; border-top: 2px solid #bbb; }
    tr.wariant td:first-child { padding-left: 34px; color: #555; }
    tr.wariant td:last-child { color: #555; }
  </style>
</head>
<body>
  <h1>Sumy wystąpień tagów</h1>
  <div id="status">Ładowanie…</div>
  <table id="tabela" hidden>
    <thead>
      <tr><th>Tag / wariant</th><th>Liczba wystąpień</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API = 'https://piosenki-api.onrender.com/api/piosenki';

    function parseTags(value) {
      if (value == null) return [];
      if (Array.isArray(value)) return value.map(String);

      const text = String(value).trim();
      if (!text) return [];

      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) return parsed.map(String);
      } catch (_) {}

      const cleaned = text.replace(/^\s*[\[({]/, '').replace(/[\])}]\s*$/, '');
      return cleaned
        .split(/[,;|\n]+/)
        .map(x => x.trim().replace(/^['"]|['"]$/g, ''))
        .filter(Boolean);
    }

    function rozdzielTag(tag) {
      const i = tag.indexOf(':');
      if (i === -1) return { nazwa: tag.trim(), wariant: 'bez wariantu' };
      return {
        nazwa: tag.slice(0, i).trim(),
        wariant: tag.slice(i + 1).trim() || 'bez wariantu'
      };
    }

    async function start() {
      const status = document.getElementById('status');
      const table = document.getElementById('tabela');
      const tbody = table.querySelector('tbody');

      try {
        const response = await fetch(API, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();

        const grupy = new Map();

        for (const row of data.tag_snapshots || []) {
          for (const pelnyTag of parseTags(row.tags)) {
            const { nazwa, wariant } = rozdzielTag(pelnyTag);
            if (!nazwa) continue;

            if (!grupy.has(nazwa)) {
              grupy.set(nazwa, { razem: 0, warianty: new Map() });
            }

            const grupa = grupy.get(nazwa);
            grupa.razem += 1;
            grupa.warianty.set(wariant, (grupa.warianty.get(wariant) || 0) + 1);
          }
        }

        const rows = [...grupy.entries()]
          .sort((a, b) => b[1].razem - a[1].razem || a[0].localeCompare(b[0], 'pl'));

        for (const [nazwa, grupa] of rows) {
          const tr = document.createElement('tr');
          tr.className = 'tag-glowny';
          const tdTag = document.createElement('td');
          const tdCount = document.createElement('td');
          tdTag.textContent = nazwa;
          tdCount.textContent = grupa.razem;
          tr.append(tdTag, tdCount);
          tbody.appendChild(tr);

          const warianty = [...grupa.warianty.entries()]
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pl'));

          for (const [wariant, count] of warianty) {
            const sub = document.createElement('tr');
            sub.className = 'wariant';
            const tdWariant = document.createElement('td');
            const tdWariantCount = document.createElement('td');
            tdWariant.textContent = '↳ ' + wariant;
            tdWariantCount.textContent = count;
            sub.append(tdWariant, tdWariantCount);
            tbody.appendChild(sub);
          }
        }

        status.textContent = 'Liczba różnych tagów: ' + rows.length;
        table.hidden = false;
      } catch (error) {
        status.textContent = 'Błąd: ' + error.message;
      }
    }

    start();
  </script>
</body>
</html>
