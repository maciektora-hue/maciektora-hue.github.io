<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa sekcji i anchorów AuDHD</title>
<style>
:root{color-scheme:dark;--bg:#101a16;--panel:#16231d;--panel2:#1b2c24;--line:#33493d;--text:#e7d8ad;--muted:#a9b9ac;--amber:#e5ad42;--green:#8cc7a0;--link:#9fd6c8;--bad:#f3a6a6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.4}
header{position:sticky;top:0;z-index:20;background:rgba(16,26,22,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px}.head{max-width:1800px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 10px 0 0;color:var(--amber);font-weight:800}
input[type=search]{flex:1;min-width:230px;max-width:620px;background:#0d1612;border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:8px;font:inherit}button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer}button:hover{border-color:var(--amber);color:#fff}#stats{color:var(--muted);font-size:13px;margin-left:auto}
main{max-width:1800px;margin:0 auto;padding:14px}.doc{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 12px;overflow:hidden}.doc>summary{cursor:pointer;list-style:none;padding:12px 14px;background:var(--panel2);display:flex;gap:12px;align-items:baseline;position:sticky;top:58px;z-index:10;border-bottom:1px solid transparent}.doc[open]>summary{border-bottom-color:var(--line)}.doc>summary::-webkit-details-marker{display:none}.doc>summary::before{content:'▶';font-size:11px;color:var(--amber);transition:.15s transform}.doc[open]>summary::before{transform:rotate(90deg)}.doc-code{font-weight:900;color:var(--amber);font-size:17px;min-width:42px}.doc-title{font-weight:650;color:var(--text)}.doc-count{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.table-wrap{overflow:auto;max-height:72vh}table{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;background:var(--panel)}th,td{border-bottom:1px solid #2a3b32;border-right:1px solid #25372e;padding:7px 8px;vertical-align:top;text-align:left}th{position:sticky;top:0;z-index:5;background:#203128;color:var(--amber);font-size:12px;text-transform:uppercase;letter-spacing:.04em}th:last-child,td:last-child{border-right:0}tbody tr:hover td{background:#1b2a23}
.c-title{min-width:360px;max-width:720px}.c-anchor{min-width:220px;max-width:380px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:#bfd4c5;overflow-wrap:anywhere}.c-status{width:64px;text-align:center}.c-link{width:70px;text-align:center}.c-code{width:50px;min-width:50px;max-width:50px;padding-left:5px;padding-right:5px;font-weight:800;color:var(--amber);white-space:nowrap}.c-level{width:38px;min-width:38px;max-width:38px;padding-left:4px;padding-right:4px;text-align:center;color:var(--green);font-weight:700;white-space:nowrap}.c-depth{width:48px;min-width:48px;max-width:48px;padding-left:4px;padding-right:4px;text-align:center;color:var(--muted);white-space:nowrap}.c-order{width:50px;min-width:50px;max-width:50px;padding-left:4px;padding-right:5px;text-align:right;color:var(--muted);white-space:nowrap}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}.ok{color:#9ed69e;font-weight:800}.bad{color:var(--bad);font-weight:800}.title-line{display:flex;align-items:flex-start;gap:7px}.branch-btn{border:0;background:transparent;padding:0 2px;color:var(--amber);font-weight:900;line-height:1.4;min-width:17px;cursor:pointer}.branch-btn.leaf{visibility:hidden}.indent{display:inline-block;flex:0 0 auto}.section-title{font-weight:650}.h1 .section-title{font-size:16px;color:#ffd779;font-weight:900}.h2 .section-title{color:#f1c96f;font-weight:800}.h3 .section-title{color:#e8d39d}.hidden-by-branch{display:none}.error{border:1px solid #7a3434;background:#321d1d;color:#ffd2d2;padding:14px;border-radius:8px}
@media(max-width:700px){header{position:static}.head{display:grid;grid-template-columns:1fr 1fr}.head h1,.head input,#stats{grid-column:1/-1}.doc>summary{position:static}.table-wrap{max-height:none}main{padding:8px}.doc>summary{padding:10px}.doc-title{font-size:13px}body{font-size:14px}}
</style>
</head>
<body>
<header><div class="head"><h1>Mapa sekcji i anchorów AuDHD</h1><input id="search" type="search" placeholder="Szukaj w tytule lub anchorze…" autocomplete="off"><button id="openAll" type="button">Rozwiń dokumenty</button><button id="closeAll" type="button">Zwiń dokumenty</button><button id="openBranches" type="button">Rozwiń gałęzie</button><button id="closeBranches" type="button">Zwiń gałęzie</button><span id="stats">Ładowanie…</span></div></header>
<main id="app"></main>
<script>
const API='https://piosenki-api.onrender.com/api/content/audhd';
const KEEP=['dokument_kod','poziom','glebokosc','kolejnosc','sekcja_tytul','anchor','anchor_status','deep_link'];
const app=document.getElementById('app'),search=document.getElementById('search'),stats=document.getElementById('stats');let docs=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function depthNum(r){const n=parseInt(r.glebokosc,10);return Number.isFinite(n)?n:1;}function hasChildren(rows,i){const d=depthNum(rows[i]);return i+1<rows.length&&depthNum(rows[i+1])>d;}
function groupRows(rows){const m=new Map();for(const r of rows){if(!m.has(r.dokument_kod))m.set(r.dokument_kod,[]);m.get(r.dokument_kod).push(r);}return [...m.entries()];}
function render(rows){docs=groupRows(rows);app.innerHTML='';for(const [code,items] of docs){const title=(items.find(r=>r.poziom==='H1')||items[0]).sekcja_tytul||code;const det=document.createElement('details');det.className='doc';det.open=false;det.dataset.code=code;det.innerHTML=`<summary><span class="doc-code">${esc(code)}</span><span class="doc-title">${esc(title)}</span><span class="doc-count">${items.length} sekcji</span></summary>`;const wrap=document.createElement('div');wrap.className='table-wrap';const table=document.createElement('table');table.innerHTML=`<thead><tr><th>sekcja_tytul</th><th>anchor</th><th>status</th><th>link</th><th>ID</th><th>H</th><th>poziom</th><th>nr</th></tr></thead><tbody></tbody>`;const tb=table.querySelector('tbody');items.forEach((r,i)=>{const tr=document.createElement('tr');tr.dataset.depth=depthNum(r);tr.className=(r.poziom||'').toLowerCase();const child=hasChildren(items,i);tr.innerHTML=`<td class="c-title"><div class="title-line"><button class="branch-btn ${child?'':'leaf'}" type="button">▼</button><span class="indent" style="width:${Math.max(0,(depthNum(r)-1)*14)}px"></span><span class="section-title">${esc(r.sekcja_tytul)}</span></div></td><td class="c-anchor">${esc(r.anchor)}</td><td class="c-status ${r.anchor_status==='OK'?'ok':'bad'}">${esc(r.anchor_status)}</td><td class="c-link">${r.deep_link?`<a href="${esc(r.deep_link)}" target="_blank" rel="noopener">otwórz</a>`:''}</td><td class="c-code">${esc(r.dokument_kod)}</td><td class="c-level">${esc(r.poziom)}</td><td class="c-depth">${esc(r.glebokosc)}</td><td class="c-order">${esc(r.kolejnosc)}</td>`;if(child)tr.querySelector('.branch-btn').addEventListener('click',()=>toggleBranch(tb,tr));tr.dataset.search=KEEP.map(k=>r[k]||'').join(' ').toLocaleLowerCase('pl');tb.appendChild(tr);});wrap.appendChild(table);det.appendChild(wrap);app.appendChild(det);}applySearch();}
function toggleBranch(tb,tr,forceCollapse=null){const rows=[...tb.rows],idx=rows.indexOf(tr),d=+tr.dataset.depth,btn=tr.querySelector('.branch-btn'),collapse=forceCollapse===null?btn.textContent==='▼':forceCollapse;btn.textContent=collapse?'▶':'▼';for(let i=idx+1;i<rows.length;i++){const rd=+rows[i].dataset.depth;if(rd<=d)break;rows[i].classList.toggle('hidden-by-branch',collapse);}applySearch();}
function setAllDocs(open){document.querySelectorAll('.doc').forEach(d=>d.open=open)}function setAllBranches(collapse){document.querySelectorAll('tbody').forEach(tb=>{[...tb.rows].forEach(tr=>{const b=tr.querySelector('.branch-btn:not(.leaf)');if(b)b.textContent=collapse?'▶':'▼'});[...tb.rows].forEach(tr=>tr.classList.toggle('hidden-by-branch',collapse&&+tr.dataset.depth>1));});applySearch();}
function applySearch(){const q=search.value.trim().toLocaleLowerCase('pl');let visible=0,total=0;document.querySelectorAll('.doc').forEach(doc=>{let hits=0;doc.querySelectorAll('tbody tr').forEach(tr=>{total++;const match=!q||tr.dataset.search.includes(q),branchHidden=tr.classList.contains('hidden-by-branch');tr.style.display=(match&&(!branchHidden||q))?'':'none';if(match){hits++;visible++;}});doc.style.display=hits?'':'none';if(q&&hits)doc.open=true;});stats.textContent=q?`${visible} / ${total} sekcji`:`${total} sekcji · ${docs.length} dokumentów · SQL`;}
document.getElementById('openAll').onclick=()=>setAllDocs(true);document.getElementById('closeAll').onclick=()=>setAllDocs(false);document.getElementById('openBranches').onclick=()=>setAllBranches(false);document.getElementById('closeBranches').onclick=()=>setAllBranches(true);search.addEventListener('input',applySearch);
fetch(API,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json();}).then(data=>{const rows=Array.isArray(data.rows)?data.rows:[];if(rows.length!==338)throw new Error(`SQL/API: oczekiwano 338 rekordów, jest ${rows.length}`);if(data.status?.documents!==18)throw new Error(`SQL/API: oczekiwano 18 dokumentów, jest ${data.status?.documents}`);render(rows);}).catch(err=>{app.innerHTML=`<div class="error"><strong>Nie udało się wczytać mapy z SQL/API.</strong><br>${esc(err.message)}<br><small>${esc(API)}</small></div>`;stats.textContent='błąd';});
</script>
</body>
</html>
