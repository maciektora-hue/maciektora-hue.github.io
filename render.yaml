# Konfiguracja usługi piosenki-api na Render.
#
# UWAGA, 2026-09-20. Ten plik NIE jest źródłem prawdy dla wdrożenia.
# Usługa srv-daf3ji8n74is73866hd0 została utworzona z panelu i stamtąd bierze
# konfigurację, a nie stąd. Dowód: do 2026-09-20 ten plik deklarował
# `gunicorn content_explorer_app:app`, podczas gdy serwis od początku uruchamiał
# `gunicorn app:app` — i rozjazd przeżył wszystkie wdrożenia.
#
# Wartości poniżej zostały doprowadzone do stanu faktycznego odczytanego z Render,
# żeby ewentualne zastosowanie tego pliku niczego nie zmieniło. SOA dla wdrożenia
# pozostaje panel Render — patrz SOT-SOA-AKTUALNA.md, sekcja 3.
#
# Różnica, która ten rozjazd czyniła groźnym: endpointy definiuje wyłącznie
# piosenki/app.py. piosenki/content_explorer_app.py nie ma ani jednej trasy,
# więc wdrożenie według starej wersji tego pliku dałoby serwis bez API.

services:
  - type: web
    name: piosenki-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: cd piosenki && pip install -r requirements.txt
    startCommand: cd piosenki && gunicorn app:app
    envVars:
      # Ustawiane ręcznie w panelu Render. Nie trzymamy tego w repozytorium.
      - key: SUPABASE_DATABASE_URL
        sync: false
