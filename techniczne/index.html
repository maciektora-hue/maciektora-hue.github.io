<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Techniczne · viewer SQL</title>
<style>
:root{color-scheme:dark;--bg:#0b1815;--panel:#13241e;--panel2:#0f1d18;--text:#f2e7cf;--muted:#b7aa91;--amber:#e0aa43;--hot:#f1c363;--line:rgba(224,170,67,.28);--ok:#8fd6a3;--bad:#e98c8c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#10251f,var(--bg));color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5}main{max-width:1180px;margin:auto;padding:28px 18px 70px}a{color:var(--hot)}h1{margin:.2rem 0;font-size:clamp(2rem,6vw,4rem)}h2{margin:0;font-size:1.2rem}code{color:var(--hot)}.muted{color:var(--muted)}.status{margin:18px 0;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.metric,.table-card{border:1px solid var(--line);background:var(--panel);border-radius:12px}.metric{padding:14px}.metric strong{display:block;font-size:1.55rem;color:var(--hot)}.table-card{margin:14px 0;overflow:hidden}.table-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}.table-head .stats{color:var(--muted)}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid rgba(242,231,207,.09);vertical-align:top}th{color:var(--hot);font-size:.82rem}.pk,.fk{font-weight:800}.pk{color:var(--ok)}.fk{color:#9fc8f5}.none{color:var(--muted)}.error{color:var(--bad)}footer{margin-top:30px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
<p><a href="../">← strona główna</a></p>
<h1>Techniczne · SQL</h1>
<p class="muted">Viewer pokazuje bieżący stan faktycznej bazy Turso / SQLite. Nie odtwarza schematu z plików dokumentacji na GitHubie.</p>
<div id="status" class="status">Pobieram bieżący schemat SQL…</div>
<div id="summary" class="summary" hidden></div>
<div id="tables"></div>
<footer>Odczyt tylko do prezentacji: lista tabel, kolumny, PRIMARY KEY, FOREIGN KEY, liczba wierszy i rozmiary.</footer>
</main>
<script>
const API='https://piosenki-api.onrender.com/api/techniczne/schema';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>n==null?'n/d':n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:n<1073741824?`${(n/1048576).toFixed(2)} MB`:`${(n/1073741824).toFixed(2)} GB`;
const num=n=>new Intl.NumberFormat('pl-PL').format(n);

function metric(label,value){return `<div class="metric"><span class="muted">${esc(label)}</span><strong>${esc(value)}</strong></div>`}
function render(data){
  document.getElementById('status').innerHTML=`Źródło: <code>${esc(data.source)}</code>. Dane pobrane bezpośrednio z działającej bazy.`;
  const db=data.database||{};
  const summary=document.getElementById('summary');
  summary.hidden=false;
  summary.innerHTML=metric('Tabele',num(data.table_count))+metric('Wiersze łącznie',num(data.total_rows))+metric('Rozmiar bazy',bytes(db.size_bytes))+metric('Rozmiary tabel',db.per_table_size_source||'niedostępne');
  document.getElementById('tables').innerHTML=(data.tables||[]).map(t=>{
    const fkByColumn={};
    (t.foreign_keys||[]).forEach(f=>{(fkByColumn[f.from]??=[]).push(f)});
    const rows=(t.columns||[]).map(c=>{
      const fks=fkByColumn[c.name]||[];
      const pk=c.primary_key_position?`<span class="pk">PK${c.primary_key_position>1?' '+c.primary_key_position:''}</span>`:'<span class="none">—</span>';
      const fk=fks.length?fks.map(f=>`<span class="fk">${esc(f.to_table)}.${esc(f.to)}</span>`).join('<br>'):'<span class="none">—</span>';
      return `<tr><td>${esc(c.name)}</td><td><code>${esc(c.type||'')}</code></td><td>${c.not_null?'NOT NULL':'—'}</td><td>${pk}</td><td>${fk}</td><td>${c.default==null?'—':`<code>${esc(c.default)}</code>`}</td></tr>`;
    }).join('');
    return `<section class="table-card"><div class="table-head"><h2>${esc(t.name)}</h2><div class="stats">${num(t.row_count)} wierszy · ${bytes(t.size_bytes)}</div></div><div class="scroll"><table><thead><tr><th>Kolumna</th><th>Typ</th><th>NULL</th><th>PRIMARY KEY</th><th>FOREIGN KEY →</th><th>DEFAULT</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join('');
}

fetch(API,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(render).catch(err=>{
  document.getElementById('status').innerHTML=`<span class="error">Nie udało się pobrać bieżącego schematu: ${esc(err.message)}</span>`;
});
</script>
</body>
</html>
