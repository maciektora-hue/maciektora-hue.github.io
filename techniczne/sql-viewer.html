<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Techniczne · viewer SQL</title>
<style>
:root{color-scheme:dark;--bg:#0b1815;--bg2:#10251f;--panel:#13241e;--panel2:#0f1d18;--text:#f2e7cf;--muted:#b7aa91;--amber:#e0aa43;--hot:#f1c363;--line:rgba(224,170,67,.28);--soft:rgba(242,231,207,.09);--ok:#8fd6a3;--fk:#9fc8f5;--bad:#e98c8c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.45}main{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 70px}a{color:var(--hot)}code{color:var(--hot)}h1{margin:8px 0 4px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.4rem,7vw,5rem);font-weight:500;letter-spacing:-.035em}.lead{max-width:820px;margin:0 0 18px;color:var(--muted)}.status{margin:16px 0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:16px 0 24px}.metric{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:11px;padding:12px 13px}.metric span{display:block;color:var(--muted);font-size:.76rem}.metric strong{display:block;margin-top:2px;color:var(--hot);font-size:1.25rem}.tables{display:grid;gap:8px}.table-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.table-card[open]{border-color:rgba(224,170,67,.48)}.table-card>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:14px;align-items:center;padding:13px 15px}.table-card>summary::-webkit-details-marker{display:none}.name{display:flex;align-items:center;gap:10px;min-width:0}.chev{width:1.15rem;color:var(--amber);font-size:.9rem;transition:transform .15s ease}.table-card[open] .chev{transform:rotate(90deg)}.table-name{font-weight:800;overflow-wrap:anywhere}.stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;color:var(--muted);font-size:.78rem}.pill{display:inline-flex;gap:4px;align-items:baseline;padding:4px 8px;border:1px solid var(--soft);border-radius:999px;background:var(--panel2);white-space:nowrap}.pill strong{color:var(--text);font-weight:750}.body{border-top:1px solid var(--soft);background:var(--panel2)}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--soft);vertical-align:top;font-size:.86rem}th{color:var(--hot);font-size:.75rem;letter-spacing:.02em}tbody tr:last-child td{border-bottom:0}.pk,.fk{font-weight:800}.pk{color:var(--ok)}.fk{color:var(--fk)}.none{color:var(--muted)}.error{color:var(--bad)}footer{margin-top:28px;color:var(--muted);font-size:.8rem}@media(max-width:700px){main{width:min(100% - 20px,1180px)}.table-card>summary{grid-template-columns:1fr;gap:7px}.stats{justify-content:flex-start;padding-left:27px}.pill{padding:3px 7px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

</html>
